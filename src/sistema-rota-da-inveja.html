    bands[i % 3].push(`<path d="M ${f(x)} ${f(y)} q 2 ${f(-h / 2)} ${f(1 + rnd() * 4)} ${f(-h)}" style="stroke:${cv(rnd() < 0.5 ? "#3d8f34" : "#79c450")}" stroke-width="1.3" fill="none"/>`);
  }
  o.push(`<g>`);
  bands.forEach((b, i) => o.push(`<g class="grass" style="animation-delay:${(i * -0.8).toFixed(1)}s">${b.join("")}</g>`));
  for (let i = 0; i < Math.round(life * 18); i++) {
    const x = rnd() * W, y = groundY + 10 + rnd() * 26;
    o.push(`<circle cx="${f(x)}" cy="${f(y)}" r="2" style="fill:${cv(rnd() < 0.5 ? "#fff6c8" : "#f7a8c8")}"/>`);
  }
  o.push(`</g>`);
  /* de dia: folhas e pétalas no vento · de noite: vaga-lumes */
  o.push(`<g class="rb-motes">`);
  const motes = 10 + Math.round(vig * 4);
  for (let i = 0; i < motes; i++) {
    const y = 40 + rnd() * (groundY - 40), dur = 6 + rnd() * 7, petal = rnd() < 0.25 + life * 0.3;
    const col = petal ? (rnd() < 0.5 ? "#fffdf4" : "#ffd6e6") : (rnd() < 0.5 ? g2 : g3);
    o.push(`<ellipse class="mote" style="animation-duration:${f(dur)}s;animation-delay:${f(-rnd() * dur)}s;fill:${col}" cx="0" cy="${f(y)}" rx="${petal ? 3 : 4.2}" ry="${petal ? 1.6 : 2}"/>`);
  }
  for (let i = 0; i < 3; i++) {
    const y = 70 + rnd() * (groundY - 140);
    o.push(`<path class="gust" style="animation-delay:${(i * 2.8).toFixed(1)}s;stroke:var(--gust)" d="M -90 ${f(y)} q 40 -8 80 0 t 80 0" stroke-width="1.1" fill="none" opacity="0"/>`);
  }
  o.push(`</g><g class="rb-flies" style="opacity:0">`);
  for (let i = 0; i < 12; i++) {
    o.push(`<circle class="fly" style="animation-delay:${f(-rnd() * 6)}s;animation-duration:${f(5 + rnd() * 4)}s" cx="${f(rnd() * W)}" cy="${f(150 + rnd() * (groundY - 120))}" r="2.2" fill="#fff2a0"/>`);
  }
  o.push(`</g>`);
  /* clima do comportamento: tempestade (recaída), neblina (diário atrasado), sol pleno (dia completo) */
  let ws = 31;
  const wrnd = () => { ws = (ws * 16807) % 2147483647; return (ws - 1) / 2147483646; };
  if (p.weather === "storm") {
    o.push(`<g class="rb-weather" style="pointer-events:none"><rect width="${W}" height="${H}" fill="#121826" opacity=".42"/>`);
    for (let i = 0; i < 4; i++) {
      const x = 40 + i * 105 + wrnd() * 30, y = 30 + wrnd() * 30, sc = 1 + wrnd() * 0.5;
      o.push(`<g transform="translate(${f(x)} ${f(y)}) scale(${f(sc)})" opacity=".92"><ellipse rx="50" ry="17" fill="#3b4252"/><ellipse cx="-24" cy="-9" rx="26" ry="17" fill="#434c5e"/><ellipse cx="18" cy="-12" rx="30" ry="20" fill="#4c566a"/></g>`);
    }
    for (let i = 0; i < 70; i++) {
      const x = wrnd() * (W + 60), y = wrnd() * H;
      o.push(`<path class="rain" style="animation-delay:${f(-wrnd() * 0.9)}s" d="M ${f(x)} ${f(y - H)} l -5 15" stroke="#a9c4e8" stroke-width="1.2" opacity=".7"/>`);
    }
    for (let i = 0; i < 12; i++) {
      o.push(`<ellipse class="fall" style="animation-delay:${f(-wrnd() * 5)}s;animation-duration:${f(4 + wrnd() * 3)}s" cx="${f(110 + wrnd() * 200)}" cy="${f(90 + wrnd() * 120)}" rx="4" ry="2" fill="${wrnd() < 0.5 ? "#8c6a32" : "#5c8a3a"}"/>`);
    }
    o.push(`<rect class="flash" width="${W}" height="${H}" fill="#ffffff" opacity="0"/></g>`);
  } else if (p.weather === "fog") {
    o.push(`<g class="rb-weather" style="pointer-events:none"><rect width="${W}" height="${H}" fill="#dfe6ee" opacity=".2"/>`);
    for (let i = 0; i < 9; i++) {
      const y = 170 + i * 36 + wrnd() * 20;
      o.push(`<ellipse class="fogb" style="animation-delay:${f(-wrnd() * 14)}s" cx="${f(wrnd() * W)}" cy="${f(y)}" rx="${f(150 + wrnd() * 90)}" ry="${f(20 + wrnd() * 14)}" fill="#eef2f6" opacity="${(0.3 + wrnd() * 0.25).toFixed(2)}"/>`);
    }
    o.push(`</g>`);
  } else if (p.weather === "sun") {
    o.push(`<defs><radialGradient id="${U}Warm" cx=".3" cy=".1" r=".9"><stop offset="0" stop-color="#fff1b8" stop-opacity=".55"/><stop offset="1" stop-color="#ffd27a" stop-opacity="0"/></radialGradient></defs>`);
    o.push(`<g class="rb-weather" style="pointer-events:none"><rect width="${W}" height="${H}" fill="url(#${U}Warm)"/>`);
    for (let i = 0; i < 14; i++) {
      const x = 70 + wrnd() * 260, y = 60 + wrnd() * 220;
      o.push(`<path class="spark" style="animation-delay:${f(wrnd() * 3)}s" d="M ${f(x)} ${f(y - 5)} L ${f(x + 1.3)} ${f(y - 1.3)} L ${f(x + 5)} ${f(y)} L ${f(x + 1.3)} ${f(y + 1.3)} L ${f(x)} ${f(y + 5)} L ${f(x - 1.3)} ${f(y + 1.3)} L ${f(x - 5)} ${f(y)} L ${f(x - 1.3)} ${f(y - 1.3)} Z" fill="#fff6c8"/>`);
    }
    o.push(`</g>`);
  }
  o.push(`</svg>`);
  /* a paleta vai junto no próprio SVG para a pintura por hora */
  o[0] = o[0].replace(" data-u=", ` data-pal='${JSON.stringify(pal)}' data-u=`);
  return o.join("");
}

/* pinta a cena para uma hora: cores por variável, sol e lua por transform */
function rebirthApplyTime(svg, hour, rk) {
  if (!svg) return;
  const pal = JSON.parse(svg.getAttribute("data-pal") || "{}");
  const sky = rbSkyAt(hour);
  const st = svg.style;
  const shade = (c) => rbMix(c, sky.tint, sky.amt);
  st.setProperty("--sky0", sky.top); st.setProperty("--sky1", sky.mid); st.setProperty("--sky2", sky.hor);
  Object.keys(pal).forEach((k) => st.setProperty(`--${k}`, shade(pal[k])));
  st.setProperty("--cloud", rbMix("#ffffff", rbMix(sky.hor, sky.tint, 0.5), Math.min(0.85, sky.amt * 1.6)));
  st.setProperty("--cloudB", rbMix("#e8f4fb", rbMix(sky.mid, sky.tint, 0.5), Math.min(0.85, sky.amt * 1.6)));
  st.setProperty("--gust", rbMix("#ffffff", sky.tint, sky.amt));
  /* sol: arco do nascer ao pôr; mais laranja e maior perto do horizonte */
  const h = sky.h;
  const sunT = (h - RB_SUNRISE) / RB_DAYLEN;
  const arc = Math.sin(Math.PI * Math.max(0, Math.min(1, sunT)));
  const low = 1 - Math.min(1, arc * 2.2);
  const sun = svg.querySelector(".rb-sun");
  if (sun) {
    const x = rbLerp(24, 376, Math.max(-0.05, Math.min(1.05, sunT))), y = 282 - Math.pow(arc, 0.55) * 232;
    sun.style.transform = `translate(${x.toFixed(1)}px, ${y.toFixed(1)}px)`;
    sun.style.opacity = sunT > -0.04 && sunT < 1.04 ? "1" : "0";
    st.setProperty("--sunCore", rbMix("#fffbe6", "#ff8a3a", low));
    st.setProperty("--sunGlow", rbMix("#fff2b0", "#ff6a2a", low));
    const glow = sun.querySelector(".rb-sunglow");
    if (glow) glow.style.transform = `scale(${(1 + rk * 0.35 + low * 0.5).toFixed(2)})`;
    sun.querySelectorAll(".rb-ray").forEach((r) => { r.style.display = low < 0.6 ? "" : "none"; });
  }
  /* lua: sobe às 18h30 e atravessa a noite */
  const nh = h >= 18.5 ? h - 18.5 : h + 5.5;
  const moonT = nh / 11;
  const moon = svg.querySelector(".rb-moon");
  if (moon) {
    const mx = rbLerp(370, 30, Math.max(0, Math.min(1, moonT))), my = 290 - Math.sin(Math.PI * Math.max(0, Math.min(1, moonT))) * 230;
    moon.style.transform = `translate(${mx.toFixed(1)}px, ${my.toFixed(1)}px)`;
    moon.style.opacity = sky.night > 0.15 && moonT >= 0 && moonT <= 1 ? sky.night.toFixed(2) : "0";
  }
  const stars = svg.querySelector(".rb-stars"); if (stars) stars.style.opacity = sky.night.toFixed(2);
  const flies = svg.querySelector(".rb-flies"); if (flies) flies.style.opacity = sky.night > 0.5 ? "1" : "0";
  const motes = svg.querySelector(".rb-motes"); if (motes) motes.style.opacity = (1 - sky.night).toFixed(2);
  const bow = svg.querySelector(".rb-rainbow"); if (bow) bow.style.opacity = ((1 - sky.night) * 0.6).toFixed(2);
}

/* timelapse: do amanhecer (ou do fim da tarde, de madrugada) até a hora atual em ~4 s */
function rebirthTimelapse(svg, hour, rk, onDone) {
  const from = hour >= 5 ? 5 : 17;
  const to = hour >= 5 ? hour : hour + 24;
  svg.style.setProperty("--rbT", "0s");
  rebirthApplyTime(svg, from, rk);
  void svg.getBoundingClientRect();
  svg.style.setProperty("--rbT", "0.12s");
  const t0 = performance.now(), D = 4000;
  let timer = null, stopped = false;
  const step = () => {
    if (stopped) return;
    const k = Math.min(1, (performance.now() - t0) / D);
    const e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    rebirthApplyTime(svg, from + (to - from) * e, rk);
    if (k < 1) timer = setTimeout(step, 110);
    else if (onDone) onDone();
  };
  step();
  return () => { stopped = true; clearTimeout(timer); };
}

/* ==================== MAPA DA ROTA (desenho) ==================== */
/* a trilha sobe a montanha: um acampamento por mês, o portão no fim da rota e as bandeiras dos objetivos no cume.
   O céu e a luz seguem a hora real (mesma pintura da árvore) e o clima segue o seu dia. */
function rotaMapSVG(p) {
  const W = 390, H = 640, U = p.uid || "rm";
  let seed = 7;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
  const f = (n) => n.toFixed(1);
  const pal = {};
  const cv = (base) => { let k = Object.keys(pal).find((x) => pal[x] === base); if (!k) { k = `c${Object.keys(pal).length}`; pal[k] = base; } return `var(--${k})`; };
  const o = [];
  o.push(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" style="display:block" data-u="${U}">`);
  o.push(`<defs>
    <linearGradient id="${U}Sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--sky0)"/><stop offset=".55" style="stop-color:var(--sky1)"/><stop offset="1" style="stop-color:var(--sky2)"/></linearGradient>
    <radialGradient id="${U}Sun"><stop offset="0" style="stop-color:var(--sunCore)"/><stop offset=".25" style="stop-color:var(--sunGlow)" stop-opacity=".9"/><stop offset="1" style="stop-color:var(--sunGlow)" stop-opacity="0"/></radialGradient>
    <linearGradient id="${U}Main" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:${cv("#8496a3")}"/><stop offset=".28" style="stop-color:${cv("#6f8f78")}"/><stop offset=".6" style="stop-color:${cv("#4f8a4f")}"/><stop offset="1" style="stop-color:${cv("#2f6b35")}"/></linearGradient>
    <radialGradient id="${U}Torch"><stop offset="0" stop-color="#fff3c0"/><stop offset=".5" stop-color="#ffb02e" stop-opacity=".7"/><stop offset="1" stop-color="#ffb02e" stop-opacity="0"/></radialGradient>
    <radialGradient id="${U}Halo"><stop offset="0" stop-color="#fff6c8" stop-opacity=".7"/><stop offset="1" stop-color="#fff6c8" stop-opacity="0"/></radialGradient>
  </defs>`);
  o.push(`<rect width="${W}" height="${H}" fill="url(#${U}Sky)"/>`);
  o.push(`<g class="rb-stars" style="opacity:0">`);
  for (let i = 0; i < 44; i++) o.push(`<circle class="star" style="animation-delay:${f(rnd() * 4)}s" cx="${f(rnd() * W)}" cy="${f(rnd() * 260)}" r="${(0.6 + rnd() * 1.1).toFixed(2)}" fill="#ffffff" opacity="${(0.4 + rnd() * 0.6).toFixed(2)}"/>`);
  o.push(`</g>`);
  o.push(`<g class="rb-sun" style="opacity:0"><circle class="rb-sunglow" r="80" fill="url(#${U}Sun)"/><circle r="16" style="fill:var(--sunCore)"/></g>`);
  o.push(`<g class="rb-moon" style="opacity:0"><circle r="36" fill="#cfd8ff" opacity=".12"/><circle r="13" fill="#f2f4ff"/><circle cx="5" cy="-3" r="11" style="fill:var(--sky0)" opacity=".92"/></g>`);
  [[150, 70, 0.75, 110], [330, 85, 1, 80], [70, 75, 0.85, 95]].forEach(([y, dur, sc, dl]) => {
    o.push(`<g class="cloud" style="animation-duration:${dur}s;animation-delay:${-dl * 0.4}s"><g transform="translate(0 ${y}) scale(${sc})" opacity=".85"><ellipse rx="44" ry="13" style="fill:var(--cloud)"/><ellipse cx="-20" cy="-8" rx="24" ry="13" style="fill:var(--cloud)"/><ellipse cx="16" cy="-11" rx="26" ry="15" style="fill:var(--cloud)"/></g></g>`);
  });
  /* serra ao fundo, só cenário */
  o.push(`<path d="M -10 330 L 40 205 L 85 280 L 120 240 L 150 300 L 250 300 L 280 230 L 318 150 L 352 230 L 400 180 L 400 480 L -10 480 Z" style="fill:${cv("#9db8d0")}"/>`);
  const snow = cv("#f4f8fb");
  o.push(`<path d="M 28 235 L 40 205 L 52 233 L 46 229 L 40 237 L 34 229 Z" style="fill:${snow}"/><path d="M 306 178 L 318 150 L 330 176 L 324 172 L 318 180 L 312 172 Z" style="fill:${snow}"/>`);
  if (p.rainbow) {
    const cols = ["#ff5a5a", "#ffa94d", "#ffe066", "#69db7c", "#4dabf7", "#9775fa"];
    o.push(`<g class="rb-rainbow" style="opacity:0;pointer-events:none">${cols.map((c, i) => `<path d="M ${f(-30 + i * 7)} 420 A ${225 - i * 7} ${230 - i * 6} 0 0 1 ${f(420 - i * 7)} 420" stroke="${c}" stroke-width="7" fill="none" opacity=".7"/>`).join("")}</g>`);
  }
  o.push(`<path d="M -10 470 Q 60 420 130 450 Q 200 480 260 440 Q 330 400 400 450 L 400 640 L -10 640 Z" style="fill:${cv("#a9c7dc")}"/>`);
  o.push(`<path d="M -10 525 Q 90 485 170 512 Q 260 545 400 505 L 400 640 L -10 640 Z" style="fill:${cv("#8fb7a2")}"/>`);
  /* a montanha */
  o.push(`<path d="M -30 640 C 40 560 70 500 100 440 C 130 380 150 300 168 220 C 178 170 186 120 195 92 C 204 120 214 170 226 222 C 244 300 262 380 292 440 C 322 500 350 560 420 640 Z" fill="url(#${U}Main)"/>`);
  o.push(`<path d="M 195 92 C 204 120 214 170 226 222 C 244 300 262 380 292 440 C 322 500 350 560 420 640 L 232 640 C 224 520 214 380 205 240 C 200 170 197 130 195 92 Z" fill="#0b1a12" opacity=".16"/>`);
  o.push(`<path d="M 172 198 C 180 160 188 120 195 92 C 202 120 210 160 220 202 C 213 193 207 205 200 195 C 193 207 186 191 180 201 C 177 197 175 196 172 198 Z" style="fill:${snow}"/>`);
  o.push(`<path d="M -10 640 Q 100 592 195 606 Q 300 620 400 592 L 400 640 Z" style="fill:${cv("#3d8f34")}"/>`);
  /* trilha */
  const pts = p.points;
  let d = `M ${f(pts[0].x)} ${f(pts[0].y)}`;
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1], b = pts[i];
    d += ` C ${f(a.x + (b.x - a.x) * 0.85)} ${f(a.y)}, ${f(b.x)} ${f(a.y - (a.y - b.y) * 0.3)}, ${f(b.x)} ${f(b.y)}`;
  }
  o.push(`<path d="${d}" style="stroke:${cv("#5a3a1a")}" stroke-width="8" fill="none" stroke-linecap="round" opacity=".28"/>`);
  o.push(`<path class="mp-draw" d="${d}" stroke="#fff6c8" stroke-width="2.5" fill="none" stroke-dasharray="7 7" stroke-linecap="round"/>`);

                <path d="M -9 -12 C -16 2, -18 20, -15 32 L 15 32 C 18 18, 14 0, 9 -12 Z" fill="#1a1630" />
                <path d="M -15 32 L -11 27 L -7 32 L -2 26 L 3 32 L 8 27 L 15 32 Z" fill="#0b0a18" />
                <path d="M -9 -12 C -16 2, -18 20, -15 32 L -12 32 C -14 18, -12 2, -6 -11 Z" fill={auraColor} opacity=".7" />
              </g>
              <path d="M -9 -13 C -9 -26, 9 -26, 9 -13 C 6 -9, -6 -9, -9 -13 Z" fill="#241d3d" />

        </div>
        <button onClick={() => setSheet({ kind: "fire" })} aria-label={`Fogueira do NoFap: ${nfDays} dias`}

          {lit && [[24, 6, 0], [34, -8, -0.6], [44, 10, -1.1], [30, -4, -1.5]].slice(0, nfDays >= 28 ? 4 : nfDays >= 7 ? 3 : 2).map(([x, dx, d], i) => (
            <span key={i} className="sc-ember" style={{ "--dx": `${dx}px`, position: "absolute", left: `${(x / 74) * 100}%`, bottom: 44, width: 3, height: 3, borderRadius: "50%", background: "#ffd166", animationDelay: `${d}s` }} />
          ))}
          {!lit && (<>
            <span className="sc-smoke" style={{ position: "absolute", left: "40%", bottom: 22, width: 14, height: 14, borderRadius: "50%", background: "#9ca3af" }} />
            <span className="sc-smoke" style={{ position: "absolute", left: "35%", bottom: 20, width: 12, height: 12, borderRadius: "50%", background: "#9ca3af", animationDelay: "-1.2s" }} />
          </>)}
          <span style={{ position: "absolute", left: -8, right: -8, bottom: -18, textAlign: "center", fontSize: 11, fontWeight: 700, color: "#ffd166", textShadow: "0 1px 2px #000" }}>NoFap · {nfDays} d</span>
        </button>
        <button onClick={() => setSheet({ kind: "chest" })} aria-label={`Moedas: ${state.coins}`}
          style={{ position: "absolute", left: `${(318 / 390) * 100}%`, top: `${(536 / 600) * 100}%`, width: "12.8%", height: "8%", background: "none", border: "none", padding: 0, cursor: "pointer" }}>
          <span style={{ position: "absolute", left: -10, right: -10, top: "100%", textAlign: "center", fontSize: 11, fontWeight: 700, color: "#facc15", textShadow: "0 1px 2px #000" }}>🪙 <span className="sc-count" style={{ "--to": state.coins }} /></span>
        </button>
      </div>
      <div data-pn="" style={{ padding: "10px 12px 12px", background: T.panel, border: `1px solid ${T.border}`, borderTop: "none" }}>
        <div style={{ display: "flex", alignItems: "baseline", gap: 8, flexWrap: "wrap" }}>
          <span style={{ fontFamily: F.display, fontSize: 20, color: T.text }}>{state.heroName || "Herói sem nome"}</span>
          <span style={{ fontSize: 13, color: T.muted }}>Nível {lvl} · <span style={{ color: RANK_COLOR[rank], fontWeight: 700 }}>Rank {rank}</span> · 「{title}」</span>
        </div>
        <div style={{ position: "relative", height: 10, background: T.track, marginTop: 8, borderRadius: 5, overflow: "hidden" }}>
          <div className="sc-fill" style={{ "--w": `${pctXp}%`, position: "absolute", left: 0, top: 0, bottom: 0, background: `linear-gradient(90deg, ${T.accent}, #ffb02e)`, borderRadius: 5 }} />
        </div>
        <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, color: T.muted, marginTop: 5 }}>
          <span>{into}/{need} XP para o nível {lvl + 1} · <span className="sc-count" style={{ "--to": pctXp }} />%</span>
          <span>streak {state.streak || 0}🔥</span>
        </div>
      </div>
      {sheet && sheet.kind === "torch" && (
        <MapSheet title={`${DOW[sheet.i]} ${fmtDM(sheet.w.key)} · ${sheet.isToday && !sheet.w.xp ? "hoje" : `${sheet.w.xp} XP`}`} kicker="XP DESTA SEMANA · TOCHA DO DIA" color="#ffb02e" onClose={() => setSheet(null)} backLabel="Fechar">
          {sheet.w.items.length ? sheet.w.items.slice(0, 8).map((h, j) => (
            <div key={j} style={{ display: "flex", justifyContent: "space-between", gap: 8, padding: "6px 0", borderTop: `1px solid ${T.border}55`, fontSize: 14 }}>
              <span style={{ color: T.text }}>{h.text}</span><span style={{ color: T.good, fontWeight: 700 }}>+{h.xp}</span>
            </div>
          )) : <div style={{ fontSize: 14, color: T.muted, lineHeight: 1.5 }}>{sheet.isToday ? "A tocha de hoje está apagada esperando: qualquer XP no dia acende. Quanto mais XP, maior a chama." : sheet.past ? "Nenhum XP neste dia: a tocha ficou apagada." : "Dia que ainda não chegou."}</div>}
        </MapSheet>
      )}
      {sheet && sheet.kind === "fire" && (
        <MapSheet title={lit ? `Fogueira · ${nfDays} dia(s)` : recent ? "Fogueira apagada" : "Fogueira sem fogo"} kicker="SEQUÊNCIA NOFAP" color="#ff7a1a" onClose={() => setSheet(null)} backLabel="Fechar">
          <div style={{ fontSize: 14, color: T.muted, lineHeight: 1.5, marginBottom: 6 }}>{lit ? "A fogueira cresce a cada semana vencida: pequena na 1ª, forte na 4ª." : recent ? "Recaída nas últimas 24h: o fogo apagou e recomeça pequeno." : state.nofap && state.nofap.active && state.nofap.start > today ? `A sequência começa em ${fmtDM(state.nofap.start)}.` : "A sequência ainda não foi iniciada."}</div>
          {sheetRow("Sequência", `${nfDays} dia(s)`)}
          {sheetRow("Recorde", `${Math.max((state.nofap && state.nofap.best) || 0, nfDays)} dia(s)`, T.gold)}
          {sheetRow("Vitórias totais", `${(state.nofap && state.nofap.wins) || 0} dia(s)`, T.good)}
          <button onClick={() => { setSheet(null); if (onNoFap) onNoFap(); }} style={{ ...btnPrimary, width: "100%", marginTop: 12 }}>Ver a sequência e registrar recaída</button>
        </MapSheet>
      )}
      {sheet && sheet.kind === "chest" && (
        <MapSheet title={`${state.coins} moedas`} kicker="BAÚ" color="#facc15" onClose={() => setSheet(null)} backLabel="Fechar">
          <div style={{ fontSize: 14, color: T.muted, lineHeight: 1.5 }}>Moedas vêm de metas, diário e bônus. Gaste na Loja do Sistema.</div>
          {onShop && <button onClick={() => { setSheet(null); onShop(); }} style={{ ...btnPrimary, width: "100%", marginTop: 12 }}>Abrir a Loja</button>}
        </MapSheet>
      )}
      {sheet && sheet.kind === "flag" && (() => {
        const f = sheet.f, st = finalStatus(f, today, state.deadline), b = routeBranch(state, f, today);
        return (
          <MapSheet title={f.title} kicker="OBJETIVO NO CUME" color={sheet.color} onClose={() => setSheet(null)} backLabel="Fechar">
            {sheetRow("Prazo", f.done ? "concluído ✓" : st.overdue ? `vencido há ${-st.left} d` : `${st.left} dia(s) · ${fmtDM(st.eff)}`, st.overdue ? T.danger : null)}
            {sheetRow("Marcos", `${st.msDone}/${st.msTotal}`, T.gold)}
            {sheetRow("Metas do mês", `${b.months.filter((m) => m.done).length}/${b.months.length}`)}
            {sheetRow("Folhas (semanas)", `${b.weeks.length}`, T.good)}
            {b.dry && !f.done && <div style={{ fontSize: 13, color: "#e0c08a", marginTop: 8 }}>🍂 Parado: nenhuma meta alimentou este objetivo em 14 dias.</div>}
            {onOpenTree && <button onClick={() => { setSheet(null); onOpenTree(); }} style={{ ...btnPrimary, width: "100%", marginTop: 12 }}>Abrir na árvore</button>}
          </MapSheet>
        );
      })()}
    </div>
  );
}

function HunterChamber({ state, lvl, rank, title, into, need }) {
  const box = useRef(null);
  useScenePause(box);
  const [sheet, setSheet] = useState(null);
  const ri = Math.max(0, DIFFS.indexOf(rank));
  const aura = RANK_BASE[rank] || "#9ca3af";
  const motes = 3 + ri * 3;
  const spin = `${16 - ri * 2.4}s`;
  const free = skillPointsFree(state);
  const gains = weekGains(state);
  const pctXp = Math.min(100, Math.round((into / need) * 100));
  const cls = state.heroClass ? CLASSES[state.heroClass] : null;
  const POS = [[44, 560], [104, 610], [195, 640], [286, 610], [346, 560]];
  const hexA = (h, a) => `${h}${Math.round(a * 255).toString(16).padStart(2, "0")}`;
  return (
    <div ref={box} className="scene-box" style={{ position: "relative", marginBottom: 14 }}>
      <style>{SCENE_CSS}</style>
      <div style={{ position: "relative", width: "100%", aspectRatio: "390 / 720", overflow: "hidden", border: `1px solid #142033`, background: "radial-gradient(ellipse at 50% 62%, #12203a 0%, #070c18 55%, #04060d 100%)" }}>
        <svg viewBox="0 0 390 720" width="100%" height="100%" aria-hidden="true" style={{ position: "absolute", inset: 0 }}>
          <defs><linearGradient id="hcBeam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stopColor="#7dd3fc" stopOpacity=".35" /><stop offset="1" stopColor="#7dd3fc" stopOpacity="0" /></linearGradient></defs>
          <path d="M 40 720 L 70 300 L 100 300 L 120 720 Z" fill="#0a1222" />
          <path d="M 350 720 L 320 300 L 290 300 L 270 720 Z" fill="#0a1222" />
          <path className="hc-beam" d="M 160 0 L 230 0 L 300 560 L 90 560 Z" fill="url(#hcBeam)" />
          <ellipse cx="195" cy="600" rx="150" ry="34" fill="#0f1b30" stroke="#1e3a5f" strokeWidth="1.5" />
        </svg>
        <div className="hc-win" style={{ position: "absolute", left: "5.6%", right: "5.6%", top: "2.5%", padding: "10px 14px 12px", background: "rgba(8,24,48,.86)", border: "1px solid #38bdf8", boxShadow: "0 0 22px rgba(56,189,248,.35), inset 0 0 18px rgba(56,189,248,.15)" }}>
          <div style={{ textAlign: "center", fontSize: 12, fontWeight: 700, letterSpacing: 3, color: "#7dd3fc" }}>⟪ JANELA DE STATUS ⟫</div>
          <div className="hc-type" style={{ fontFamily: F.display, fontSize: 26, color: "#e0f2fe", marginTop: 4, animationDelay: ".7s", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{state.heroName || "Herói sem nome"}</div>
          <div className="hc-type" style={{ fontSize: 14, color: "#bae6fd", animationDelay: ".95s" }}>NÍVEL {lvl} · RANK <b style={{ color: aura }}>{rank}</b> · 「{title}」{cls ? ` · ${cls.icon} ${cls.name}` : ""}</div>
          <div style={{ position: "relative", height: 9, background: "#0c2340", border: "1px solid #1e4a75", marginTop: 9, overflow: "hidden" }}>
            <div className="sc-fill" style={{ "--w": `${pctXp}%`, position: "absolute", left: 0, top: 0, bottom: 0, background: "linear-gradient(90deg, #0ea5e9, #e0f2fe)", animationDelay: "1.2s" }} />
            <div className="hc-shine" style={{ position: "absolute", top: 0, bottom: 0, width: 34, background: "linear-gradient(90deg, transparent, rgba(255,255,255,.75), transparent)" }} />
          </div>
          <div className="hc-type" style={{ fontSize: 12, color: "#7dd3fc", marginTop: 5, animationDelay: "1.2s" }}>XP {into}/{need} · {free} ponto(s) livre(s) · streak {state.streak || 0}🔥</div>
        </div>
        <div className="hc-breath" style={{ "--lo": 0.25 + ri * 0.06, "--hi": 0.5 + ri * 0.1, position: "absolute", left: "24%", top: "41%", width: "52%", height: "42%", borderRadius: "50%", background: `radial-gradient(ellipse, ${hexA(aura, 0.3 + ri * 0.06)} 0%, transparent 65%)` }} />
        <svg className="hc-spin" viewBox="0 0 300 80" aria-hidden="true" style={{ "--spd": spin, position: "absolute", left: "11.5%", top: "77.8%", width: "77%", transformOrigin: "50% 50%" }}>
          <ellipse cx="150" cy="40" rx="128" ry="26" fill="none" stroke={aura} strokeWidth="2" strokeDasharray={`${4 + ri * 6} ${12 - ri * 2}`} opacity=".85" />
        </svg>
        <svg className="hc-spinr" viewBox="0 0 300 80" aria-hidden="true" style={{ "--spd": spin, position: "absolute", left: "11.5%", top: "77.8%", width: "77%", transformOrigin: "50% 50%" }}>
          <ellipse cx="150" cy="40" rx="100" ry="19" fill="none" stroke={aura} strokeWidth="1" strokeDasharray="2 6" opacity=".6" />
        </svg>
        {Array.from({ length: motes }, (_, i) => (
          <span key={i} className="hc-mote" style={{ "--d": `${(2 + (i % 4) * 0.5).toFixed(1)}s`, position: "absolute", left: `${((120 + ((i * 41) % 150)) / 390) * 100}%`, top: `${((470 + ((i * 29) % 120)) / 720) * 100}%`, width: 3 + (i % 3), height: 3 + (i % 3), borderRadius: "50%", background: aura, boxShadow: `0 0 8px ${aura}`, animationDelay: `${-(i * 0.4)}s` }} />
        ))}
        <button className="hc-hero" onClick={() => setSheet({ kind: "hero" })} aria-label="O caçador: rank e classe"
          style={{ position: "absolute", left: "37.2%", top: "52.8%", width: "25.6%", height: "30.5%", background: "none", border: "none", padding: 0, cursor: "pointer" }}>
          <HunterArt aura={aura} eyes={aura} style={{ width: "100%", height: "100%" }} />
        </button>
        {CORE_ATTRS.map((a, i) => {
          const lv = attrLevel(state.attrs[a]);
          const h = 26 + Math.min(12, lv) * 7;
          const color = ATTR_HUE[a] || "#9aa3b2";
          return (
            <button key={a} onClick={() => setSheet({ kind: "attr", a })} aria-label={`${a}: nível ${lv}`}
              style={{ position: "absolute", left: `${((POS[i][0] - 23) / 390) * 100}%`, top: `${((POS[i][1] - 50) / 720) * 100}%`, width: "11.8%", height: "15.3%", background: "none", border: "none", padding: 0, cursor: "pointer" }}>
              <span className={gains[i] > 0 ? "hc-pulse" : "hc-crystal"} style={{ "--c": color, position: "absolute", left: "15%", bottom: 26, width: "70%", height: h, animationDelay: `${0.9 + i * 0.12}s` }}>
                <svg width="100%" height={h} viewBox="0 0 32 100" preserveAspectRatio="none" aria-hidden="true"><path d="M16 0 L30 22 L26 100 L6 100 L2 22 Z" fill={color} opacity=".85" /><path d="M16 0 L16 100 L6 100 L2 22 Z" fill="#ffffff" opacity=".18" /></svg>
              </span>
              <span style={{ position: "absolute", left: 0, right: 0, bottom: 18, height: 10, borderRadius: "50%", background: "#0f1b30", border: "1px solid #1e3a5f" }} />
              <span style={{ position: "absolute", left: -14, right: -14, bottom: 0, textAlign: "center", fontSize: 11, fontWeight: 700, color }}>{ATTR_INFO[a].icon} {lv}</span>
            </button>
          );
        })}
      </div>
      {sheet && sheet.kind === "attr" && (() => {
        const a = sheet.a, pts = Math.round(state.attrs[a] || 0), lv = attrLevel(pts);
        const subs = subPoints(state.attrs, state.attrLog, a).filter((x) => x.id !== "geral" || x.pts > 0);
        const gi = gains[CORE_ATTRS.indexOf(a)];
        return (
          <MapSheet title={`${ATTR_INFO[a].icon} ${a} · Nv ${lv}`} kicker="ATRIBUTO · CRISTAL" color={ATTR_HUE[a]} onClose={() => setSheet(null)} backLabel="Fechar">
            <div style={{ fontSize: 14, color: T.muted, lineHeight: 1.5 }}>{ATTR_INFO[a].def}</div>
            <div style={{ fontSize: 13, color: gi > 0 ? T.good : T.muted, margin: "6px 0" }}>{pts} pts · {pts % 100}/100 para o nível {lv + 1}{gi > 0 ? ` · +${gi} nesta semana (o cristal pisca)` : " · 0 nesta semana"}</div>
            {subs.map((x) => (
              <div key={x.id} style={{ display: "flex", justifyContent: "space-between", gap: 8, padding: "6px 0", borderTop: `1px solid ${T.border}55`, fontSize: 14 }}>
                <span>{x.name}</span><span style={{ color: T.gold, fontWeight: 700 }}>Nv {attrLevel(x.pts)} · {x.pts} pts</span>
              </div>
            ))}
            <div style={{ fontSize: 12, color: T.muted, marginTop: 8 }}>Alimenta: {ATTR_INFO[a].feeds}.</div>
          </MapSheet>
        );
      })()}
      {sheet && sheet.kind === "hero" && (
        <MapSheet title={`Rank ${rank} · 「${title}」`} kicker="CAÇADOR" color={aura} onClose={() => setSheet(null)} backLabel="Fechar">
          <div style={{ fontSize: 14, color: T.muted, lineHeight: 1.5 }}>A aura muda de cor e fica mais forte a cada rank: E cinza, D azul, C verde, B roxa, A rosa, S dourada.</div>
          <div style={{ fontSize: 14, color: T.text, lineHeight: 1.5, marginTop: 6 }}>{cls ? `Classe: ${cls.icon} ${cls.name}. ${cls.desc}` : `Classe: libera no nível ${CLASS_LEVEL}.`}</div>
        </MapSheet>
      )}
    </div>
  );
}

function ShopForge({ onAdd, effort }) {
  const [icon, setIcon] = useState("📜");

  const ICONS = ["📜", "📖", "🧪", "🗝️", "⚔️", "🛡️", "💍", "🔮", "🏺", "🪙", "🎭", "🕯️", "⏳", "🍖", "🎮", "🎬"];
  const ok = txt.trim() && effect.trim() && +price > 0;
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
      <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
        {ICONS.map((ic) => (
          <button key={ic} onClick={() => setIcon(ic)} aria-pressed={icon === ic}
            style={{ width: 38, height: 38, fontSize: 19, background: icon === ic ? "rgba(251,191,36,0.2)" : "transparent", border: `1px solid ${icon === ic ? "#fbbf24" : T.border}`, cursor: "pointer" }}>{ic}</button>
        ))}
      </div>
      <input id="forge-name" value={txt} onChange={(e) => setTxt(e.target.value)} placeholder="Nome do item (ex: Pergaminho do Descanso)…" style={inputStyle} />
      <input id="forge-effect" value={effect} onChange={(e) => setEffect(e.target.value)} placeholder="O que ele faz (ex: direito de dormir o dia inteiro)…" style={inputStyle} />
      <div style={{ display: "flex", gap: 8 }}>
        <select id="forge-rarity" value={rarity} onChange={(e) => setRarity(e.target.value)} style={{ ...inputStyle, flex: 1, color: (SHOP_RAR[rarity] || SHOP_RAR["Comum"])[0], fontWeight: 700 }}>
          {Object.keys(RARITIES).map((r) => <option key={r} value={r}>{r}</option>)}
        </select>
        <input id="forge-price" value={price} onChange={(e) => setPrice(e.target.value.replace(/\D/g, ""))} placeholder="Preço 🪙" inputMode="numeric" style={{ ...inputStyle, flex: 0.8, minWidth: 74 }} />
      </div>
      {+price > 0 && <div style={{ fontSize: 12, color: T.muted }}>No seu ritmo, {price} moedas = {effort(+price)}.</div>}
      <button disabled={!ok} onClick={() => onAdd(icon, txt.trim(), effect.trim(), +price, rarity)} style={{ ...btnPrimary, background: "#fbbf24", color: "#111", opacity: ok ? 1 : 0.45 }}>⚒ Forjar</button>
    </div>
  );
}

/* ==================== ÁRVORE EM 20 ESTÁGIOS (v65) ==================== */
/* uma pintura a cada 5% da rota; o % é o mesmo do mapa (marcos dos objetivos finais) */
const TREE_STAGES = ["Solo marcado", "Semente desperta", "Broto", "Plântula", "Muda", "Muda lenhosa", "Arvoreta", "Primeiros galhos", "Árvore jovem", "Copa formada",
  "Árvore firme", "Tronco grosso", "Árvore adulta", "Runas acesas", "Primeiros frutos", "Árvore antiga", "Raízes de pedra", "Árvore anciã", "Colosso", "Árvore-mundo"];
const treeArt = (i) => `arvore/e${String(i + 1).padStart(2, "0")}.webp`;
const treeThumb = (i) => `arvore/t${String(i + 1).padStart(2, "0")}.webp`;
function treeStageInfo(state) {
  const fs = state.finals || [];
  const p = routeProgress(fs);
  const pct = Math.round(p * 100);
  const N = TREE_STAGES.length;
  const i = Math.max(0, Math.min(N - 1, Math.floor(pct / 5)));
  const last = i === N - 1;
  const nextAt = last ? 100 : (i + 1) * 5;
  /* quantos marcos, em média, levam ao próximo estágio */
  const steps = fs.filter((f) => !f.done).map((f) => 100 / (((f.milestones || []).length + 1) * fs.length));
  const avg = steps.length ? steps.reduce((a, b) => a + b, 0) / steps.length : 0;
  const need = nextAt - 0.5 - p * 100;
  const marcos = last || !(avg > 0) ? null : Math.max(1, Math.ceil(need / avg - 1e-9));
  return { p, pct, i, name: TREE_STAGES[i], nextAt, last, marcos };
}

                else { const m = b.months[si - 1]; setLeafSel(m && m.done ? { title: m.title, date: m.date || "", xp: m.xp, subName: "meta do mês" } : null); }
                setSubSel(null);
                return;
              }
              const a = CORE_ATTRS[bi];
              const x = a ? subPoints(state.attrs, state.attrLog, a).filter((y) => y.id !== "geral" || y.pts > 0)[si] : null;
              if (!x) return;
              const list = (state.leafLog || []).filter((l) => l.attr === a && l.sub === x.id);
              setLeafSel(list[li] ? { ...list[li], subName: x.name } : null); setSubSel(null);
            }}
            onFruit={(w) => { setFruit(fruit === w ? null : w); setSel(null); setBranch(null); }} />
        </div>
        {zoom && (
          <button onClick={closeBranch} aria-label="Voltar para a árvore inteira" style={{ position: "absolute", left: 10, top: 10, zIndex: 2, background: "rgba(11,5,7,.82)", border: `1px solid ${T.gold}`, color: T.gold, padding: "7px 12px", fontSize: 14, fontWeight: 700, cursor: "pointer", fontFamily: F.ui }}>
            ‹ Árvore inteira
          </button>
        )}
        {zoom && (
          <div style={{ position: "absolute", right: 10, top: 10, zIndex: 2, background: "rgba(11,5,7,.82)", border: `1px solid ${T.border}`, color: T.text, padding: "6px 10px", fontSize: 13, fontWeight: 700, pointerEvents: "none" }}>
            {zoom.route ? `🏔 ${finalShort(rbr[zoom.i].f)}` : `${ATTR_INFO[zoom.attr].icon} ${zoom.attr} · Nv ${attrLevel(state.attrs[zoom.attr])}`}
          </div>
        )}
        {future && projOk && (
          <div style={{ position: "absolute", top: 10, left: 10, right: 10, padding: "5px 10px", background: "rgba(11,5,7,.82)", border: `1px solid ${CAT.final.color}`, color: CAT.final.color, fontSize: 13, fontWeight: 700, pointerEvents: "none" }}>
            ◆ Em {fmtDM(proj.end)}, no ritmo de ~{proj.perWeek} XP/semana: nível {proj.level} · Rank {proj.rank}
          </div>
        )}
        {past && snap && !future && (
          <div style={{ position: "absolute", top: 10, left: 10, padding: "5px 10px", background: "rgba(11,5,7,.82)", border: `1px solid ${T.gold}`, color: T.gold, fontSize: 13, fontWeight: 700, pointerEvents: "none" }}>
            ◐ Há {snapWeeks} semana{snapWeeks > 1 ? "s" : ""} · fim da semana de {fmtDM(snap.week)}
          </div>
        )}
      </div>
      {!zoom && <button disabled={!snap} aria-pressed={past}
        onPointerDown={hold(true)} onPointerUp={hold(false)} onPointerLeave={hold(false)} onPointerCancel={hold(false)} onContextMenu={(e) => e.preventDefault()}
        onKeyDown={(e) => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); setPast(!!snap); } }} onKeyUp={() => setPast(false)} onBlur={() => setPast(false)}
        style={{ width: "100%", marginTop: 8, padding: "10px 12px", background: past ? T.panel2 : "transparent", border: `1px solid ${snap ? T.gold : T.border}`, color: snap ? T.gold : T.muted,
          fontFamily: F.ui, fontSize: 14, fontWeight: 700, cursor: snap ? "pointer" : "default", userSelect: "none", WebkitUserSelect: "none", WebkitTouchCallout: "none", touchAction: "none" }}>
        {snap ? `◐ Antes × agora · segure para ver há ${snapWeeks} semana${snapWeeks > 1 ? "s" : ""}` : "◐ Antes × agora · libera depois da primeira virada de semana"}
      </button>}
      {!zoom && <button disabled={!projOk} aria-pressed={future}
        onPointerDown={(e) => { if (e.cancelable) e.preventDefault(); setFuture(projOk); }} onPointerUp={() => setFuture(false)} onPointerLeave={() => setFuture(false)} onPointerCancel={() => setFuture(false)} onContextMenu={(e) => e.preventDefault()}
        onKeyDown={(e) => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); setFuture(projOk); } }} onKeyUp={() => setFuture(false)} onBlur={() => setFuture(false)}
        style={{ width: "100%", marginTop: 8, padding: "10px 12px", background: future ? T.panel2 : "transparent", border: `1px solid ${projOk ? CAT.final.color : T.border}`, color: projOk ? CAT.final.color : T.muted,
          fontFamily: F.ui, fontSize: 14, fontWeight: 700, cursor: projOk ? "pointer" : "default", userSelect: "none", WebkitUserSelect: "none", WebkitTouchCallout: "none", touchAction: "none" }}>
        {projOk ? `◆ Ver em ${fmtDM(proj.end)} · segure para ver a árvore no seu ritmo` : proj && proj.wait ? `◆ Ver em ${fmtDM(state.deadline)} · libera em ${proj.wait} dia(s) de dados` : `◆ Ver em ${fmtDM(state.deadline)} · libera com 7 dias de dados`}
      </button>}
      {zoom && zoom.route && rbr[zoom.i] && (
        <RouteBranchPanel key={rbr[zoom.i].f.id} b={rbr[zoom.i]} subSel={subSel} setSubSel={setSubSel} leafSel={leafSel} onRename={onRenameFinal} />
      )}
      {zoom && !zoom.route && (() => {
        const za = zoom.attr;
        const list = subPoints(state.attrs, state.attrLog, za).filter((x) => x.id !== "geral" || x.pts > 0);
        const mark = state.subMark || {};
        const leaves = (id) => (state.leafLog || []).filter((l) => l.attr === za && l.sub === id);
        return (
          <div data-pn="" style={{ marginTop: 10, padding: "8px 12px", border: `1px solid ${T.border}`, background: T.panel2 }}>
            <div style={{ fontSize: 12, fontWeight: 700, color: T.gold, letterSpacing: 0.5, marginBottom: 2 }}>SUB-GALHOS DE {za.toUpperCase()}</div>
            {leafSel && (
              <div style={{ border: `1px solid ${T.gold}`, padding: "8px 10px", margin: "6px 0", fontSize: 13, lineHeight: 1.45 }}>
                <b style={{ color: T.gold }}>🍃 {leafSel.title}</b><br />Meta concluída em {fmtDM(leafSel.date)} · +{leafSel.xp} XP · galho {leafSel.subName}
              </div>
            )}
            {list.map((x) => {
              const dry = x.id !== "geral" && subDry(state, za, x.id);
              const gain = Math.max(0, x.pts - (mark[subKey(za, x.id)] || 0));
              const on = subSel === x.name;
              return (
                <button key={x.id} onClick={() => { setSubSel(on ? null : x.name); setLeafSel(null); }} aria-pressed={on}
                  style={{ width: "100%", display: "block", textAlign: "left", background: on ? T.panel : "none", border: "none", borderTop: `1px solid ${T.border}55`, padding: "8px 0", color: T.text, cursor: "pointer", fontFamily: F.ui }}>
                  <span style={{ display: "flex", justifyContent: "space-between", gap: 8, fontSize: 14 }}>
                    <span style={{ fontWeight: 700 }}>{x.name} <span style={{ color: T.gold }}>Nv {attrLevel(x.pts)}</span>{dry && <span style={{ color: "#e0c08a", fontWeight: 500 }}> · 🍂 seco</span>}</span>
                    <span style={{ fontSize: 12, color: gain ? T.good : T.muted }}>{gain ? `+${gain} na semana` : "0 na semana"}</span>
                  </span>
                  <span style={{ display: "block", height: 5, background: T.track, margin: "5px 0 3px" }}><span style={{ display: "block", height: 5, width: `${x.pts % 100}%`, background: dry ? "#c9a46a" : T.accent }} /></span>
                  <span style={{ display: "block", fontSize: 12, color: T.muted }}>{x.pts} pts · {leaves(x.id).length} folha(s){x.id === "geral" ? " · pontos de antes dos sub-galhos" : ""}</span>
                  {on && leaves(x.id).length > 0 && (
                    <span style={{ display: "block", fontSize: 12, color: T.text, marginTop: 4 }}>{leaves(x.id).slice(-5).reverse().map((l) => `🍃 ${l.title} (${fmtDM(l.date)})`).join(" · ")}</span>
                  )}
                  {on && dry && <span style={{ display: "block", fontSize: 12, color: "#e0c08a", marginTop: 4 }}>Não cresceu na semana passada. Crie uma meta pequena de {x.name} para ele voltar a ficar verde.</span>}
                </button>
              );
            })}
          </div>
        );
      })()}
      {!zoom && (rp ? <RouteReading state={state} rbr={rbr} rp={rp} /> : <TreeReading state={state} />)}
      {fruit && String(fruit).startsWith("ms:") && (() => {
        const [, fid, mid] = String(fruit).split(":");
        const f = (state.finals || []).find((x) => String(x.id) === fid);
        const m = f && (f.milestones || []).find((x) => String(x.id) === mid);
        if (!m) return null;
        return (
          <div data-pn="" style={{ marginTop: 10, padding: 12, border: `1px solid ${T.gold}`, background: T.panel2 }}>
            <div style={{ fontFamily: F.display, fontSize: 20, color: T.gold }}>🍊 Marco: {m.title}</div>
            <div style={{ fontSize: 13, color: T.text, lineHeight: 1.5, marginTop: 6 }}>Objetivo: {f.title}{m.doneAt ? ` · conquistado em ${fmtDM(m.doneAt)}` : ""}{m.awarded ? ` · +${m.awarded} XP` : ""}</div>
          </div>
        );
      })()}
      {fruit && (state.reviews || {})[fruit] && (() => { const r = state.reviews[fruit]; return (
        <div data-pn="" style={{ marginTop: 10, padding: 12, border: `1px solid ${T.gold}`, background: T.panel2 }}>
          <div style={{ fontFamily: F.display, fontSize: 20, color: T.gold }}>🍊 Fruto da semana {fmtDM(fruit)}–{fmtDM(addDays(fruit, 6))}</div>
          <div style={{ fontSize: 13, color: T.text, lineHeight: 1.5, marginTop: 6 }}><b style={{ color: T.gold }}>Lição:</b> {r.lesson}</div>
          <div style={{ fontSize: 13, color: T.muted, lineHeight: 1.5, marginTop: 4 }}><b>Falhou:</b> {r.fail}</div>
          {r.general && <div style={{ fontSize: 13, color: T.muted, lineHeight: 1.5, marginTop: 4 }}><b>Se–então:</b> {r.general}</div>}
        </div>); })()}
      {branch && ATTR_INFO[branch] && (
        <div data-pn="" style={{ marginTop: 10, padding: 12, border: `1px solid ${T.accent}`, background: T.panel2 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", gap: 8 }}>
            <span style={{ fontFamily: F.display, fontSize: 22, color: T.text }}>{ATTR_INFO[branch].icon} {branch}</span>
            <span style={{ fontSize: 13, color: T.accentSoft }}>Nv {attrLevel(state.attrs[branch])} · {(state.attrs[branch] || 0) % 100}/100</span>
          </div>
          <div style={{ fontSize: 13, color: T.text, lineHeight: 1.45, marginTop: 4 }}>{ATTR_INFO[branch].def}</div>
          {dryFlags(state)[CORE_ATTRS.indexOf(branch)] && (
            <div style={{ fontSize: 13, color: "#e0c08a", border: "1px solid #8c6a32", background: "#2a1e0c", padding: "6px 8px", marginTop: 8, lineHeight: 1.45 }}>
              🍂 Galho seco: não cresceu na semana passada. Volta a ficar verde no primeiro ponto que ganhar. Alimenta: {ATTR_INFO[branch].feeds}.
            </div>
          )}
          {(() => { const c = Object.values(CLASSES).find((x) => x.attr === branch); return c ? (
            <div style={{ fontSize: 12, color: T.muted, marginTop: 6, lineHeight: 1.45 }}>
              <b style={{ color: T.gold }}>Classe deste galho: {c.icon} {c.name}</b>{state.heroClass ? "" : ` · libera no nível ${CLASS_LEVEL}`}<br />{c.desc}
            </div>) : null; })()}
          <div style={{ fontSize: 12, fontWeight: 700, color: T.gold, margin: "10px 0 4px", letterSpacing: 0.4 }}>HABILIDADES DESTE GALHO</div>
          {SKILLS.filter((k) => k.attr === branch).map((k) => {
            const ks = skillState(state, k).status;
            return (
              <button key={k.id} onClick={() => { setSel(k.id); setBranch(null); }}
                style={{ width: "100%", display: "flex", alignItems: "center", gap: 10, textAlign: "left", background: "transparent", border: "none", borderTop: `1px solid ${T.border}66`, padding: "8px 0", cursor: "pointer", color: T.text, fontFamily: "inherit" }}>
                <span style={{ fontSize: 20, filter: ks === "locked" ? "grayscale(1) opacity(.5)" : "none" }} aria-hidden="true">{k.icon}</span>
                <span style={{ flex: 1 }}>
                  <span style={{ display: "block", fontSize: 14, fontWeight: 700 }}>{k.name} <span style={{ fontWeight: 500, fontSize: 12, color: ks === "on" ? T.gold : ks === "av" ? "#f59e0b" : T.muted }}>· {ks === "on" ? "desbloqueada" : ks === "av" ? "disponível" : `bloqueada (Nv ${k.req})`}</span></span>
                  <span style={{ display: "block", fontSize: 12, color: T.muted }}>{k.desc}</span>
                </span>
              </button>
            );
          })}
        </div>
      )}
      <div style={{ display: "flex", gap: 10, justifyContent: "center", fontSize: 12, color: T.muted, marginTop: 6, flexWrap: "wrap" }}>
        <span>🌸 Desbloqueada</span><span style={{ color: "#f59e0b" }}>● Disponível</span><span>◌ Bloqueada</span>
      </div>
      <label htmlFor="skill-pick" style={{ display: "block", fontSize: 12, color: T.muted, marginTop: 8 }}>{rp ? "Toque num galho para abrir o objetivo e num fruto para ver o marco. Habilidades:" : "Toque numa placa para ver o galho, numa flor ou broto para ver a habilidade, num fruto para reler a lição da semana, ou escolha aqui:"}</label>
      <select id="skill-pick" value={sel || ""} onChange={(e) => setSel(e.target.value || null)} style={{ ...inputStyle, width: "100%", marginTop: 4, fontSize: 14 }}>
        <option value="">— escolher habilidade —</option>
        {CORE_ATTRS.map((a) => (
          <optgroup key={a} label={a}>
            {SKILLS.filter((k) => k.attr === a).map((k) => {
              const st0 = skillState(state, k).status;
              return <option key={k.id} value={k.id}>{k.icon} {k.name} · {st0 === "on" ? "desbloqueada" : st0 === "av" ? "disponível" : "bloqueada"}</option>;
            })}
          </optgroup>
        ))}
      </select>

      {pick ? (
        <div data-pn="" style={{ marginTop: 12, padding: 12, border: `1px solid ${st.status === "on" ? T.gold : T.accent}`, background: T.panel2 }}>
          <div style={{ fontFamily: F.display, fontSize: 22, color: T.text }}>{pick.icon} {pick.name}</div>
          <div style={{ fontSize: 12, fontWeight: 700, color: T.gold, margin: "2px 0 6px" }}>{pick.attr.toUpperCase()} · NÓ {pick.tier} · CUSTA {pick.cost} PONTO{pick.cost > 1 ? "S" : ""}</div>
          <div style={{ fontSize: 14, color: T.text, lineHeight: 1.45 }}>{pick.desc}</div>
          {st.status !== "on" && (
            <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginTop: 8 }}>
              {chip(st.reqOk, `${pick.attr} Nv ${pick.req} (você: Nv ${attrLevel(state.attrs[pick.attr])})`)}
              {st.prev && chip(st.prevOk, st.prev.name)}
              {chip(st.ptsOk, `${pick.cost} ponto(s) livre(s)`)}
            </div>
          )}
          <button onClick={() => onUnlock(pick.id)} disabled={st.status !== "av"}
            style={{ ...btnPrimary, width: "100%", marginTop: 10, opacity: st.status === "av" ? 1 : 0.4, cursor: st.status === "av" ? "pointer" : "default",
              background: st.status === "on" ? "transparent" : T.glow, border: st.status === "on" ? `1px solid ${T.gold}` : "none", color: st.status === "on" ? T.gold : "#fff" }}>
            {st.status === "on" ? "Desbloqueada ✓" : st.status === "av" ? "Desbloquear" : "Bloqueada"}
          </button>
        </div>
      ) : (
        <div style={{ fontSize: 12, color: T.muted, textAlign: "center", marginTop: 10 }}>Toque num nó para ver o efeito e os requisitos.</div>
      )}

      {forecast && (
        <div style={{ marginTop: 12, padding: 10, border: `1px solid ${T.border}`, fontSize: 13, color: T.accentSoft }}>👁️ {forecast}</div>
      )}
    </Section>
  );
}

function ClassGate({ state, lvl, onStart, onChoose, onSummon }) {
  const [confirm, setConfirm] = useState(null);
  const today = dayKey(new Date());
  const q = state.classQuest;
  const cls = state.heroClass ? CLASSES[state.heroClass] : null;
  const box = { border: `1px dashed ${T.border}`, padding: 12, marginBottom: 14, background: T.panel2 };
  const title = (color, text) => <div style={{ fontFamily: F.display, fontSize: 20, color, textAlign: "center" }}>{text}</div>;
  const row = (label, value, ok) => (
    <div key={label} style={{ display: "flex", justifyContent: "space-between", fontSize: 14, padding: "6px 0", borderTop: `1px solid ${T.border}66` }}>
      <span style={{ color: T.text }}>{label}</span><span style={{ fontWeight: 700, color: ok ? T.good : T.gold, fontVariantNumeric: "tabular-nums" }}>{value}</span>
    </div>
  );
  const purple = "#c4b5fd";

  /* classe já escolhida */
  if (cls) {
    const shadows = state.shadows || [];
    const runs = Object.entries(state.fixedRuns || {}).filter(([, n]) => n > 0).sort((a, b) => b[1] - a[1]);
    return (
      <div style={{ ...box, borderStyle: "solid", borderColor: state.heroClass === "monarca" ? "#8b5cf6" : T.gold }}>
        {title(state.heroClass === "monarca" ? purple : T.gold, `${cls.icon} ${cls.name}`)}
        <div style={{ fontSize: 13, color: T.text, lineHeight: 1.45, textAlign: "center", marginTop: 4 }}>{cls.desc}</div>
        {state.heroClass === "monarca" && (
          <div style={{ marginTop: 10 }}>
            <div style={{ fontSize: 13, fontWeight: 700, color: purple }}>Exército: {shadows.length} sombra(s) · +{SHADOW_XP * shadows.length} XP por semana</div>
            {shadows.length === 0 && <div style={{ fontSize: 12, color: T.muted, marginTop: 4 }}>Nenhuma sombra ainda. Mantenha um mínimo em {FIXED_TARGET}/7 por {SHADOW_WEEKS} semanas seguidas.</div>}
            {shadows.map((x) => (
              <div key={x.title} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8, padding: "6px 0", borderTop: `1px solid ${T.border}66` }}>
                <span style={{ fontSize: 14, color: purple }}>☾ {x.title}</span>
                <button onClick={() => onSummon(x.title)} style={{ ...btnPrimary, padding: "6px 10px", fontSize: 12, background: "transparent", border: "1px solid #8b5cf6", color: purple, boxShadow: "none" }}>Convocar</button>
              </div>
            ))}
            {runs.length > 0 && (
              <div style={{ fontSize: 12, color: T.muted, marginTop: 6 }}>Próximas sombras: {runs.map(([t, n]) => `${t} ${n}/${SHADOW_WEEKS}`).join(" · ")}</div>
            )}
          </div>
        )}
      </div>
    );
  }

  /* ainda abaixo do nível */
  if (lvl < CLASS_LEVEL) {
    return (
      <div style={{ ...box, textAlign: "center" }}>
        {title(T.muted, "⛓ Mudança de Classe")}
        <div style={{ fontSize: 12, color: T.muted }}>Libera no nível {CLASS_LEVEL} · faltam {CLASS_LEVEL - lvl} nível(is)</div>
        <div style={{ fontSize: 12, color: T.muted, marginTop: 6, lineHeight: 1.6 }}>
          Uma classe por galho: {Object.values(CLASSES).filter((c) => c.attr).map((c) => `${c.icon} ${c.attr}`).join(" · ")} · ♛ oculta
        </div>
      </div>
    );
  }

  /* missão em andamento */
  if (q && q.status === "active") {
    const pr = questProgress(state, today);
    return (
      <div style={{ ...box, borderStyle: "solid", borderColor: T.gold }}>
        {title(T.gold, "⛓ Missão de Mudança de Classe")}
        <div style={{ fontSize: 12, color: T.muted, textAlign: "center", marginBottom: 6 }}>Dia {pr.day} de {QUEST_DAYS} · falha na hora com recaída, dia sem diário ou semana abaixo da linha</div>
        {row("NoFap sem cair", `${pr.nofapDays}/${QUEST_DAYS}`, pr.nofapDays >= QUEST_DAYS)}
        {row("Diário escrito todos os dias", `${pr.diaryDays}/${QUEST_DAYS}`, pr.diaryDays >= QUEST_DAYS)}
        {row("Semanas vencidas", `${pr.weeksWon}/2`, pr.weeksWon >= 2)}
        {pr.waitingWeek && <div style={{ fontSize: 12, color: T.accentSoft, marginTop: 6 }}>Os 14 dias acabaram. Falta fechar a semana no domingo.</div>}
      </div>
    );
  }

  /* missão concluída: escolher a classe */
  if (q && q.status === "passed") {
    const eligible = monarchEligible(state);
    const minLv = Math.min(...CORE_ATTRS.map((a) => attrLevel(state.attrs[a])));
    return (
      <div style={{ ...box, borderStyle: "solid", borderColor: T.gold }}>
        {title(T.gold, "Escolha sua classe")}
        <div style={{ fontSize: 12, color: T.muted, textAlign: "center", marginBottom: 8 }}>A escolha é permanente.</div>
        {Object.entries(CLASSES).map(([id, c]) => {
          const hiddenLocked = c.hidden && !eligible;
          const mon = id === "monarca";
          return (
            <button key={id} onClick={() => !hiddenLocked && setConfirm(id)} disabled={hiddenLocked} aria-pressed={confirm === id}
              style={{ display: "flex", gap: 10, alignItems: "center", width: "100%", textAlign: "left", marginBottom: 8, padding: 10, cursor: hiddenLocked ? "default" : "pointer",
                background: mon && !hiddenLocked ? "linear-gradient(135deg,#120a22,#07060c)" : T.input,
                border: `1px solid ${confirm === id ? T.text : mon && !hiddenLocked ? "#8b5cf6" : T.border}`, boxShadow: mon && !hiddenLocked ? "0 0 22px rgba(139,92,246,.4)" : "none", color: T.text }}>
              <span style={{ fontSize: 26, width: 40, textAlign: "center", filter: hiddenLocked ? "grayscale(1) opacity(.4)" : "none" }}>{hiddenLocked ? "?" : c.icon}</span>
              <span>
                <span style={{ display: "block", fontFamily: F.display, fontSize: 19, color: mon && !hiddenLocked ? purple : T.text }}>{hiddenLocked ? "??? Classe oculta" : c.name}</span>
                <span style={{ display: "block", fontSize: 11, fontWeight: 700, letterSpacing: 0.4, color: T.gold }}>{c.attr ? `GALHO: ${c.attr.toUpperCase()}` : "TODOS OS GALHOS"}</span>
                <span style={{ display: "block", fontSize: 12, color: T.muted, lineHeight: 1.4 }}>
                  {hiddenLocked ? `Exige os 5 atributos no Nv ${MONARCH_MIN}. O seu mais fraco está no Nv ${minLv}.` : c.desc}
                </span>
              </span>
            </button>
          );
        })}
        {confirm && (
          <div role="alertdialog" aria-label="Confirmar classe" style={{ marginTop: 4, padding: 10, border: `1px solid ${T.danger}` }}>
            <div style={{ fontSize: 13, color: T.text }}>Virar <b>{CLASSES[confirm].name}</b> para sempre?</div>
            <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
              <button onClick={() => { onChoose(confirm); setConfirm(null); }} style={btnPrimary}>Confirmar</button>
              <button onClick={() => setConfirm(null)} style={{ ...btnPrimary, background: "transparent", border: `1px solid ${T.border}`, boxShadow: "none", color: T.text }}>Cancelar</button>
            </div>
          </div>
        )}
      </div>
    );
  }

  /* pronto para começar (ou recomeçar depois de falhar) */
  const nofapOn = !!(state.nofap && state.nofap.active);
  return (

/* ==================== RADAR SVG ==================== */
function RadarChart({ attrs }) {
  const names = Object.keys(attrs);
  const n = names.length;
  if (n < 3) return <Empty text="Adicione pelo menos 3 atributos para ver a roda." />;
  const size = 320, cx = size / 2, cy = size / 2, R = 96;
  const levels = names.map((a) => attrLevel(attrs[a]));
  const maxL = Math.max(5, ...levels);
  const pt = (i, r) => {
    const ang = (Math.PI * 2 * i) / n - Math.PI / 2;
    return [cx + r * Math.cos(ang), cy + r * Math.sin(ang)];
  };
  const ringPoly = (frac) => names.map((_, i) => pt(i, R * frac).join(",")).join(" ");
  const dataPoly = names.map((a, i) => pt(i, Math.max(0.04, levels[i] / maxL) * R).join(",")).join(" ");
  return (
    <svg viewBox={`0 0 ${size} ${size}`} style={{ width: "100%", maxWidth: 350, display: "block", margin: "0 auto" }}>
      {[0.25, 0.5, 0.75, 1].map((f) => (
        <polygon key={f} points={ringPoly(f)} fill="none" stroke={T.border} strokeWidth="1" />
      ))}
      {names.map((_, i) => {
        const [x, y] = pt(i, R);
        return <line key={i} x1={cx} y1={cy} x2={x} y2={y} stroke={T.border} strokeWidth="1" />;
      })}
      <polygon points={dataPoly} fill="rgba(239,68,68,0.28)" stroke={T.accent} strokeWidth="2" style={{ filter: `drop-shadow(0 0 6px ${T.glow})` }} />
      {names.map((a, i) => {
        const [x, y] = pt(i, R + 24);
        const [dx, dy] = pt(i, Math.max(0.04, levels[i] / maxL) * R);
        return (
          <g key={a}>
            <circle cx={dx} cy={dy} r="3" fill={T.accentSoft} />
            <text x={x} y={y - 4} textAnchor="middle" fill={T.text} fontSize="9.5" fontFamily={F.ui}>{a}</text>
            <text x={x} y={y + 8} textAnchor="middle" fill={T.accentSoft} fontSize="8.5" fontFamily={F.ui}>Lv {levels[i]}</text>
          </g>
        );
      })}
    </svg>
  );
}

/* moedas ganhas: esta semana e ritmo médio das últimas 4 semanas */
function coinPace(history) {
  const today = dayKey(new Date());
  const ws = weekStartKey(new Date());
  const from = addDays(today, -27);
  const gains = (history || []).filter((h) => (h.coins || 0) > 0);
  const week = gains.filter((h) => h.date >= ws).reduce((t, h) => t + h.coins, 0);
  const recent = gains.filter((h) => h.date >= from);
  const four = recent.reduce((t, h) => t + h.coins, 0);
  /* divide pelo tempo real de registro (mín. 1 semana, máx. 4) para não subestimar o começo */
  const first = recent.reduce((m, h) => (h.date < m ? h.date : m), today);
  const span = Math.min(4, Math.max(1, (daysBetween(first, today) + 1) / 7));
  return { week, perWeek: Math.round(four / span), measured: four > 0 };
}

                {it.icon || "📦"}

              {ic}
            </button>
          ))}
        </div>
        <input value={txt} onChange={(e) => setTxt(e.target.value)} placeholder="Nome do item (ex: Pergaminho do Descanso)…" style={inputStyle} />
        <input value={effect} onChange={(e) => setEffect(e.target.value)} placeholder="O que ele faz (ex: direito de dormir o dia inteiro)…" style={inputStyle} />
        <div style={{ display: "flex", gap: 8 }}>
          <select value={rarity} onChange={(e) => setRarity(e.target.value)}

            {Object.keys(RARITIES).map((r) => <option key={r} value={r}>{r}</option>)}
          </select>

          <button onClick={submit} style={btnPrimary}>Forjar</button>
        </div>
        {+price > 0 && <div style={{ fontSize: 12, color: T.muted }}>No seu ritmo, {price} moedas = {weeksFor(+price)} de esforço.</div>}
      </div>
    </Section>
  );
}

/* ==================== MISSÃO FIXA DA SEMANA ==================== */
function FixedWeekPanel({ fixedWeek, onBump, onSave }) {
  const items = (fixedWeek && fixedWeek.items) || [];
  const [editing, setEditing] = useState(false);
  const [draft, setDraft] = useState([]);
  const [msg, setMsg] = useState("");
  const startEdit = () => { setDraft(items.map((i) => ({ ...i }))); setEditing(true); setMsg(""); };
  const saveEdit = () => {
    const clean = draft.map((i) => ({ ...i, title: i.title.trim() })).filter((i) => i.title);
    if (!clean.length) { setMsg("Deixe pelo menos um mínimo."); return; }
    onSave(clean);
    setEditing(false); setMsg("Mínimos salvos.");
  };
  if (editing) {
    return (
      <Section title="Editar mínimos" accent={T.gold} glow="rgba(251,191,36,0.2)">
        <div style={{ fontSize: 13, color: T.muted, marginBottom: 10, lineHeight: 1.5 }}>De 1 a 6 hábitos que você quer cumprir quase todo dia. Escolha o atributo que cada um alimenta. A contagem desta semana fica nos itens que você mantiver.</div>
        {draft.map((it, idx) => (
          <div key={it.id} style={{ display: "flex", gap: 6, marginBottom: 8 }}>
            <input id={`min-${it.id}`} value={it.title} maxLength={40} onChange={(e) => setDraft(draft.map((x, j) => (j === idx ? { ...x, title: e.target.value } : x)))} style={inputStyle} aria-label="Nome do mínimo" />
            <select value={`${CORE_ATTRS.includes(it.attr) ? it.attr : "Domínio"}/${it.sub || "geral"}`} onChange={(e) => { const [na, ns] = e.target.value.split("/"); setDraft(draft.map((x, j) => (j === idx ? { ...x, attr: na, sub: ns } : x))); }} aria-label={`Sub-atributo de ${it.title || "mínimo"}`}
              style={{ ...inputStyle, flex: "0 0 150px", padding: "10px 6px" }}>
              {CORE_ATTRS.map((at) => (
                <optgroup key={at} label={at}>
                  <option value={`${at}/geral`}>{at} · geral</option>
                  {(SUBS[at] || []).map(([id, name]) => <option key={id} value={`${at}/${id}`}>{at} › {name}</option>)}
                </optgroup>
              ))}
            </select>
            <button aria-label={`Remover ${it.title || "mínimo"}`} onClick={() => setDraft(draft.filter((_, j) => j !== idx))} style={{ ...btnDanger, borderColor: T.muted, color: T.muted, padding: "0 12px" }}>✕</button>
          </div>
        ))}
        {draft.length < 6 && (
          <button onClick={() => setDraft([...draft, { id: Math.max(0, ...draft.map((d) => d.id), ...items.map((d) => d.id)) + 1, title: "", count: 0, attr: "Domínio" }])}
            style={{ ...btnPrimary, background: "transparent", border: `1px dashed ${T.gold}`, color: T.gold, boxShadow: "none", width: "100%" }}>+ Adicionar mínimo</button>
        )}
        <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
          <button onClick={saveEdit} style={{ ...btnPrimary, flex: 1 }}>Salvar</button>
          <button onClick={() => { setEditing(false); setMsg(""); }} style={{ ...btnDanger, borderColor: T.muted, color: T.muted }}>Cancelar</button>
        </div>
        {msg && <div style={{ fontSize: 13, color: T.accentSoft, marginTop: 8 }}>{msg}</div>}
      </Section>
    );
  }
  const avg = items.length ? items.reduce((a, i) => a + i.count, 0) / items.length : 0;
  const missing = items.filter((i) => i.count < FIXED_TARGET).length;
  const stepBtn = { width: 34, height: 34, minWidth: 34, background: "transparent", border: `1px solid ${T.border}`, color: T.text, fontSize: 18, fontWeight: 700, cursor: "pointer", lineHeight: 1 };
  return (
    <Section title="Missão fixa" accent={T.gold} glow="rgba(251,191,36,0.35)">
      <div style={{ fontSize: 12, color: T.muted, marginBottom: 10, lineHeight: 1.5 }}>
        Seus {items.length} mínimo(s). Preencha no domingo ou toque no + quando lembrar. +{FIXED_XP_PER_DAY} XP por dia cumprido; todos em {FIXED_TARGET}/7 ou mais rendem +{FIXED_BONUS} XP na virada da semana.
      </div>
      {items.map((it) => {
        const hit = it.count >= FIXED_TARGET;
        return (
          <div key={it.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "8px 0", borderBottom: `1px solid ${T.border}55` }}>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontSize: 14, color: T.text }}>{it.title} <span style={{ fontSize: 11, color: T.muted }}>· {CORE_ATTRS.includes(it.attr) ? it.attr : "Domínio"}{it.sub && it.sub !== "geral" ? ` › ${subName(it.attr, it.sub)}` : ""}</span></div>
              <div style={{ display: "flex", gap: 3, marginTop: 6 }} aria-hidden="true">
                {Array.from({ length: 7 }, (_, d) => (
                  <span key={d} style={{ flex: 1, maxWidth: 22, height: 5, background: d < it.count ? (hit ? T.gold : T.accent) : T.track, boxShadow: d < it.count ? `0 0 6px ${hit ? "rgba(251,191,36,0.5)" : T.glow}` : "none" }} />
                ))}
              </div>
            </div>
            <button aria-label={`Diminuir ${it.title}`} onClick={() => onBump(it.id, -1)} style={stepBtn}>−</button>
            <span style={{ fontFamily: F.ui, fontSize: 15, fontWeight: 700, minWidth: 34, textAlign: "center", color: hit ? T.gold : T.accentSoft, fontVariantNumeric: "tabular-nums" }}>{it.count}/7</span>
            <button aria-label={`Aumentar ${it.title}`} onClick={() => onBump(it.id, 1)} style={{ ...stepBtn, borderColor: T.gold, color: T.gold }}>+</button>
          </div>
        );
      })}
      <div style={{ fontFamily: F.ui, fontSize: 11, color: T.muted, marginTop: 10 }}>
        Média {avg.toFixed(1)}/7 · {missing === 0 ? <span style={{ color: T.gold }}>bônus garantido</span> : `${missing} mínimo(s) abaixo de ${FIXED_TARGET}/7`}
      </div>
      <button onClick={startEdit} style={{ background: "none", border: "none", color: T.gold, fontFamily: F.ui, fontSize: 14, fontWeight: 600, padding: "10px 0 0", cursor: "pointer" }}>Editar mínimos</button>
      {msg && <div style={{ fontSize: 13, color: T.accentSoft, marginTop: 6 }}>{msg}</div>}
    </Section>
  );
}

/* ==================== BACKUP ==================== */
function BackupPanel({ state, onImport, onBackup }) {
  const [mode, setMode] = useState(null);       /* "text-out" | "text-in" | null */
  const [txt, setTxt] = useState("");
  const [pending, setPending] = useState(null); /* backup lido do arquivo, esperando confirmação */
  const [armed, setArmed] = useState(false);
  const [msg, setMsg] = useState("");
  const [persisted, setPersisted] = useState(null);
  const outRef = useRef(null);
  const fileRef = useRef(null);
  const exportText = JSON.stringify(state);
  const fileName = `sistema-backup-${dayKey(new Date())}`;

  useEffect(() => {
    let alive = true;
    try {
      if (navigator.storage && navigator.storage.persisted) {
        navigator.storage.persisted().then((p) => { if (alive) setPersisted(p); }).catch(() => {});
      }
    } catch (e) { /* sem suporte */ }
    return () => { alive = false; };
  }, []);

  const lastAt = state.backup && state.backup.lastAt;
  const daysSince = lastAt ? Math.floor((Date.now() - lastAt) / 86400000) : null;
  const stale = daysSince === null || daysSince >= 7;
  const lastLabel = daysSince === null ? "nunca" : daysSince === 0 ? "hoje" : daysSince === 1 ? "ontem" : `há ${daysSince} dias`;

  const download = () => {
    try {
      const blob = new Blob([exportText], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = `${fileName}.json`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      onBackup();
      setMsg(`Arquivo ${fileName}.json salvo em Downloads.`);
    } catch (e) { setMsg("Não deu para salvar o arquivo. Use a opção de texto abaixo."); }
  };

  const share = async () => {
    const files = [
      new File([exportText], `${fileName}.json`, { type: "application/json" }),
      new File([exportText], `${fileName}.txt`, { type: "text/plain" }),
    ];
    const file = navigator.canShare ? files.find((f) => { try { return navigator.canShare({ files: [f] }); } catch (e) { return false; } }) : null;
    if (!file || !navigator.share) { download(); return; }
    try {
      await navigator.share({ files: [file], title: "Backup do Sistema" });
      onBackup();
      setMsg("Backup enviado.");
    } catch (e) {
      if (e && e.name === "AbortError") setMsg("Envio cancelado.");
      else download();
    }
  };

  const check = (raw) => {
    const p = JSON.parse(String(raw).trim());
    if (!p || typeof p.xp !== "number") throw new Error("formato");
    return p;
  };

  const pickFile = (e) => {
    const f = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const p = check(reader.result);
        setPending({ data: p, when: f.lastModified, name: f.name });
        setArmed(false);
        setMsg("");
      } catch (err) { setPending(null); setMsg("Esse arquivo não é um backup do Sistema."); }
    };
    reader.onerror = () => setMsg("Não deu para ler o arquivo.");
    reader.readAsText(f);
  };

  const confirmFile = () => {
    onImport(pending.data);
    setPending(null);
    setMsg("Dados restaurados.");
  };

  const copy = () => {
    const fallback = () => {
      if (outRef.current) { outRef.current.focus(); outRef.current.select(); }
      setMsg("Texto selecionado. Copie manualmente e guarde.");
    };
    try {
      navigator.clipboard.writeText(exportText)
        .then(() => { onBackup(); setMsg("Copiado. Cole numa conversa com você mesmo ou nas notas do celular."); })
        .catch(fallback);
    } catch (e) { fallback(); }
  };

  const restoreText = () => {
    if (!armed) { setArmed(true); setMsg("Isso substitui todos os dados atuais. Toque de novo para confirmar."); return; }
    try {
      onImport(check(txt));
      setTxt(""); setArmed(false); setMode(null);
      setMsg("Dados restaurados.");
    } catch (e) {
      setArmed(false);
      setMsg("Texto inválido. Cole o backup inteiro, do primeiro { ao último }.");
    }
  };

  const ghost = { ...btnPrimary, background: "transparent", border: `1px solid ${T.border}`, boxShadow: "none", color: T.text };
  const fmtWhen = (t) => { try { return new Date(t).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" }); } catch (e) { return ""; } };

  return (
    <Section title="Backup">
      <div style={{ display: "grid", gap: 4, fontSize: 13, marginBottom: 10 }}>
        <div style={{ color: stale ? T.danger : T.good, fontWeight: 700 }}>
          Último backup: {lastLabel}{stale ? " · faça um agora" : " ✓"}
        </div>
        <div style={{ color: persisted ? T.good : T.muted }}>
          {persisted === null ? "Armazenamento: verificando…" : persisted ? "Armazenamento protegido ✓" : "Armazenamento comum: se o celular ficar sem espaço, o navegador pode apagar os dados."}
        </div>
        <div style={{ color: T.muted, fontSize: 12, lineHeight: 1.5 }}>Os dados ficam neste celular. Faça um backup por semana, na revisão de domingo, e guarde no Drive.</div>
      </div>

      <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
        <button onClick={share} style={btnPrimary}>Enviar backup</button>
        <button onClick={download} style={ghost}>Salvar arquivo</button>
        <button onClick={() => fileRef.current && fileRef.current.click()} style={ghost}>Restaurar arquivo</button>
        <input ref={fileRef} type="file" accept=".json,.txt,application/json,text/plain" onChange={pickFile} style={{ display: "none" }} aria-hidden="true" tabIndex={-1} />
      </div>

      {pending && (
        <div role="alertdialog" aria-label="Confirmar restauração" data-pn="" style={{ marginTop: 10, padding: 10, border: `1px solid ${T.danger}`, background: T.panel2 }}>
          <div style={{ fontSize: 13, color: T.text, lineHeight: 1.5 }}>
            Backup <b>{pending.name}</b>{pending.when ? `, de ${fmtWhen(pending.when)}` : ""}, com <b>{pending.data.xp} XP</b>.
            Isso substitui todos os dados atuais.
          </div>
          <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
            <button onClick={confirmFile} style={{ ...btnPrimary, background: T.danger }}>Confirmar substituição</button>
            <button onClick={() => setPending(null)} style={ghost}>Cancelar</button>
          </div>
        </div>
      )}

      <div style={{ marginTop: 10, display: "flex", gap: 12, flexWrap: "wrap" }}>
        <button onClick={() => { setMode(mode === "text-out" ? null : "text-out"); setMsg(""); setArmed(false); }}
          style={{ background: "none", border: "none", padding: 0, color: T.muted, fontSize: 12, textDecoration: "underline", cursor: "pointer", fontFamily: "inherit" }}>Copiar como texto</button>
        <button onClick={() => { setMode(mode === "text-in" ? null : "text-in"); setMsg(""); setArmed(false); }}
          style={{ background: "none", border: "none", padding: 0, color: T.muted, fontSize: 12, textDecoration: "underline", cursor: "pointer", fontFamily: "inherit" }}>Colar texto de backup</button>
      </div>
      {mode === "text-out" && (
        <div style={{ marginTop: 10 }}>
          <textarea id="backup-out" ref={outRef} readOnly value={exportText} rows={4} aria-label="Texto do backup" style={{ ...inputStyle, width: "100%", fontFamily: F.ui, fontSize: 11, resize: "vertical" }} />
          <button onClick={copy} style={{ ...btnPrimary, marginTop: 8 }}>Copiar backup</button>
        </div>
      )}
      {mode === "text-in" && (
        <div style={{ marginTop: 10 }}>
          <textarea id="backup-in" value={txt} onChange={(e) => { setTxt(e.target.value); setArmed(false); }} rows={4} aria-label="Colar backup" placeholder="Cole aqui o texto do backup…" style={{ ...inputStyle, width: "100%", fontFamily: F.ui, fontSize: 11, resize: "vertical" }} />
          <button onClick={restoreText} disabled={!txt.trim()} style={{ ...btnPrimary, marginTop: 8, background: armed ? T.danger : T.glow, opacity: txt.trim() ? 1 : 0.4 }}>
            {armed ? "Confirmar substituição" : "Restaurar dados"}
          </button>
        </div>
      )}
      {msg && <div role="status" style={{ fontSize: 12, color: T.accentSoft, marginTop: 8 }}>{msg}</div>}
    </Section>
  );
}

/* ==================== CRACHÁ E BRASÃO DO RANK ==================== */
/* o brasão ganha detalhe a cada rank: E escudo simples · D borda interna · C pontas laterais · B gema · A asas · S coroa e brilho */
function RankCrest({ rank, size = 78 }) {
  const tier = Math.max(0, DIFFS.indexOf(rank));
  const c = RANK_BASE[rank] || "#9ca3af";
  const gid = `crest-${rank}`;
  return (
    <svg width={size} height={size * 1.13} viewBox="0 0 78 88" aria-hidden="true" style={{ flex: "none", overflow: "visible" }}>
      <defs>
        <linearGradient id={gid} x1="0" y1="0" x2="0" y2="1"><stop offset="0" stopColor={c} stopOpacity=".28" /><stop offset="1" stopColor="#0b0507" stopOpacity=".95" /></linearGradient>
        <radialGradient id={`${gid}-glow`}><stop offset="0" stopColor={c} stopOpacity=".55" /><stop offset="1" stopColor={c} stopOpacity="0" /></radialGradient>
      </defs>
      {tier >= 5 && <circle cx="39" cy="46" r="46" fill={`url(#${gid}-glow)`} style={{ animation: "rbGlow 3.5s ease-in-out infinite" }} />}
      {tier >= 4 && <path d="M8 30 L-6 22 L0 44 L-8 50 L6 56 Z M70 30 L84 22 L78 44 L86 50 L72 56 Z" fill={c} opacity=".75" />}
      {tier >= 2 && <path d="M5 26 L-2 34 L5 40 Z M73 26 L80 34 L73 40 Z" fill={c} />}
      <path d="M39 3 L73 20 L73 56 Q73 74 39 85 Q5 74 5 56 L5 20 Z" fill={`url(#${gid})`} stroke={c} strokeWidth="2.2" />
      {tier >= 1 && <path d="M39 11 L66 24 L66 55 Q66 69 39 78 Q12 69 12 55 L12 24 Z" fill="none" stroke={c} strokeOpacity=".5" strokeWidth="1" />}
      {tier >= 3 && <path d="M39 13 L44 19 L39 25 L34 19 Z" fill={c} stroke="#fff" strokeOpacity=".6" strokeWidth=".6" />}
      {tier >= 5 && <path d="M22 4 L28 -6 L33 2 L39 -9 L45 2 L50 -6 L56 4 Z" fill="#fbbf24" stroke="#fff3c0" strokeWidth=".8" />}
      <text x="39" y="59" textAnchor="middle" fontFamily={F.display} fontSize="36" fill="#f3f4f6">{rank}</text>
      <text x="39" y="73" textAnchor="middle" fontFamily={F.ui} fontSize="8" fontWeight="700" fill={c} letterSpacing="1">RANK</text>
    </svg>
  );
}

function HunterCard({ state, lvl, rank, title, into, need, onSettings }) {

    <div data-pn="" style={{ display: "flex", gap: 14, alignItems: "center", border: `1px solid ${T.border}`, background: T.panel, padding: 14, marginTop: 6 }}>

function SettingsScreen({ state, onClose, onTheme, onFont, onImport, onBackup, onName, onDeadline, onDiaryDeadline, onRestart }) {

  useEffect(() => {
    let popped = false;
    try { window.history.pushState({ rbSettings: 1 }, ""); } catch (e) { /* sem histórico */ }
    const onPop = () => { popped = true; onClose(); };
    window.addEventListener("popstate", onPop);
    return () => {
      window.removeEventListener("popstate", onPop);

  }, []);
  const th = THEMES[state.themeId] || THEMES.carmesim;

function MapScene({ params, children }) {
  const key = JSON.stringify(params);
  const html = React.useMemo(() => rotaMapSVG(params), [key]);
  const boxRef = useRef(null);
  React.useLayoutEffect(() => {
    const svg = boxRef.current && boxRef.current.querySelector("svg");
    if (!svg) return undefined;
    const nowHour = () => { const d = new Date(); return d.getHours() + d.getMinutes() / 60 + d.getSeconds() / 3600; };
    svg.style.setProperty("--rbT", "0s");
    rebirthApplyTime(svg, nowHour(), 0.4);
    void svg.getBoundingClientRect();
    const id = setInterval(() => { svg.style.setProperty("--rbT", "2s"); rebirthApplyTime(svg, nowHour(), 0.4); }, 30000);
    return () => clearInterval(id);
  }, [html]);
  return (
    <div className="rb" style={{ position: "relative", width: "min(100%, calc((100vh - 270px) * 0.609))", minWidth: 260, aspectRatio: "390 / 640", margin: "0 auto", overflow: "hidden", border: `1px solid ${T.border}`, borderRadius: 14, background: "#0d1734" }}>
      <style>{REBIRTH_CSS + MAP_CSS}</style>
      <div ref={boxRef} aria-hidden="true" style={{ position: "absolute", inset: 0 }} dangerouslySetInnerHTML={{ __html: html }} />
      {children}
    </div>
  );
}

function ObsLine({ text, onSave, small }) {
  const [open, setOpen] = useState(false);
  const [edit, setEdit] = useState(false);
  const [val, setVal] = useState(text || "");
  useEffect(() => { if (!edit) setVal(text || ""); }, [text, edit]);
  const fs = small ? 12 : 12.5;
  if (edit) {
    return (
      <div style={{ marginTop: 6 }} onClick={(e) => e.stopPropagation()}>
        <textarea value={val} onChange={(e) => setVal(e.target.value.slice(0, 400))} rows={4} aria-label="Observação" placeholder="Feito quando… · Como… · Por quê…"
          style={{ ...inputStyle, width: "100%", fontSize: 14, lineHeight: 1.4, resize: "vertical", minHeight: 84 }} />

          <button onClick={() => { onSave(val); setEdit(false); setOpen(true); }} style={{ ...btnPrimary, padding: "8px 14px" }}>Salvar</button>
