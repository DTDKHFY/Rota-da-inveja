            ? "Escrever é livre: cada ambição nova entra na névoa. Cada selo de NoFap rompido acende uma. Acesa pede uma prova; cumpriu, consuma. Recaída: a névoa engole a última acesa."
            : fantasyOpen
              ? `Abertas: você está com ${nfDays} dia(s) completo(s) de NoFap (mínimo ${sc.unlockDays}). Recaiu, sela de novo.`
              : `Seladas até o NoFap chegar a ${sc.unlockDays} dias completos. Você está com ${nfDays}. Pode escrever; não dá para reler.`}
        </div>
        <textarea id="scroll-text" value={text} onChange={(e) => setText(e.target.value)} rows={3} maxLength={600} aria-label={tab === "ambicao" ? "Nova ambição" : "Nova fantasia"}
          placeholder={tab === "ambicao" ? "Ex.: casa própria até os 28, viagem para o Japão…" : "Escreva. Ao salvar, ela é selada."}
          style={{ width: "100%", background: "#1c0b0d", border: "1px solid #5a2a2c", color: ink, fontFamily: BOOK_SERIF, fontSize: 18, padding: 10, resize: "vertical", outline: "none" }} />
        <button onClick={add} disabled={!text.trim()} style={{ ...btnPrimary, width: "100%", marginTop: 6, background: red, opacity: text.trim() ? 1 : 0.4 }}>Escrever no pergaminho</button>
        {msg && <div role="status" style={{ fontSize: 13, color: red, marginTop: 6 }}>{msg}</div>}

        <div style={{ marginTop: 12 }}>
          {list.length === 0 && <div style={{ fontSize: 13, color: faded, padding: "8px 0" }}>Nada escrito aqui ainda.</div>}
          {list.map((e) => {
            const sealed = e.kind === "fantasia" && !fantasyOpen;
            const done = e.status === "realizada";
            return (
              <div key={e.id} style={{ borderTop: "1px solid #3a1416", padding: "10px 0" }}>
                {sealed ? (
                  <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                    <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="15" fill="#7a0f12" stroke="#b91c1c" /><path d="M11 17h12M17 11v12" stroke="#ffb4b4" strokeWidth="1.4" opacity=".7" /></svg>
                    <div style={{ flex: 1 }}>
                      <div style={{ fontSize: 14, color: ink }}>Selada{done ? " · realizada" : ""}</div>
                      <div style={{ fontSize: 12, color: faded }}>Escrita em {fmt(e.createdAt)} · abre com NoFap ≥ {sc.unlockDays} dias</div>
                    </div>
                  </div>
                ) : (
                  <div>
                    <div style={{ fontFamily: BOOK_SERIF, fontSize: 19, color: e.kind === "ambicao" && done ? "#f0c060" : done ? faded : ink, textDecoration: done && e.kind !== "ambicao" ? "line-through" : "none", lineHeight: 1.35, whiteSpace: "pre-wrap" }}>{e.text}</div>
                    <div style={{ fontSize: 12, color: faded, marginTop: 2 }}>
                      {e.kind === "ambicao" && <b style={{ color: done ? "#f0c060" : ambFog(e) ? "#a8a29e" : red, letterSpacing: 0.5 }}>{done ? "CONSUMADA" : ambFog(e) ? "NA NÉVOA" : "ACESA"} · </b>}
                      {fmt(e.createdAt)}{done ? ` · ${e.kind === "ambicao" ? "consumada" : "realizada"} em ${fmt(e.doneAt)}` : ""}
                    </div>
                    {e.kind === "ambicao" && e.proof && <div style={{ fontSize: 13, color: ink, marginTop: 4 }}><span style={{ color: red, fontWeight: 700 }}>Prova:</span> {e.proof}</div>}
                  </div>
                )}
                {!sealed && (
                  <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginTop: 8 }}>
                    {e.kind === "ambicao" && !done && <button onClick={() => setAct(act && act.id === e.id && act.kind === "goal" ? null : { id: e.id, kind: "goal" })} style={small}>→ Meta</button>}
                    {e.kind === "ambicao" && !done && <button onClick={() => setAct(act && act.id === e.id && act.kind === "shop" ? null : { id: e.id, kind: "shop" })} style={small}>→ Loja</button>}
                    {e.kind === "ambicao" && ambFog(e) && dark.free > 0 && <button onClick={() => light(e.id)} style={{ ...small, borderColor: red }}>Acender</button>}
                    {e.kind === "ambicao" && ambLit(e) && <button onClick={() => { setProofText(e.proof || ""); setAct(act && act.id === e.id && act.kind === "proof" ? null : { id: e.id, kind: "proof" }); }} style={small}>{e.proof ? "Editar prova" : "Escrever prova"}</button>}
                    {e.kind === "ambicao" && ambLit(e) && e.proof && <button onClick={() => onConsume(e.id)} style={{ ...small, borderColor: "#b8860b", color: "#f0c060" }}>✓ Consumar +{AMB_COINS} 🪙</button>}
                    {e.kind === "fantasia" && !done && <button onClick={() => upd(e.id, { status: "realizada", doneAt: Date.now() })} style={{ ...small, borderColor: "#b8860b", color: "#f0c060" }}>Selar como realizada</button>}
                    <button onClick={() => setAct({ id: e.id, kind: "burn" })} style={{ ...small, color: faded }}>Queimar</button>
                  </div>
                )}
                {act && act.id === e.id && act.kind === "goal" && (
                  <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginTop: 8 }}>
                    <select value={goalList} onChange={(ev) => setGoalList(ev.target.value)} aria-label="Tipo de meta" style={{ ...inputStyle, flex: "1 1 110px" }}>
                      <option value="weeklies">Meta da semana</option><option value="monthlies">Meta do mês</option><option value="finals">Meta da rota</option>
                    </select>
                    <select value={goalAttr} onChange={(ev) => setGoalAttr(ev.target.value)} aria-label="Atributo" style={{ ...inputStyle, flex: "1 1 110px" }}>
                      {CORE_ATTRS.map((a) => <option key={a} value={a}>{a}</option>)}
                    </select>
                    <button onClick={() => { onToGoal(goalList, e.text.slice(0, 80), goalList === "finals" ? "S" : "C", [goalAttr]); setAct(null); setMsg("Virou meta em Objetivos."); }} style={btnPrimary}>Criar</button>
                  </div>
                )}
                {act && act.id === e.id && act.kind === "shop" && (
                  <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginTop: 8 }}>
                    <input value={price} onChange={(ev) => setPrice(ev.target.value.replace(/\D/g, ""))} inputMode="numeric" placeholder="Preço em moedas" aria-label="Preço em moedas" style={{ ...inputStyle, flex: "1 1 140px" }} />
                    <button onClick={() => { if (+price > 0) { onToShop(e.text.slice(0, 60), +price); setAct(null); setPrice(""); setMsg("Virou recompensa na Loja."); } }} style={btnPrimary}>Criar</button>
                  </div>
                )}
                {act && act.id === e.id && act.kind === "proof" && (
                  <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginTop: 8 }}>
                    <input value={proofText} onChange={(ev) => setProofText(ev.target.value)} maxLength={300} placeholder="A ação concreta que prova" aria-label="A prova" style={{ ...inputStyle, flex: "1 1 180px" }} />
                    <button onClick={() => { if (proofText.trim()) { saveProof(e.id, proofText.trim()); setAct(null); setMsg("Prova escrita. Agora cumpra."); } }} style={btnPrimary}>Salvar</button>
                  </div>
                )}
                {act && act.id === e.id && act.kind === "burn" && (
                  <div style={{ display: "flex", gap: 6, alignItems: "center", marginTop: 8, fontSize: 13, color: ink }}>
                    Queimar para sempre?
                    <button onClick={() => burn(e.id)} style={{ ...small, borderColor: red, color: red }}>Queimar</button>
                    <button onClick={() => setAct(null)} style={small}>Cancelar</button>
                  </div>
                )}
              </div>
            );
          })}
        </div>

        <button onClick={() => setShowCfg(!showCfg)} style={{ ...small, border: "none", color: faded, marginTop: 10, padding: 0 }}>{showCfg ? "▾ Fechar ajustes do pergaminho" : "▸ Ajustes do pergaminho"}</button>
        {showCfg && (
          <div style={{ marginTop: 8, display: "grid", gap: 8 }}>
            <label style={{ fontSize: 13, color: ink, display: "flex", alignItems: "center", gap: 8 }}>
              Fantasias abrem com NoFap de
              <select value={sc.unlockDays} onChange={(ev) => onScroll((x) => ({ ...x, unlockDays: Number(ev.target.value) }))} style={{ ...inputStyle, flex: "0 0 90px" }}>
                {[7, 14, 21, 30].map((d) => <option key={d} value={d}>{d} dias</option>)}
              </select>
            </label>
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
              <button onClick={() => { setAct("newpin"); setPin(""); setPin1(null); setMsg(""); }} style={small}>{sc.pinHash ? "Trocar PIN" : "Criar PIN"}</button>
              {sc.pinHash && <button onClick={() => { onScroll((x) => ({ ...x, pinHash: null, noPin: true })); setMsg("PIN removido."); }} style={small}>Remover PIN</button>}
            </div>
            <div style={{ fontSize: 12, color: faded }}>O conteúdo do pergaminho vai junto no arquivo de backup.</div>
          </div>
        )}
      </div>
    );
  }

  return (
    <div role="dialog" aria-modal="true" aria-label="Pergaminho Negro"
      style={{ position: "fixed", inset: 0, zIndex: 85, background: "rgba(0,0,0,0.82)", display: "flex", alignItems: "center", justifyContent: "center",
        padding: "calc(12px + env(safe-area-inset-top, 0px)) 12px calc(12px + env(safe-area-inset-bottom, 0px))",
        animation: phase === "opening" ? "overlayIn .4s ease both" : phase === "closing" ? "fadeOut .35s ease .25s both" : "none" }}>
      <div style={{ position: "relative", width: "min(100%, 520px)", maxHeight: "100%", display: "flex", flexDirection: "column" }}>
        <div aria-hidden="true" style={{ height: 22, borderRadius: 11, background: "linear-gradient(180deg,#3a1216,#1a0709)", border: "1px solid #7a1f24", boxShadow: "0 4px 10px #000a", zIndex: 2 }} />
        <div style={{ background: paper, backgroundImage: "radial-gradient(ellipse at 30% 10%, rgba(120,20,25,0.25), transparent 60%), repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0 2px, transparent 2px 4px)",
          borderLeft: "1px solid #3a1416", borderRight: "1px solid #3a1416", margin: "-4px 6px", padding: "14px 16px", overflowY: "auto", color: ink,
          transformOrigin: "top center", animation: phase === "opening" ? "scrollUnroll .9s cubic-bezier(.3,.7,.2,1) both" : phase === "closing" ? "scrollRoll .55s ease-in both" : "none" }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
            <span style={{ fontFamily: F.display, fontSize: 26, color: red }}>Pergaminho Negro</span>
            <button onClick={close} style={{ ...small }}>Fechar</button>
          </div>
          {body}
        </div>
        <div aria-hidden="true" style={{ height: 22, borderRadius: 11, background: "linear-gradient(180deg,#3a1216,#1a0709)", border: "1px solid #7a1f24", boxShadow: "0 -4px 10px #000a", zIndex: 2,
          animation: phase === "opening" ? "scrollRollerDown .9s cubic-bezier(.3,.7,.2,1) both" : "none" }} />
      </div>
    </div>
  );
}

function BookButton({ onOpen, status }) {
  const pre = !!status.notStarted;
  const urgent = !pre && !status.writtenToday && status.msLeft <= 3 * 3600000;
  const calling = !pre && !status.writtenToday;
  const badge = pre ? fmtDM(status.startKey) : status.late ? `−${status.charged * DIARY_PENALTY}` : status.writtenToday ? "✓" : fmtLeft(status.msLeft);
  const badgeBg = pre ? "#3a2a1a" : status.late || urgent ? "#c1121f" : status.writtenToday ? "#2f6b45" : "#6b4a2a";
  const label = pre ? `Abrir o diário. Começa a valer em ${fmtDM(status.startKey)}` : status.late ? `Abrir o diário. Atrasado há ${status.lateHours} hora(s)` : status.writtenToday ? "Abrir o diário. Página de hoje escrita" : `Abrir o diário. Faltam ${fmtLeft(status.msLeft)} para o prazo`;
  return (
    <button onClick={onOpen} aria-label={label}
      style={{ flex: "0 0 auto", width: 40, height: 48, padding: 0, border: `1px solid #6b4a2a`, borderRadius: "3px 6px 6px 3px", cursor: "pointer",
        background: `linear-gradient(90deg, #12060a 0 7px, ${PAPER.leather} 7px 100%)`,
        boxShadow: "2px 3px 0 #0005, inset -3px 0 0 #00000040",
        animation: status.late ? "bookLate 1.2s ease-in-out infinite" : calling ? "bookCall 2.6s ease-in-out infinite" : "none",
        position: "relative", display: "flex", alignItems: "center", justifyContent: "center" }}>
      <span style={{ marginLeft: 6 }}><BookEmblem size={24} color={status.late || urgent ? "#ff6b6b" : "#e0b252"} /></span>
      <span aria-hidden="true" style={{ position: "absolute", bottom: -9, left: "50%", transform: "translateX(-50%)", minWidth: 34, padding: "1px 5px",
        background: badgeBg, color: "#fff", fontFamily: F.ui, fontSize: 11, fontWeight: 700, lineHeight: "15px", borderRadius: 3, whiteSpace: "nowrap", fontVariantNumeric: "tabular-nums" }}>{badge}</span>
    </button>
  );
}

const BOOK_OPEN_MS = 2300;
const BOOK_CLOSE_MS = 1450;
const LEAF_MS = 1000;
function DiaryBook({ journal, journalXp, onSave, onClose, status, onDeadline, startKey }) {
  const today = dayKey(new Date());
  const still = reducedMotion();
  const [phase, setPhase] = useState(still ? "open" : "opening");
  const [view, setView] = useState("page");
  const [day, setDay] = useState(today);
  const [text, setText] = useState((journal[today] && journal[today].text) || "");
  const [saved, setSaved] = useState(true);
  const [ignite, setIgnite] = useState(false);
  const [turn, setTurn] = useState({ n: 0, dir: 1 });
  const [query, setQuery] = useState("");
  const [leaf, setLeaf] = useState(null); /* a folha da página anterior, virando por cima da nova */
  const timer = useRef(null);
  const wasEmpty = useRef(!(journal[today] && journal[today].text));
  const xpLeft = useRef(!(journalXp && journalXp[today]) && !(startKey && today < startKey));
  const lastToday = useRef(today);
  useEffect(() => {
    if (lastToday.current === today) return;
    const was = lastToday.current;
    lastToday.current = today;
    /* virou o dia com o livro aberto: se a página de ontem está vazia, vai para hoje; se tem texto, você termina a de ontem */
    if (day === was && !text.trim()) {
      setDay(today);
      setText((journal[today] && journal[today].text) || "");
      wasEmpty.current = !(journal[today] && journal[today].text);
      xpLeft.current = !(journalXp && journalXp[today]) && !(startKey && today < startKey);
    }
  }, [today]);

  useEffect(() => {
    if (phase !== "opening") return;
    const t = setTimeout(() => setPhase("open"), BOOK_OPEN_MS);
    return () => clearTimeout(t);
  }, [phase]);
  useEffect(() => () => clearTimeout(timer.current), []);
  useEffect(() => {
    if (!leaf) return;
    const t = setTimeout(() => setLeaf((l) => (l && l.key === leaf.key ? null : l)), LEAF_MS + 60);
    return () => clearTimeout(t);
  }, [leaf]);

  const flush = () => {
    if (timer.current) { clearTimeout(timer.current); timer.current = null; if (!saved) { onSave(day, text); setSaved(true); } }
  };
  const close = () => {
    flush();
    if (still) { onClose(); return; }
    setPhase("closing");
    setTimeout(onClose, BOOK_CLOSE_MS);
  };
  const openDay = (k, dir) => {
    flush();
    const fromPage = view === "page";
    if (!still && fromPage && k !== day) setLeaf({ key: Date.now(), dir: dir || 1, day, text });
    setDay(k);
    setText((journal[k] && journal[k].text) || "");
    setSaved(true);
    setView("page");
    wasEmpty.current = !(journal[k] && journal[k].text);
    if (!fromPage) setTurn({ n: turn.n + 1, dir: dir || 1 });
  };
  const onType = (v) => {
    setText(v);
    setSaved(false);
    clearTimeout(timer.current);
    timer.current = setTimeout(() => {
      timer.current = null;
      onSave(day, v);
      setSaved(true);
      const okLen = v.trim().length >= DIARY_MIN;
      if (!okLen && day === today) { wasEmpty.current = true; xpLeft.current = !(startKey && today < startKey); }
      if (wasEmpty.current && okLen && day === today) {
        wasEmpty.current = false;
        setIgnite(xpLeft.current ? "xp" : "on");
        xpLeft.current = false;
        setTimeout(() => setIgnite(false), 2600);
      }
    }, 600);
  };

  const days = Object.keys(journal).filter((k) => journal[k] && journal[k].text && journal[k].text.trim()).sort();
  const first = days.length && days[0] < today ? days[0] : today;
  const chapterStart = weekStartKey(parseKey(first));
  const chapterOf = (k) => Math.floor(daysBetween(chapterStart, k) / 7) + 1;
  const lit = (k) => pageOk(journal[k]) || (k === day && text.trim().length >= DIARY_MIN);
  const short = text.trim().length > 0 && text.trim().length < DIARY_MIN;
  const preStart = !!(startKey && day < startKey);
  const words = text.trim() ? text.trim().split(/\s+/).length : 0;
  const q = query.trim().toLowerCase();
  const results = q.length >= 2 ? days.filter((k) => journal[k].text.toLowerCase().includes(q)).reverse().slice(0, 20).map((k) => {
    const t = journal[k].text, i = t.toLowerCase().indexOf(q);
    const a = Math.max(0, i - 40), b = Math.min(t.length, i + q.length + 40);
    return { k, snip: `${a > 0 ? "…" : ""}${t.slice(a, b).replace(/\s+/g, " ")}${b < t.length ? "…" : ""}` };
  }) : [];

  const inkBtn = { background: "none", border: `1px solid ${PAPER.faded}`, color: PAPER.ink, fontFamily: F.ui, fontSize: 14, fontWeight: 600, padding: "6px 12px", cursor: "pointer" };
  const navInk = { width: 44, height: 40, background: "none", border: `1px solid ${PAPER.faded}`, color: PAPER.ink, fontSize: 22, cursor: "pointer" };

  return (
    <div role="dialog" aria-modal="true" aria-label="Diário"
      style={{ position: "fixed", inset: 0, zIndex: 80, background: "rgba(0,0,0,0.78)", display: "flex", alignItems: "center", justifyContent: "center",
        padding: "calc(12px + env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px))",
        animation: phase === "opening" ? "overlayIn .6s ease both" : phase === "closing" ? "fadeOut .45s ease .95s both" : "none" }}>
      {phase === "opening" && (
        <div onClick={() => setPhase("open")} aria-hidden="true" style={{ position: "absolute", inset: 0, zIndex: 5, cursor: "pointer" }} />
      )}
      <div style={{ position: "relative", width: "min(100%, 540px)", height: "min(100%, 780px)", perspective: "1800px",
        animation: phase === "opening" ? "bookArrive .75s cubic-bezier(.22,1,.36,1) both" : phase === "closing" ? "bookLeave .6s cubic-bezier(.5,0,.75,0) .8s both" : "none",
        willChange: phase === "open" ? "auto" : "transform, opacity" }}>

        {/* página */}
        <div style={{ position: "absolute", inset: 0, background: PAPER.page, color: PAPER.ink, borderRadius: "2px 8px 8px 2px",
          boxShadow: `inset 14px 0 18px -10px rgba(60,35,15,0.45), 0 18px 40px rgba(0,0,0,0.6), 6px 0 0 ${PAPER.edge}, 9px 2px 0 #c9b48c`,
          backgroundImage: "radial-gradient(ellipse at 20% 10%, rgba(255,255,255,0.35), transparent 55%), radial-gradient(ellipse at 90% 95%, rgba(120,80,40,0.12), transparent 60%)",
          display: "flex", flexDirection: "column", padding: "16px 18px 14px 26px", overflow: "hidden" }}>

          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8 }}>
            <button onClick={() => setView(view === "page" ? "index" : "page")} style={inkBtn}>{view === "page" ? "Índice" : "Voltar à página"}</button>
            <button onClick={close} style={inkBtn}>Fechar</button>
          </div>

          {view === "page" ? (
            <div key={turn.n} style={{ flex: 1, display: "flex", flexDirection: "column", minHeight: 0, transformOrigin: turn.dir > 0 ? "left center" : "right center",
              animation: turn.n ? `${turn.dir > 0 ? "pageFlip" : "pageFlipBack"} .45s ease-out` : "none" }}>
              <div style={{ textAlign: "center", marginTop: 12 }}>
                <div style={{ fontFamily: F.display, fontSize: 26, lineHeight: 1.1, color: PAPER.ink }}>{longDate(day)}</div>
                <div style={{ fontFamily: BOOK_SERIF, fontStyle: "italic", fontSize: 16, color: PAPER.faded }}>Capítulo {roman(chapterOf(day))}</div>
                {day === today && (
                  <div role="status" style={{ marginTop: 6, fontFamily: F.ui, fontSize: 13, fontWeight: 600,
                    color: preStart ? PAPER.faded : status.late ? "#9b1111" : status.writtenToday || text.trim().length >= DIARY_MIN ? "#2f6b45" : status.msLeft <= 3 * 3600000 ? "#9b1111" : PAPER.faded }}>
                    {preStart ? `O diário começa a valer em ${fmtDM(startKey)}. Esta página é rascunho: não rende XP nem conta.` : status.late
                      ? `Atrasado há ${status.lateHours}h: −${Math.min(DIARY_CAP_HOURS, status.lateHours) * DIARY_PENALTY} XP. Escreva para parar a penalidade.`
                      : status.writtenToday || text.trim().length >= DIARY_MIN
                        ? `Página de hoje escrita. Próximo prazo amanhã às ${status.hhmm}.`
                        : `Prazo hoje às ${status.hhmm} · faltam ${fmtLeft(status.msLeft)}. Depois disso, −${DIARY_PENALTY} XP por hora (máx. −${DIARY_PENALTY * DIARY_CAP_HOURS}).`}
                  </div>
                )}
              </div>
              <textarea id="diary-text" value={text} onChange={(e) => onType(e.target.value)} placeholder="Escreva como foi o dia. Ninguém mais lê." aria-label={`Página de ${longDate(day)}`}
                style={{ flex: 1, minHeight: 0, marginTop: 10, width: "100%", resize: "none", border: "none", outline: "none", background: "transparent",
                  color: PAPER.ink, fontFamily: BOOK_SERIF, fontSize: 21, fontWeight: 500, lineHeight: "32px", padding: "0 2px",
                  backgroundImage: `repeating-linear-gradient(transparent, transparent 31px, ${PAPER.rule} 31px, ${PAPER.rule} 32px)`, backgroundAttachment: "local" }} />
              {short && !preStart && <div role="status" style={{ textAlign: "center", fontFamily: F.ui, fontSize: 13, fontWeight: 600, color: "#9b1111", margin: "4px 0" }}>Faltam {DIARY_MIN - text.trim().length} letras para a página valer.</div>}
              {ignite && <div role="status" style={{ textAlign: "center", fontFamily: F.display, fontSize: 19, color: "#8a5a12", margin: "4px 0" }}>O selo do dia acendeu.{ignite === "xp" ? " +10 XP" : ""}</div>}
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8, marginTop: 8 }}>
                <button aria-label="Página anterior" onClick={() => openDay(addDays(day, -1), -1)} style={navInk}>‹</button>
                <div style={{ textAlign: "center", fontFamily: F.ui, fontSize: 12, color: PAPER.faded }}>
                  {words} palavra(s) · {saved ? (text.trim() ? "salvo" : "em branco") : "salvando…"}
                  {day !== today && <><br /><button onClick={() => openDay(today, 1)} style={{ background: "none", border: "none", color: PAPER.ink, fontFamily: F.ui, fontSize: 13, textDecoration: "underline", cursor: "pointer", padding: 0 }}>ir para hoje</button></>}
                </div>
                <button aria-label="Próxima página" onClick={() => day < today && openDay(addDays(day, 1), 1)} disabled={day >= today} style={{ ...navInk, opacity: day >= today ? 0.3 : 1 }}>›</button>
              </div>
            </div>
          ) : (
            <div style={{ flex: 1, overflowY: "auto", marginTop: 12, minHeight: 0 }}>
              <div style={{ fontFamily: F.display, fontSize: 26, textAlign: "center", color: PAPER.ink }}>Índice</div>
              <div style={{ fontFamily: BOOK_SERIF, fontStyle: "italic", fontSize: 16, textAlign: "center", color: PAPER.faded, marginBottom: 8 }}>{days.length} página(s) escritas</div>
              <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10, flexWrap: "wrap" }}>
                <label htmlFor="diary-deadline" style={{ fontFamily: F.ui, fontSize: 14, color: PAPER.ink }}>Prazo diário</label>
                <select id="diary-deadline" value={status.hhmm} onChange={(e) => onDeadline(e.target.value)}
                  style={{ background: "rgba(255,255,255,0.35)", border: `1px solid ${PAPER.faded}`, color: PAPER.ink, fontFamily: F.ui, fontSize: 15, padding: "6px 8px" }}>
                  {DIARY_DEADLINES.map((h) => <option key={h} value={h}>{h}</option>)}
                </select>
                <span style={{ fontFamily: F.ui, fontSize: 12, color: PAPER.faded }}>Atraso: −{DIARY_PENALTY} XP por hora, no máximo −{DIARY_PENALTY * DIARY_CAP_HOURS}. O nível não cai.</span>
              </div>
              <input id="diary-search" value={query} onChange={(e) => setQuery(e.target.value)} placeholder="Buscar uma palavra"
                style={{ width: "100%", background: "rgba(255,255,255,0.35)", border: `1px solid ${PAPER.faded}`, color: PAPER.ink, fontFamily: F.ui, fontSize: 15, padding: "8px 10px", outline: "none" }} />
              {q.length >= 2 && (
                <div style={{ marginTop: 6 }}>
                  {results.length === 0 && <div style={{ fontFamily: BOOK_SERIF, fontSize: 17, color: PAPER.faded, padding: "8px 0" }}>Nada encontrado.</div>}
                  {results.map((r) => (
                    <button key={r.k} onClick={() => { setQuery(""); openDay(r.k, r.k < day ? -1 : 1); }}
                      style={{ display: "block", width: "100%", textAlign: "left", background: "none", border: "none", borderBottom: `1px solid ${PAPER.rule}`, padding: "8px 0", cursor: "pointer" }}>
                      <span style={{ display: "block", fontFamily: F.ui, fontSize: 13, color: PAPER.faded }}>{longDate(r.k)}</span>
                      <span style={{ display: "block", fontFamily: BOOK_SERIF, fontSize: 17, color: PAPER.ink, lineHeight: 1.3 }}>{r.snip}</span>
                    </button>
                  ))}
                </div>
              )}
              {Array.from({ length: chapterOf(today) }, (_, i) => chapterOf(today) - i).map((c) => {
                const start = addDays(chapterStart, (c - 1) * 7);
                const keys = Array.from({ length: 7 }, (_, i) => addDays(start, i));
                const count = keys.filter((k) => lit(k)).length;
                return (
                  <div key={c} style={{ padding: "10px 0", borderBottom: `1px solid ${PAPER.rule}` }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline" }}>
                      <span style={{ fontFamily: F.display, fontSize: 21, color: PAPER.ink }}>Capítulo {roman(c)}</span>
                      <span style={{ fontFamily: F.ui, fontSize: 12, color: PAPER.faded }}>{Number(start.slice(8))}/{start.slice(5, 7)} · {count}/7</span>
                    </div>
                    <div style={{ display: "flex", justifyContent: "space-between", gap: 4, marginTop: 6 }}>
                      {keys.map((k) => {
                        const on = lit(k), future = k > today;
                        return (
                          <button key={k} onClick={() => !future && openDay(k, k < day ? -1 : 1)} disabled={future} aria-label={`${longDate(k)}${on ? ", escrito" : ""}`}
                            style={{ width: 34, height: 34, borderRadius: "50%", cursor: future ? "default" : "pointer", fontFamily: F.ui, fontSize: 12, fontWeight: 700,
                              background: on ? "#8a1c1c" : "transparent", color: on ? "#f6e7d0" : PAPER.faded, opacity: future ? 0.35 : 1,
                              border: `${k === day ? 2 : 1}px solid ${k === day ? PAPER.ink : on ? "#8a1c1c" : PAPER.faded}`,
                              boxShadow: on ? "0 0 0 2px rgba(138,28,28,0.15)" : "none" }}>
                            {Number(k.slice(8))}
                          </button>
                        );
                      })}
                    </div>
                  </div>
                );
              })}
              <div style={{ fontFamily: F.ui, fontSize: 12, color: PAPER.faded, marginTop: 10 }}>O diário fica só neste celular e entra no backup do Perfil.</div>
            </div>
          )}
        </div>

        {/* folha da página anterior: gira pela lombada (avançar) ou se solta pela direita (voltar) */}
        {leaf && (
          <div key={leaf.key} aria-hidden="true" style={{ position: "absolute", inset: 0, pointerEvents: "none", zIndex: 2, perspective: "1100px" }}>
            <div style={{ position: "absolute", inset: 0, borderRadius: "2px 8px 8px 2px",
              background: `linear-gradient(${leaf.dir > 0 ? "90deg" : "270deg"}, rgba(60,35,15,0.38), transparent 70%)`,
              animation: `shadeOut ${LEAF_MS}ms ease both` }} />
            <div style={{ position: "absolute", inset: 0, transformOrigin: leaf.dir > 0 ? "left center" : "right center", transformStyle: "preserve-3d", willChange: "transform",
              animation: `${leaf.dir > 0 ? "leafFwd" : "leafBack"} ${LEAF_MS}ms cubic-bezier(.35,.1,.3,1) both` }}>
              <div style={{ position: "absolute", inset: 0, backfaceVisibility: "hidden", WebkitBackfaceVisibility: "hidden", background: PAPER.page, color: PAPER.ink,
                borderRadius: "2px 8px 8px 2px", boxShadow: "inset 14px 0 18px -10px rgba(60,35,15,0.45)",
                backgroundImage: "radial-gradient(ellipse at 20% 10%, rgba(255,255,255,0.35), transparent 55%)",
                display: "flex", flexDirection: "column", padding: "16px 18px 14px 26px", overflow: "hidden" }}>
                <div style={{ height: 33, flex: "none" }} />
                <div style={{ textAlign: "center", marginTop: 12 }}>
                  <div style={{ fontFamily: F.display, fontSize: 26, lineHeight: 1.1, color: PAPER.ink }}>{longDate(leaf.day)}</div>
                  <div style={{ fontFamily: BOOK_SERIF, fontStyle: "italic", fontSize: 16, color: PAPER.faded }}>Capítulo {roman(chapterOf(leaf.day))}</div>
                </div>
                <div style={{ flex: 1, marginTop: 10, whiteSpace: "pre-wrap", wordBreak: "break-word", overflow: "hidden", fontFamily: BOOK_SERIF, fontSize: 21, fontWeight: 500,
                  lineHeight: "32px", padding: "0 2px", color: PAPER.ink, backgroundImage: `repeating-linear-gradient(transparent, transparent 31px, ${PAPER.rule} 31px, ${PAPER.rule} 32px)` }}>{leaf.text}</div>
                <div style={{ position: "absolute", inset: 0, background: `linear-gradient(${leaf.dir > 0 ? "270deg" : "90deg"}, rgba(60,35,15,0.3), transparent 55%)`,
                  animation: `leafShade ${LEAF_MS}ms ease both` }} />
              </div>
              <div style={{ position: "absolute", inset: 0, backfaceVisibility: "hidden", WebkitBackfaceVisibility: "hidden", transform: "rotateY(180deg)",
                borderRadius: "8px 2px 2px 8px", background: `linear-gradient(${leaf.dir > 0 ? "270deg" : "90deg"}, ${PAPER.edge}, ${PAPER.page} 35%, ${PAPER.page})`,
                boxShadow: "inset 0 0 30px rgba(120,80,40,0.18)" }} />
            </div>
          </div>
        )}

        {/* sombra da capa sobre a página: some enquanto a capa abre */}
        {!still && phase !== "open" && (
          <div aria-hidden="true" style={{ position: "absolute", inset: 0, pointerEvents: "none", zIndex: 3, borderRadius: "2px 8px 8px 2px",
            background: "linear-gradient(90deg, rgba(20,8,4,0.85), rgba(20,8,4,0.35) 60%, rgba(20,8,4,0.15))",
            animation: phase === "opening" ? "shadeOut 1.3s ease .95s both" : "shadeIn .8s ease both" }} />
        )}

        {/* capa: abre devagar pela lombada e fecha na volta; o verso aparece quando passa da metade */}
        {!still && phase !== "open" && (
          <div aria-hidden="true" style={{ position: "absolute", inset: 0, zIndex: 4, transformOrigin: "left center", transformStyle: "preserve-3d", pointerEvents: "none", willChange: "transform, opacity",
            animation: phase === "opening" ? "coverSwing 1.3s cubic-bezier(.5,.05,.2,1) .95s both" : "coverShut .8s cubic-bezier(.55,0,.35,1) both" }}>
            <div style={{ position: "absolute", inset: 0, backfaceVisibility: "hidden", WebkitBackfaceVisibility: "hidden",
              borderRadius: "3px 10px 10px 3px", border: "1px solid #6b4a2a",
              background: `linear-gradient(90deg, #12060a 0 18px, ${PAPER.leather} 18px 100%)`,
              boxShadow: "inset -10px 0 24px rgba(0,0,0,0.5), 0 18px 40px rgba(0,0,0,0.6)",
              display: "flex", alignItems: "center", justifyContent: "center" }}>
              <div style={{ position: "absolute", inset: 18, border: "1px solid #e0b25255" }} />
              <div style={{ animation: phase === "opening" ? "emblemGlow .8s ease .45s both" : "none", display: "flex" }}>
                <BookEmblem size={140} color="#e0b252" />
              </div>
            </div>
            <div style={{ position: "absolute", inset: 0, backfaceVisibility: "hidden", WebkitBackfaceVisibility: "hidden", transform: "rotateY(180deg)",
              borderRadius: "10px 3px 3px 10px", background: "linear-gradient(270deg, #1a0a0c, #3a1a16 40%, #2a1210)",
              boxShadow: "inset 0 0 40px rgba(0,0,0,0.55)" }}>
              <div style={{ position: "absolute", inset: 14, border: "1px solid rgba(224,178,82,0.18)" }} />
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

/* ==================== COMPONENTES BASE ==================== */
const inputStyle = { flex: 1, get background() { return T.input; }, get border() { return `1px solid ${T.border}`; }, get color() { return T.text; }, padding: "10px 12px", fontSize: 15, outline: "none", minWidth: 0, fontFamily: "inherit" };
const btnPrimary = { get background() { return T.sys ? "#1d6fd8" : T.glow; }, border: "none", color: "#fff", padding: "10px 16px", fontWeight: 700, fontSize: 14, fontFamily: "inherit", cursor: "pointer", get boxShadow() { return `0 0 12px ${T.glow}88`; } };
const navBtn = { width: 44, height: 40, background: "transparent", get border() { return `1px solid ${T.border}`; }, get color() { return T.accentSoft; }, fontSize: 22, cursor: "pointer" };
const btnDanger = { background: "transparent", get border() { return `1px solid ${T.danger}`; }, get color() { return T.danger; }, padding: "8px 12px", fontSize: 13, fontWeight: 700, fontFamily: "inherit", cursor: "pointer" };

function Corner({ pos }) {
  const s = { position: "absolute", width: 10, height: 10 };
  const map = {
    tl: { top: -1, left: -1, borderTop: "2px solid", borderLeft: "2px solid" },
    tr: { top: -1, right: -1, borderTop: "2px solid", borderRight: "2px solid" },
    bl: { bottom: -1, left: -1, borderBottom: "2px solid", borderLeft: "2px solid" },
    br: { bottom: -1, right: -1, borderBottom: "2px solid", borderRight: "2px solid" },
  };
  return <div style={{ ...s, ...map[pos], borderColor: T.accent }} />;
}

function Stat({ label, value, color }) {
  return (
    <div data-pn="" style={{ border: `1px solid ${T.border}`, background: T.panel, padding: "10px 8px", textAlign: "center" }}>
      <div style={{ fontSize: 19, fontWeight: 700, color: color || T.text, fontVariantNumeric: "tabular-nums" }}>{value}</div>
      <div style={{ fontSize: 12, color: T.muted, marginTop: 3 }}>{label}</div>
    </div>
  );
}

function Section({ title, children, accent, glow }) {
  const framed = !!accent;
  const style = framed
    ? { position: "relative", marginTop: 18, border: `1px solid ${accent}66`, background: T.panel, padding: "14px 14px 16px", boxShadow: `0 0 22px ${glow || accent + "22"}` }
    : { marginTop: 24, paddingTop: 12, borderTop: T.sys ? "none" : `1px solid ${T.border}` };
  return (
    <section data-pn={framed ? "" : undefined} style={style}>
      {T.sys
        ? <h2 style={{ display: "flex", alignItems: "center", gap: 9, fontFamily: F.ui, fontWeight: 700, fontSize: 13.5, lineHeight: 1.2, letterSpacing: "0.22em", textTransform: "uppercase", color: accent || T.accentSoft, margin: "0 0 12px" }}>
            <span aria-hidden="true" style={{ flex: "none", width: 7, height: 7, background: accent || T.accent, transform: "rotate(45deg)" }} />
            <span style={{ minWidth: 0 }}>{title}</span>
            <span aria-hidden="true" style={{ flex: 1, minWidth: 12, height: 1, background: `linear-gradient(90deg, ${accent || T.accent}88, transparent)` }} />
          </h2>
        : <h2 style={{ fontFamily: F.display, fontWeight: 600, fontSize: 23, lineHeight: 1.1, color: accent || T.accentSoft, margin: "0 0 10px", textWrap: "balance" }}>{title}</h2>}
      {children}
    </section>
  );
}

function Empty({ text }) {
  return <div style={{ color: T.muted, fontSize: 13, padding: "10px 0" }}>{text}</div>;
}

function FinalDetail({ f, fx, routeEnd, color }) {
  const today = dayKey(new Date());
  const st = finalStatus(f, today, routeEnd);
  const [due, setDue] = useState(st.eff);
  const [mt, setMt] = useState("");
  const [md, setMd] = useState("");
  const cost = due > st.eff && !st.overdue ? Math.round(goalXP(f, true) * POSTPONE_RATE) : 0;
  const small = { ...inputStyle, flex: "0 0 auto", width: 150 };
  return (
    <div data-pn="" style={{ margin: "4px 0 10px 36px", padding: 10, border: `1px solid ${T.border}`, background: T.panel2 }}>
      <div style={{ fontSize: 12, fontWeight: 700, color: T.gold, letterSpacing: 0.4, marginBottom: 6 }}>PRAZO</div>
      {f.done ? <div style={{ fontSize: 13, color: T.muted }}>Concluído.</div> : (
        <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
          <input type="date" value={due} min={today} onChange={(e) => e.target.value && setDue(e.target.value)} aria-label={`Prazo de ${f.title}`} style={small} />
          <button onClick={() => fx.setFinalDue(f.id, due)} disabled={due === st.eff}
            style={{ ...btnPrimary, padding: "8px 12px", opacity: due === st.eff ? 0.5 : 1, background: cost ? T.danger : color }}>
            {cost ? `Adiar · −${cost} XP` : "Salvar prazo"}
          </button>
        </div>
      )}
      {(f.postponed || []).length > 0 && (
        <div style={{ fontSize: 12, color: T.muted, marginTop: 6 }}>
          Histórico: {f.postponed.map((p) => `${fmtDM(p.from)} → ${fmtDM(p.to)}${p.cost ? ` (−${p.cost})` : ""}`).join(" · ")}
        </div>
      )}
      {fx.setObs && <ObsLine text={f.obs} onSave={(t) => fx.setObs("finals", f.id, t)} />}
      <div style={{ fontSize: 12, fontWeight: 700, color: T.gold, letterSpacing: 0.4, margin: "12px 0 4px" }}>MARCOS · {st.msDone}/{st.msTotal}</div>
      {(f.milestones || []).map((m) => {
        const late = !m.done && m.due && m.due < today;
        return (
          <div key={m.id} style={{ display: "flex", alignItems: "center", gap: 8, padding: "5px 0", borderTop: `1px solid ${T.border}55` }}>
            <button onClick={() => fx.toggleMilestone(f.id, m.id)} disabled={f.done} aria-label={`${m.done ? "Desmarcar" : "Concluir"} marco: ${m.title}`} aria-pressed={!!m.done}
              style={{ width: 22, height: 22, minWidth: 22, border: `1px solid ${m.done ? color : T.muted}`, background: m.done ? color : "transparent", color: m.done ? T.onAccent : "transparent", cursor: "pointer", fontSize: 13 }}>✓</button>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontSize: 13, color: m.done ? T.muted : T.text, textDecoration: m.done ? "line-through" : "none" }}>{m.title}</div>
              {(m.obs || fx.setObs) && <ObsLine small text={m.obs} onSave={fx.setObs ? (t) => fx.setObs("finals", f.id, t, m.id) : null} />}
            </div>
            {m.due && <span style={{ fontSize: 12, color: late ? T.danger : T.muted, whiteSpace: "nowrap" }}>{late ? "atrasado · " : ""}{fmtDM(m.due)}</span>}
            {!m.done && <button onClick={() => fx.removeMilestone(f.id, m.id)} aria-label={`Remover marco: ${m.title}`} style={{ background: "none", border: "none", color: T.muted, cursor: "pointer", padding: 4 }}>✕</button>}
          </div>
        );
      })}
      {!f.done && (
        <div style={{ display: "flex", gap: 6, marginTop: 6, flexWrap: "wrap" }}>
          <input value={mt} onChange={(e) => setMt(e.target.value)} placeholder="Novo marco…" aria-label={`Novo marco de ${f.title}`} style={{ ...inputStyle, minWidth: 140 }} />
          <input type="date" value={md} min={today} onChange={(e) => setMd(e.target.value)} aria-label="Data do marco" style={small} />
          <button onClick={() => { if (!mt.trim()) return; fx.addMilestone(f.id, mt.trim(), md || null); setMt(""); setMd(""); }} style={{ ...btnPrimary, padding: "8px 12px", background: color }}>+</button>
        </div>
      )}
      <div style={{ fontSize: 12, color: T.muted, marginTop: 10 }}>
        Metas ligadas concluídas: <b style={{ color: T.text }}>{f.fed || 0}</b>{f.lastFed ? ` · última em ${fmtDM(f.lastFed)}` : ""}
      </div>
    </div>
  );
}

function GoalList({ title, hint, items, isFinal, attrNames, onToggle, onAdd, onRemove, accent, glow, finals, fx, routeEnd, reviewTop, obsKey }) {
  const [txt, setTxt] = useState("");
  const [goalId, setGoalId] = useState("");
  const [dueNew, setDueNew] = useState("");
  const [openId, setOpenId] = useState(null);
  const todayK = dayKey(new Date());
  const openFinals = (finals || []).filter((f) => !f.done);
  const [diff, setDiff] = useState("C");
  const [xpCustom, setXpCustom] = useState("");
  const [pairs, setPairs] = useState([]);
  const sel = pairs.map((p) => p[0]);
  const [hideDone, setHideDone] = useState(false);
  const color = accent || T.accent;
  const glowColor = glow || T.glow;
  const doneCount = items.filter((g) => g.done).length;
  const visibleItems = hideDone ? items.filter((g) => !g.done) : items;
  const submit = () => {
    if (!txt.trim()) return;
    const subs = Object.fromEntries(pairs);
    onAdd(txt.trim(), diff, sel, xpCustom ? +xpCustom : null, isFinal ? { due: dueNew || null, subs } : { goalId: goalId ? Number(goalId) : null, subs });
    setTxt(""); setPairs([]); setXpCustom(""); setDueNew("");
  };
  return (
    <Section title={title} accent={accent} glow={glow}>
      <div style={{ fontSize: 12, color: T.muted, marginBottom: 8, lineHeight: 1.5 }}>{hint}</div>
      {reviewTop}

      {doneCount > 0 && (
        <button onClick={() => setHideDone(!hideDone)} style={{ background: "none", border: "none", color: T.muted, fontFamily: F.ui, fontSize: 10, letterSpacing: 1, cursor: "pointer", padding: 0, marginBottom: 10 }}>
          {hideDone ? `▸ mostrar concluídas (${doneCount})` : `▾ ocultar concluídas (${doneCount})`}
        </button>
      )}

      {visibleItems.length === 0 && <Empty text={hideDone && items.length > 0 ? "Todas concluídas estão ocultas." : "Nenhuma meta aqui ainda. Cadastre de 3 a 5, cada uma com atributo."} />}
      {visibleItems.map((g) => {
        const val = goalXP(g, isFinal);
        const st = isFinal ? finalStatus(g, todayK, routeEnd) : null;
        const link = !isFinal && g.goalId ? (finals || []).find((f) => f.id === g.goalId) : null;
        const dueCol = st ? (st.overdue || st.left <= 7 ? T.danger : st.left <= 14 ? "#f59e0b" : T.muted) : null;
        return (
          <React.Fragment key={g.id}>
          <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "10px 0", borderBottom: `1px solid ${T.border}66` }}>
            <button onClick={() => onToggle(g.id)} aria-label={`${g.done ? "Desmarcar" : "Concluir"}: ${g.title}`} aria-pressed={!!g.done}
              style={{ width: 26, height: 26, minWidth: 26, border: `1px solid ${g.done ? color : T.muted}`, background: g.done ? color : "transparent", color: g.done ? T.onAccent : "transparent", fontSize: 15, cursor: "pointer", boxShadow: g.done ? `0 0 10px ${glowColor}` : "none" }}>
              ✓
            </button>
            <div style={{ flex: 1 }}>
              <div style={{ fontSize: 14, textDecoration: g.done ? "line-through" : "none", color: g.done ? T.muted : T.text }}>{g.title}</div>
              {g.ifThen && <div style={{ fontSize: 12, color: T.accentSoft, marginTop: 2, lineHeight: 1.35 }}>↳ {g.ifThen}</div>}
              {link && <div style={{ fontSize: 12, color: CAT.final.color, marginTop: 2 }}>◆ serve a: {link.title}</div>}
              <ObsLine text={g.obs} onSave={fx && fx.setObs && obsKey ? (t) => fx.setObs(obsKey, g.id, t) : null} />
              {st && !g.done && (
                <div style={{ fontSize: 12, marginTop: 3, display: "flex", gap: 8, flexWrap: "wrap" }}>
                  <span style={{ color: dueCol, fontWeight: 700 }}>{st.overdue ? `☠ vencido há ${-st.left} d (${fmtDM(st.eff)})` : `⏳ ${st.left === 0 ? "vence hoje" : `faltam ${st.left} d`} · ${fmtDM(st.eff)}`}</span>
                  {st.msTotal > 0 && <span style={{ color: T.muted }}>marcos {st.msDone}/{st.msTotal}</span>}
                  {st.idle && <span style={{ color: "#f59e0b" }}>⚠ parado</span>}
                </div>
              )}
              <div style={{ fontFamily: F.ui, fontSize: 10, color: T.muted, marginTop: 2 }}>
                {!isFinal && <span style={{ color: RANK_COLOR[g.diff], fontWeight: 700 }}>[{g.diff}] </span>}
                +{val} XP · +{Math.round(val * COIN_RATE)} 🪙
                {` · ${isFinal ? "vencido" : "falha"}: −${Math.round(val * PENALTY_RATE)}`}
                {g.xp && <span style={{ color: T.gold }}> · custom</span>}
                {(g.attrs || []).length > 0 && <span style={{ color: color }}> · {goalTags(g)}</span>}
              </div>
            </div>
            {isFinal && (
              <button onClick={() => setOpenId(openId === g.id ? null : g.id)} aria-expanded={openId === g.id} aria-label={`Prazo e marcos: ${g.title}`}
                style={{ background: "none", border: `1px solid ${T.border}`, color: T.accentSoft, fontSize: 12, cursor: "pointer", padding: "5px 8px", whiteSpace: "nowrap" }}>
                {openId === g.id ? "▾" : "▸"} prazo
              </button>
            )}
            <button onClick={() => onRemove(g.id)} style={{ background: "none", border: "none", color: T.muted, fontSize: 16, cursor: "pointer", padding: 6 }}>✕</button>
          </div>
          {isFinal && openId === g.id && fx && <FinalDetail f={g} fx={fx} routeEnd={routeEnd} color={color} />}
          </React.Fragment>
        );
      })}

      <div style={{ display: "flex", gap: 8, marginTop: 14 }}>
        <input value={txt} onChange={(e) => setTxt(e.target.value)} onKeyDown={(e) => e.key === "Enter" && submit()} placeholder="Nova meta…" style={inputStyle} />
        {!isFinal && (
          <select value={diff} onChange={(e) => setDiff(e.target.value)}
            style={{ background: T.input, border: `1px solid ${T.border}`, color: RANK_COLOR[diff], fontWeight: 700, padding: "0 8px", fontFamily: F.ui }}>
            {DIFFS.map((d) => <option key={d} value={d}>{d}</option>)}
          </select>
        )}
        <input value={xpCustom} onChange={(e) => setXpCustom(e.target.value.replace(/\D/g, ""))} placeholder="XP" inputMode="numeric"
          style={{ ...inputStyle, flex: "0 0 auto", width: 64, textAlign: "center" }} />
        <button onClick={submit} style={{ ...btnPrimary, background: color, boxShadow: `0 0 12px ${glowColor}` }}>+</button>
      </div>
      {isFinal && (
        <div style={{ display: "flex", gap: 8, alignItems: "center", marginTop: 8 }}>
          <span style={{ fontSize: 12, color: T.muted }}>Prazo:</span>
          <input type="date" value={dueNew} min={todayK} onChange={(e) => setDueNew(e.target.value)} aria-label="Prazo do novo objetivo" style={{ ...inputStyle, flex: "0 0 auto", width: 160 }} />
          <span style={{ fontSize: 11, color: T.muted }}>vazio = fim da rota</span>
        </div>
      )}
      {!isFinal && openFinals.length > 0 && (
        <div style={{ display: "flex", gap: 8, alignItems: "center", marginTop: 8 }}>
          <span style={{ fontSize: 12, color: T.muted }}>Serve a:</span>
          <select value={goalId} onChange={(e) => setGoalId(e.target.value)} aria-label="Objetivo que esta meta serve"
            style={{ ...inputStyle, color: goalId ? CAT.final.color : T.muted }}>
            <option value="">— nenhum objetivo —</option>
            {openFinals.map((f) => <option key={f.id} value={f.id}>{f.title}</option>)}
          </select>
        </div>
      )}
      <div style={{ fontSize: 10, color: T.muted, marginTop: 6, fontFamily: F.ui }}>
        Campo XP vazio = usa a dificuldade ({isFinal ? "2000 padrão" : "E 25 · D 50 · C 100 · B 200 · A 400 · S 800"})
      </div>
      <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginTop: 10 }}>
        <div style={{ flexBasis: "100%" }}><SubPicker pairs={pairs} onChange={setPairs} compact /></div>
        <span style={{ fontSize: 10, color: T.muted, alignSelf: "center" }}>↑ treina até 2 sub-galhos</span>
      </div>
    </Section>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
