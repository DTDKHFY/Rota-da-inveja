        <div role="group" aria-label="Resultado da operação" style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 6, marginTop: 8 }}>
          <button aria-pressed={sign === 1} onClick={() => setSign(1)} style={seg(sign === 1, T.good)}>Ganho</button>
          <button aria-pressed={sign === -1} onClick={() => setSign(-1)} style={seg(sign === -1, T.danger)}>Perda</button>
        </div>
      )}
      <label style={lbl}>{isOp ? `Resultado líquido (${t.moeda === "BRL" ? "R$" : "US$"})` : `${isSaldo ? "Saldo" : "Valor"} (${t.moeda === "BRL" ? "R$" : "US$"})`}
        <input value={val} onChange={(e) => { setVal(e.target.value); setErr(""); }} inputMode="decimal" placeholder="0,00" style={{ ...inputStyle, width: "100%", marginTop: 4, ...cxMono, fontSize: 18 }} />
      </label>
      <label style={lbl}>Data
        <input type="date" value={date} max={today} onChange={(e) => setDate(e.target.value)} style={{ ...inputStyle, width: "100%", marginTop: 4 }} />
      </label>
      {isOp && (<>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
          <label style={lbl}>Ativo
            <input value={ativo} onChange={(e) => setAtivo(e.target.value)} placeholder="EURUSD" autoCapitalize="characters" style={{ ...inputStyle, width: "100%", marginTop: 4 }} />
          </label>
          <label style={lbl}>R (opcional)
            <input value={r} onChange={(e) => setR(e.target.value)} inputMode="decimal" placeholder="1,5" style={{ ...inputStyle, width: "100%", marginTop: 4 }} />
          </label>
        </div>
        <label style={lbl}>Setup (opcional)
          <input value={setup} onChange={(e) => setSetup(e.target.value)} list="td-setups" placeholder="rompimento, pullback…" style={{ ...inputStyle, width: "100%", marginTop: 4 }} />
          <datalist id="td-setups">{setups.map((x) => <option key={x} value={x} />)}</datalist>
        </label>
        <div style={lbl}>Seguiu as regras do plano?</div>
        <div role="group" aria-label="Seguiu as regras" style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 6, marginTop: 4 }}>
          <button aria-pressed={regras === true} onClick={() => { setRegras(true); setErr(""); }} style={seg(regras === true, T.good)}>Sim</button>
          <button aria-pressed={regras === false} onClick={() => { setRegras(false); setErr(""); }} style={seg(regras === false, T.gold)}>Não</button>
        </div>
      </>)}
      {!isSaldo && (
        <label style={lbl}>Observação (opcional)
          <input value={obs} onChange={(e) => setObs(e.target.value)} placeholder={isOp ? "o que aconteceu, o que repetir ou evitar" : ""} style={{ ...inputStyle, width: "100%", marginTop: 4 }} />
        </label>
      )}
      {err && <div role="alert" style={{ color: T.danger, fontSize: 13.5, marginTop: 8 }}>{err}</div>}
      <button onClick={save} style={{ ...btnPrimary, width: "100%", minHeight: 46, marginTop: 12 }}>Salvar</button>
    </div>
  );
}

function TdSettings({ t, trd }) {
  const [v, setV] = useState({ meta: String(t.meta), stopsDia: String(t.stopsDia), perdaMes: String(t.perdaMes) });
  const [ok, setOk] = useState("");
  const lbl = { display: "block", fontSize: 12.5, color: T.muted, marginTop: 9 };
  const save = () => {
    const meta = parseMoney(v.meta), sd = Math.round(parseMoney(v.stopsDia)), pm = parseMoney(v.perdaMes);
    if (!(meta > 0) || !(sd >= 1 && sd <= 10) || !(pm > 0 && pm <= 50)) { setOk("Confira os valores: meta > 0, stops de 1 a 10, perda de 0 a 50%."); return; }
    trd.set({ meta: round2(meta), stopsDia: sd, perdaMes: round2(pm) });
    setOk("Salvo.");
  };
  const segB = (on) => ({ flex: 1, minHeight: 42, border: `1px solid ${on ? T.accent : T.border}`, background: on ? `${T.accent}22` : "none", color: on ? T.accent : T.muted, fontWeight: 700, cursor: "pointer", fontFamily: F.ui, fontSize: 14 });
  return (
    <div style={{ padding: "4px 2px 6px" }}>
      <div style={lbl}>Moeda da conta</div>
      <div role="group" aria-label="Moeda" style={{ display: "flex", gap: 6, marginTop: 4 }}>
        <button aria-pressed={t.moeda !== "BRL"} onClick={() => trd.set({ moeda: "USD" })} style={segB(t.moeda !== "BRL")}>US$</button>
        <button aria-pressed={t.moeda === "BRL"} onClick={() => trd.set({ moeda: "BRL" })} style={segB(t.moeda === "BRL")}>R$</button>
      </div>
      <label style={lbl}>Meta de lucro líquido
        <input value={v.meta} onChange={(e) => setV({ ...v, meta: e.target.value })} inputMode="decimal" style={{ ...inputStyle, width: "100%", marginTop: 4 }} />
      </label>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
        <label style={lbl}>Stops por dia (encerra)
          <input value={v.stopsDia} onChange={(e) => setV({ ...v, stopsDia: e.target.value })} inputMode="numeric" style={{ ...inputStyle, width: "100%", marginTop: 4 }} />
        </label>
        <label style={lbl}>Perda máx. no mês (%)
          <input value={v.perdaMes} onChange={(e) => setV({ ...v, perdaMes: e.target.value })} inputMode="decimal" style={{ ...inputStyle, width: "100%", marginTop: 4 }} />
        </label>
      </div>
      <button onClick={save} style={{ ...btnPrimary, width: "100%", minHeight: 44, marginTop: 12 }}>Salvar ajustes</button>
      {ok && <div role="status" style={{ fontSize: 13.5, marginTop: 6, color: ok === "Salvo." ? T.good : T.danger }}>{ok}</div>}
    </div>
  );
}

function TradingTab({ trading, trd, today }) {
  const t = normTrading(trading);
  const m = tradeModel(t, today);
  const [form, setForm] = useState(null);
  const [del, setDel] = useState(null);
  const M = (v) => tdMoney(v, t.moeda);
  const S = (v) => tdSigned(v, t.moeda);
  const col = (v) => (v > 0.004 ? T.good : v < -0.004 ? T.danger : T.text);
  const pctMeta = t.meta > 0 ? Math.max(0, Math.min(100, (m.lucro / t.meta) * 100)) : 0;
  const alerts = [];
  if (m.stopsHoje >= t.stopsDia) alerts.push({ red: true, text: `Contrato de Ulisses: ${m.stopsHoje} stop${m.stopsHoje > 1 ? "s" : ""} hoje. O dia acabou. Feche a plataforma.` });
  else if (t.stopsDia > 1 && m.stopsHoje === t.stopsDia - 1) alerts.push({ red: false, text: `${m.stopsHoje} stop hoje. Mais um e o dia acaba.` });
  if (m.perdaMesPct >= t.perdaMes) alerts.push({ red: true, text: `Perda de ${tdFix(m.perdaMesPct, 1)}% no mês (limite ${t.perdaMes}%). Só simulador até o dia 1.` });
  if (m.regN >= 5 && m.reg / m.regN < 0.8) alerts.push({ red: false, text: `Só ${Math.round((m.reg / m.regN) * 100)}% das operações seguiram as regras. O problema não é o mercado.` });
  const rec = !m.saldo ? { c: T.muted, text: "Informe o saldo da corretora (sem posição aberta) para conferir o lucro real. Até lá, a meta usa o lucro das operações." }
    : Math.abs(m.gap) < 0.01 ? { c: T.good, text: `Conta e diário batem no saldo de ${fmtDM(m.saldo.date)}.` }
    : m.gap < 0 ? { c: T.danger, text: `Faltam ${M(-m.gap)} no diário: taxa, swap, comissão ou operação não lançada. Lance como custo ou operação.` }
    : { c: T.gold, text: `Sobram ${M(m.gap)} na conta: ganho, depósito ou reembolso não lançado.` };
  const add = (kind, item, patch) => { trd.add(kind, item, patch); };
  const hist = [
    ...t.ops.map((o) => ({ k: "ops", o })), ...t.movs.map((o) => ({ k: "movs", o })), ...t.saldos.map((o) => ({ k: "saldos", o })),
  ].filter((x) => x.o && x.o.date).sort((a, b) => -tdCmp(a.o, b.o)).slice(0, 80);
  const rowS = { display: "flex", alignItems: "center", gap: 8, padding: "8px 0", borderTop: `1px solid ${T.border}55`, fontSize: 14 };
  const smallBtn = { flex: 1, minHeight: 44, background: T.panel, border: `1px solid ${T.border}`, color: T.accentSoft, fontFamily: F.ui, fontSize: 13.5, fontWeight: 700, cursor: "pointer", padding: "0 4px" };
  const line = (k, v, c) => (
    <div style={{ display: "flex", justifyContent: "space-between", gap: 8, padding: "6px 0", borderTop: `1px solid ${T.border}55`, fontSize: 14 }}>
      <span style={{ color: T.muted }}>{k}</span><span style={{ ...cxMono, color: c || T.text, fontWeight: 700, textAlign: "right" }}>{v}</span>
    </div>
  );
  return (
    <>
      <section data-pn="" className="cx-rise" style={{ border: `1px solid ${T.border}`, background: T.panel, padding: "16px 14px 14px", textAlign: "center" }}>
        <div style={{ ...cxLbl, letterSpacing: "0.26em" }}>Lucro real · {m.saldo ? "pela conta" : "pelas operações"}</div>
        <div style={{ ...cxMono, fontSize: 36, fontWeight: 700, lineHeight: 1.1, marginTop: 6, color: col(m.lucro) }}>{S(m.lucro)}</div>
        <div style={{ fontSize: 13.5, color: T.muted, margin: "6px 0 8px" }}>meta {M(t.meta)} · <b style={{ color: T.gold }}>{Math.round(pctMeta)}%</b>{m.lucro < t.meta ? ` · faltam ${M(t.meta - Math.max(0, m.lucro))}` : " · meta batida"}</div>
        <CxBar pct={pctMeta} color={T.gold} h={8} />
      </section>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginTop: 8 }}>
        <CxTile label="Pela conta" value={m.saldo ? S(m.lucroConta) : "—"} sub={m.saldo ? `saldo + saques − depósitos · ${fmtDM(m.saldo.date)}` : "falta o saldo"} color={m.saldo ? col(m.lucroConta) : T.muted} small />
        <CxTile label="Pelas operações" value={S(m.lucroOps)} sub={`${m.n} op. − custos lançados`} color={col(m.lucroOps)} small />
      </div>
      <div data-pn="" role="status" style={{ marginTop: 8, padding: "10px 12px", border: `1px solid ${rec.c}66`, background: T.panel, fontSize: 14, lineHeight: 1.45 }}>
        {m.saldo && Math.abs(m.gap) >= 0.01 && <div style={{ ...cxMono, fontWeight: 700, color: rec.c, marginBottom: 2 }}>Diferença não explicada: {S(m.gap)}</div>}
        <span style={{ color: m.saldo ? T.text : T.muted }}>{rec.text}</span>
        {m.saldo && m.tarde > 0 && Math.abs(m.gap) >= 0.01 && <div style={{ fontSize: 13, color: T.muted, marginTop: 4 }}>Operou depois de informar o saldo de {fmtDM(m.saldo.date)}? Informe o saldo de novo: o saldo vale como fechamento do dia.</div>}
        {m.saldo && m.depois > 0 && <div style={{ fontSize: 13, color: T.muted, marginTop: 4 }}>{m.depois} lançamento(s) depois desse saldo entram no lucro, mas só são conferidos no próximo saldo.</div>}
      </div>

      {alerts.map((a, i) => (
        <div key={i} data-pn="" role="alert" className="cx-rise" style={{ marginTop: 8, padding: "10px 12px", border: `1px solid ${a.red ? T.danger : T.gold}aa`, background: a.red ? "rgba(255,83,104,.09)" : "rgba(255,201,92,.07)", fontSize: 14.5, lineHeight: 1.4, fontWeight: a.red ? 700 : 500 }}>
          {a.text}
        </div>
      ))}

      <button onClick={() => setForm(form === "op" ? null : "op")} style={{ ...btnPrimary, width: "100%", minHeight: 48, marginTop: 12, fontSize: 15 }}>+ Operação</button>
      <div style={{ display: "flex", gap: 6, marginTop: 6 }}>
        <button onClick={() => setForm("dep")} style={smallBtn}>Depósito</button>
        <button onClick={() => setForm("saq")} style={smallBtn}>Saque</button>
        <button onClick={() => setForm("custo")} style={smallBtn}>Custo</button>
        <button onClick={() => setForm("saldo")} style={{ ...smallBtn, color: T.gold, borderColor: `${T.gold}88` }}>Saldo</button>
      </div>
      {form && <TdForm key={form} kind={form} t={t} today={today} onSave={add} onClose={() => setForm(null)} />}

      <Section title="Desempenho">
        {m.n === 0 ? (
          <div style={{ fontSize: 14, color: T.muted, lineHeight: 1.45 }}>Nenhuma operação lançada. Lance cada operação real com o resultado líquido: acerto, payoff e expectativa só aparecem com dados.</div>
        ) : (<>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
            <CxTile label="Acerto" value={`${Math.round(m.acerto * 100)}%`} sub={`${m.wins} de ${m.n} no lucro`} color={T.text} small />
            <CxTile label="Payoff" value={tdFix(m.payoff)} sub="ganho médio ÷ perda média" color={m.payoff != null && m.payoff >= 1 ? T.good : T.text} small />
            <CxTile label="Expectativa" value={S(m.expect)} sub="por operação" color={col(m.expect)} small />
            <CxTile label="Fator de lucro" value={m.pf === Infinity ? "∞" : tdFix(m.pf)} sub="ganhos ÷ perdas" color={m.pf != null && m.pf >= 1 ? T.good : T.danger} small />
            <CxTile label="Rebaixamento" value={m.dd > 0 ? `−${M(m.dd)}` : M(0)} sub="maior queda do pico" color={m.dd > 0 ? T.danger : T.text} small />
            <CxTile label="Regras" value={m.regN ? `${Math.round((m.reg / m.regN) * 100)}%` : "—"} sub={`${m.reg} de ${m.regN} no plano`} color={m.regN && m.reg / m.regN >= 0.8 ? T.good : T.gold} small />
            <CxTile label="Semana" value={String(m.opsSem)} sub="operações nesta semana" color={T.text} small />
            <CxTile label="Mês" value={S(m.resMes)} sub={`${m.opsMes} operação(ões)`} color={col(m.resMes)} small />
            {m.rMed != null && <CxTile label="R médio" value={tdFix(m.rMed)} sub={`soma ${tdFix(m.rSum, 1)}R`} color={col(m.rMed)} small />}
          </div>
          {m.curve.length >= 3 && (
            <div data-pn="" style={{ marginTop: 8, border: `1px solid ${T.border}`, background: T.panel, padding: "10px 10px 8px" }}>
              <div style={{ ...cxLbl, marginBottom: 6 }}>Curva · resultado acumulado</div>
              <TdCurve curve={m.curve} color={m.curve[m.curve.length - 1] >= 0 ? T.good : T.danger} />
            </div>
          )}
        </>)}
      </Section>

      <Section title="Capital">
        {line("Depósitos", M(m.dep))}
        {line("Saques", M(m.saq))}
        {line("Custos lançados", M(m.custos), m.custos > 0 ? T.danger : null)}
        {line("Último saldo informado", m.saldo ? `${M(m.saldo.valor)} · ${fmtDM(m.saldo.date)}` : "—", T.gold)}
        {line("Saldo estimado hoje", M(m.saldoAgora))}
        <div style={{ fontSize: 12.5, color: T.muted, lineHeight: 1.45, marginTop: 8 }}>
          Lucro real = saldo + saques − depósitos. Taxas e swap já estão no saldo; lançá-los como custo só serve para o diário bater. Conta em dólar: a conversão para reais muda com o câmbio e o IOF.
        </div>
      </Section>

      <CxFold id="td-hist" title={`Histórico · ${hist.length} lançamento(s)`}>
        <div data-pn="" style={{ border: `1px solid ${T.border}`, borderTop: "none", background: T.panel, padding: "2px 12px 8px" }}>
          {!hist.length && <div style={{ fontSize: 14, color: T.muted, padding: "10px 0" }}>Nada lançado ainda.</div>}
          {hist.map(({ k, o }) => {
            const key = `${k}:${o.id}`;
            const isOp = k === "ops", isSaldo = k === "saldos";
            const v = isOp ? Number(o.res) || 0 : Number(o.valor) || 0;
            const title = isOp ? `Operação${o.ativo ? ` · ${o.ativo}` : ""}` : isSaldo ? "Saldo informado" : (TD_MOV[o.tipo] || { name: o.tipo }).name;
            const sub = isOp ? [o.setup, o.r != null ? `${tdFix(Number(o.r), 1)}R` : null, o.regras === false ? "fora das regras" : null, o.obs].filter(Boolean).join(" · ") : o.obs || "";
            const shown = isOp ? S(v) : isSaldo ? M(v) : o.tipo === "dep" ? `+${M(v)}` : `−${M(v)}`;
            const c = isOp ? col(v) : isSaldo ? T.gold : o.tipo === "dep" ? T.text : T.danger;
            return (
              <div key={key} style={rowS}>
                <span style={{ ...cxMono, flex: "0 0 42px", fontSize: 12.5, color: T.muted }}>{fmtDM(o.date)}</span>
                <span style={{ flex: 1, minWidth: 0 }}>
                  <span style={{ display: "block", fontWeight: 600 }}>{title}</span>
                  {sub && <span style={{ display: "block", fontSize: 12.5, color: o.regras === false ? T.gold : T.muted, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{sub}</span>}
                </span>
                <span style={{ ...cxMono, fontWeight: 700, color: c, whiteSpace: "nowrap" }}>{shown}</span>
                {del === key ? (
                  <button onClick={() => { trd.remove(k, o.id); setDel(null); }} style={{ minHeight: 36, background: "none", border: `1px solid ${T.danger}`, color: T.danger, fontFamily: F.ui, fontSize: 12.5, fontWeight: 700, cursor: "pointer", padding: "0 8px" }}>Apagar</button>
                ) : (
                  <button onClick={() => setDel(key)} aria-label={`Apagar ${title} de ${fmtDM(o.date)}`} style={{ minWidth: 36, minHeight: 36, background: "none", border: "none", color: T.muted, fontSize: 17, cursor: "pointer" }}>×</button>
                )}
              </div>
            );
          })}
        </div>
      </CxFold>

      <CxFold id="td-cfg" title="Ajustes do trading">
        <div data-pn="" style={{ border: `1px solid ${T.border}`, borderTop: "none", background: T.panel, padding: "4px 12px 12px" }}>
          <TdSettings t={t} trd={trd} />
        </div>
      </CxFold>

      <p style={{ fontSize: 12, color: T.muted, marginTop: 18, lineHeight: 1.5 }}>
        Trading fica separado das moedas do Sistema e não gera XP. Sincroniza com o resto e entra no backup. Não é recomendação de investimento.
      </p>
    </>
  );
}

function FinanceTab({ finance, fin, trading, trd }) {
  const today = dayKey(new Date());
  const [view, setViewRaw] = useState(() => { try { return localStorage.getItem("rb.cx.view") === "trading" ? "trading" : "caixa"; } catch (e) { return "caixa"; } });
  const setView = (v) => { setViewRaw(v); try { localStorage.setItem("rb.cx.view", v); } catch (e) { /* sem armazenamento */ } };
  const [period, setPeriod] = useState({ unit: "mes", anchor: today });
  const [kind, setKind] = useState("out");
  const [sel, setSel] = useState("total");
  const [sheet, setSheet] = useState(false);
  /* a janela de lançamento fecha com o Voltar do celular e com Esc */
  useEffect(() => {
    if (!sheet) return;
    let popped = false;
    try { window.history.pushState({ rbSheet: 1 }, ""); } catch (e) { /* sem histórico */ }
    const onPop = () => { popped = true; setSheet(false); };
    const onKey = (e) => { if (e.key === "Escape") setSheet(false); };
    window.addEventListener("popstate", onPop);
    window.addEventListener("keydown", onKey);
    return () => {
      window.removeEventListener("popstate", onPop);
      window.removeEventListener("keydown", onKey);
      if (!popped) { try { if (window.history.state && window.history.state.rbSheet) window.history.back(); } catch (e) { /* ignora */ } }
    };
  }, [sheet]);
  const viewMonth = period.anchor.slice(0, 7);
  const isCurrent = viewMonth === today.slice(0, 7);
  const plan = monthPlan(finance, viewMonth, today);
  const m = financeMetrics(finance, viewMonth);

  return (
    <>
      <CxSwitch view={view} setView={setView} />
      {view === "trading" ? <TradingTab trading={trading} trd={trd} today={today} /> : (<>
      <CaixaCommand finance={finance} fin={fin} today={today} />
      <CxFold id="arquivo" title="Arquivo · contas, cartões, histórico">
      {isCurrent && <CardHero finance={finance} today={today} />}
      <CaixaHome finance={finance} today={today} period={period} setPeriod={setPeriod} kind={kind} setKind={setKind} sel={sel} setSel={setSel} />
      <FreeToSpend plan={plan} finance={finance} isCurrent={isCurrent} />
      <OwePanel finance={finance} today={today} fin={fin} />
      <AccountsPanel finance={finance} today={today} fin={fin} />
      <CardsPanel finance={finance} today={today} fin={fin} />
      <FinanceMetrics m={m} />
      <LogDays finance={finance} viewMonth={viewMonth} today={today} fin={fin} />
      <RecurringPanel finance={finance} viewMonth={viewMonth} today={today} fin={fin} />
      <ReservePanel finance={finance} m={m} fin={fin} today={today} />
      <PlanPanel plan={finance.plan} fin={fin} />
      <CategoryManager finance={finance} fin={fin} />
      <EntryList finance={finance} period={period} fin={fin} />
      </CxFold>

      <p style={{ fontSize: 12, color: T.muted, marginTop: 18, lineHeight: 1.5 }}>
        Dinheiro real fica separado das moedas do Sistema e não gera XP. O backup no Perfil inclui o Caixa.
      </p>

      <button aria-label="Novo lançamento" onClick={() => setSheet(true)}
        style={{ position: "fixed", right: "max(16px, env(safe-area-inset-right, 0px))", bottom: "calc(72px + env(safe-area-inset-bottom, 0px))", width: 58, height: 58, borderRadius: T.sys ? 0 : "50%", border: T.sys ? `1px solid ${T.accent}` : "none", background: T.sys ? "rgba(16,56,100,.94)" : T.accent, color: T.sys ? T.accent : "#fff", fontSize: 32, lineHeight: 1, cursor: "pointer", boxShadow: T.sys ? `0 0 24px ${T.accent}66` : `0 6px 22px ${T.mist1}, 0 0 0 1px ${T.border}`, zIndex: 45 }}>
        +
      </button>
      {sheet && (
        <div role="dialog" aria-modal="true" aria-label="Novo lançamento" onClick={() => setSheet(false)}
          style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.6)", zIndex: 70, display: "flex", alignItems: "flex-end", justifyContent: "center" }}>
          <div onClick={(e) => e.stopPropagation()}
            style={{ width: "100%", maxWidth: 560, maxHeight: "88vh", overflowY: "auto", background: T.bg, borderTop: `1px solid ${T.accent}`, padding: "6px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))" }}>
            <div style={{ display: "flex", justifyContent: "flex-end" }}>
              <button onClick={() => setSheet(false)} style={{ background: "none", border: "none", color: T.muted, fontFamily: F.ui, fontSize: 15, padding: "8px 4px", cursor: "pointer" }}>Fechar</button>
            </div>
            <QuickEntry finance={finance} today={today} fin={fin} />
          </div>
        </div>
      )}
      </>)}
    </>
  );
}

/* ----- topo do Caixa: saldo, despesas/renda, período, rosca ----- */
const CHART_COLORS = ["#ef4444", "#f59e0b", "#38bdf8", "#a78bfa", "#34d399", "#f472b6", "#facc15", "#60a5fa", "#fb923c", "#2dd4bf", "#c084fc", "#94a3b8"];

function CaixaHome({ finance, today, period, setPeriod, kind, setKind, sel, setSel }) {
  const [picking, setPicking] = useState(false);
  const accounts = liveAccounts(finance);
  const cards = finance.cards || [];
  const card = cards.find((c) => c.id === sel);
  const account = accounts.find((a) => a.id === sel);
  const selName = card ? card.name : account ? account.name : "Total";
  const selIcon = card ? "💳" : account ? (ACCOUNT_KINDS[account.kind] || {}).icon : "💰";
  const balance = card ? -cardSummary(finance, card, today).used : account ? accountBalance(finance, account.id) : totalBalance(finance);

  const range = periodRange(period.unit, period.anchor);
  const inRange = (e) => e.date >= range.start && e.date <= range.end;
  const matchSel = (e) => (card ? e.cardId === card.id : account ? e.accountId === account.id : true);
  const list = finance.entries.filter((e) => inRange(e) && matchSel(e) && (kind === "out" ? isSpend(e) : e.type === "in"));
  const total = round2(list.reduce((a, e) => a + e.amount, 0));
  const byCat = {};
  list.forEach((e) => { byCat[e.cat] = round2((byCat[e.cat] || 0) + e.amount); });
  const rows = Object.entries(byCat).sort((a, b) => b[1] - a[1]).map(([c, v], i) => ({ cat: c, value: v, color: CHART_COLORS[i % CHART_COLORS.length] }));
  const unitWord = { dia: "neste dia", semana: "nesta semana", mes: "neste mês", ano: "neste ano" }[period.unit];

  return (
    <div data-pn="" style={{ position: "relative", border: `1px solid ${T.border}`, background: T.panel, padding: "14px 14px 16px" }}>
      <Corner pos="tl" /><Corner pos="tr" /><Corner pos="bl" /><Corner pos="br" />
      <div style={{ textAlign: "center" }}>
        <button onClick={() => setPicking(!picking)} aria-expanded={picking}
          style={{ background: "none", border: "none", color: T.text, fontFamily: F.ui, fontSize: 18, fontWeight: 600, cursor: "pointer", padding: "4px 8px" }}>
          {selIcon} {selName} {picking ? "▴" : "▾"}
        </button>
        <div style={{ fontFamily: F.display, fontSize: 44, lineHeight: 1.05, color: balance < 0 ? T.danger : T.text, fontVariantNumeric: "tabular-nums" }}>{brl(balance)}</div>
        {card && <div style={{ fontSize: 12, color: T.muted }}>em aberto no cartão</div>}
        {!card && !account && <div style={{ fontSize: 12, color: T.muted }}>soma das contas marcadas para entrar no total</div>}
      </div>

      {picking && (
        <div style={{ marginTop: 10, border: `1px solid ${T.border}`, background: T.bg }}>
          {[{ id: "total", name: "Total", icon: "💰", value: totalBalance(finance) },
            ...accounts.map((a) => ({ id: a.id, name: a.name, icon: (ACCOUNT_KINDS[a.kind] || {}).icon, value: accountBalance(finance, a.id), note: a.inTotal ? "" : "fora do total" })),
            ...cards.map((c) => ({ id: c.id, name: c.name, icon: "💳", value: -cardSummary(finance, c, today).used, note: "cartão" })),
          ].map((o) => (
            <button key={o.id} onClick={() => { setSel(o.id); setPicking(false); }} aria-pressed={sel === o.id}
              style={{ width: "100%", display: "flex", alignItems: "center", gap: 10, padding: "10px 12px", background: sel === o.id ? T.panel2 : "transparent", border: "none", borderBottom: `1px solid ${T.border}55`, color: T.text, cursor: "pointer", textAlign: "left", fontFamily: F.ui }}>
              <span style={{ fontSize: 20, width: 26, textAlign: "center" }} aria-hidden="true">{o.icon}</span>
              <span style={{ flex: 1, minWidth: 0 }}>
                <span style={{ display: "block", fontSize: 15 }}>{o.name}</span>
                {o.note && <span style={{ display: "block", fontSize: 11.5, color: T.muted }}>{o.note}</span>}
              </span>
              <span style={{ fontSize: 15, fontWeight: 600, color: o.value < 0 ? T.danger : T.text, fontVariantNumeric: "tabular-nums" }}>{brl(o.value)}</span>
            </button>
          ))}
        </div>
      )}

      <div style={{ display: "flex", marginTop: 14, borderBottom: `1px solid ${T.border}` }}>
        {[["out", "Despesas"], ["in", "Renda"]].map(([k, label]) => (
          <button key={k} onClick={() => setKind(k)} aria-pressed={kind === k}
            style={{ flex: 1, padding: "10px 0", background: "none", border: "none", borderBottom: `2px solid ${kind === k ? T.accent : "transparent"}`, color: kind === k ? T.text : T.muted, fontFamily: F.ui, fontSize: 16, fontWeight: 700, cursor: "pointer" }}>{label}</button>
        ))}
      </div>
      <div style={{ display: "flex", justifyContent: "space-between", marginTop: 10, gap: 4 }}>
        {PERIOD_UNITS.map(([u, label]) => (
          <button key={u} onClick={() => setPeriod({ unit: u, anchor: today })} aria-pressed={period.unit === u}
            style={{ flex: 1, padding: "7px 0", background: period.unit === u ? T.panel2 : "transparent", border: `1px solid ${period.unit === u ? T.accent : "transparent"}`, color: period.unit === u ? T.accentSoft : T.muted, fontFamily: F.ui, fontSize: 14, fontWeight: 600, cursor: "pointer" }}>{label}</button>
        ))}
      </div>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginTop: 10 }}>
        <button aria-label="Período anterior" onClick={() => setPeriod({ ...period, anchor: shiftPeriod(period.unit, period.anchor, -1) })} style={navBtn}>‹</button>
        <span style={{ fontSize: 15, color: T.text }}>{range.label}</span>
        <button aria-label="Próximo período" onClick={() => setPeriod({ ...period, anchor: shiftPeriod(period.unit, period.anchor, 1) })} style={navBtn}>›</button>
      </div>

      <Donut rows={rows} total={total} empty={`Não houve ${kind === "out" ? "despesa" : "renda"} ${unitWord}`} />

      {rows.length > 0 && (
        <div style={{ marginTop: 6 }}>
          {rows.map((r) => (
            <div key={r.cat} style={{ display: "flex", alignItems: "center", gap: 10, padding: "8px 0", borderBottom: `1px solid ${T.border}55` }}>
              <span style={{ width: 10, height: 10, background: r.color, flex: "0 0 auto" }} />
              <span style={{ fontSize: 18 }} aria-hidden="true">{CAT_ICON[r.cat] || "•"}</span>
              <span style={{ flex: 1, minWidth: 0, fontSize: 15, color: T.text }}>{r.cat}</span>
              <span style={{ fontSize: 13, color: T.muted, minWidth: 38, textAlign: "right" }}>{Math.round((r.value / total) * 100)}%</span>
              <span style={{ fontSize: 15, fontWeight: 600, color: T.text, fontVariantNumeric: "tabular-nums" }}>{brl(r.value)}</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function Donut({ rows, total, empty }) {
  const size = 220, r = 82, sw = 32, c = 2 * Math.PI * r;
  let acc = 0;
  return (
    <div style={{ display: "flex", justifyContent: "center", margin: "16px 0 6px" }}>
      <svg viewBox={`0 0 ${size} ${size}`} style={{ width: "100%", maxWidth: 240, height: "auto", display: "block" }} role="img" aria-label={total ? `Total ${brl(total)}` : empty}>
        <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke={T.track} strokeWidth={sw} />
        {total > 0 && rows.map((row) => {
          const len = (row.value / total) * c;
          const el = (
            <circle key={row.cat} cx={size / 2} cy={size / 2} r={r} fill="none" stroke={row.color} strokeWidth={sw}
              strokeDasharray={`${Math.max(0, len - (rows.length > 1 ? 2 : 0))} ${c}`} strokeDashoffset={-acc}
              transform={`rotate(-90 ${size / 2} ${size / 2})`} />
          );
          acc += len;
          return el;
        })}
        {total > 0 ? (
          <>
            <text x={size / 2} y={size / 2 - 4} textAnchor="middle" fill={T.muted} fontSize="13" fontFamily={F.ui}>total</text>
            <text x={size / 2} y={size / 2 + 22} textAnchor="middle" fill={T.text} fontSize="24" fontFamily={F.display}>{brl(total)}</text>
          </>
        ) : (
          <foreignObject x={size / 2 - 60} y={size / 2 - 40} width="120" height="80">
            <div style={{ height: "100%", display: "flex", alignItems: "center", justifyContent: "center", textAlign: "center", fontFamily: F.ui, fontSize: 14, color: T.muted, lineHeight: 1.25 }}>{empty}</div>
          </foreignObject>
        )}
      </svg>
    </div>
  );
}

/* ----- contas ----- */
function AccountsPanel({ finance, today, fin }) {
  const accounts = liveAccounts(finance);
  const [edit, setEdit] = useState(null);
  const [ev, setEv] = useState({ name: "", balance: "", inTotal: true });
  const [adding, setAdding] = useState(false);
  const [nf, setNf] = useState({ name: "", kind: "banco", balance: "" });
  const [tr, setTr] = useState({ open: false, from: "", to: "", amount: "" });
  const [msg, setMsg] = useState("");
  const [armed, setArmed] = useState(null);

  const startEdit = (a) => { setEdit(a.id); setEv({ name: a.name, balance: String(accountBalance(finance, a.id)).replace(".", ","), inTotal: !!a.inTotal }); setArmed(null); };
  const saveEdit = (a) => {
    const v = parseMoney(ev.balance);
    if (!ev.name.trim()) { setMsg("A conta precisa de um nome."); return; }
    fin.updateAccount(a.id, { name: ev.name.trim(), inTotal: ev.inTotal });
    if (isFinite(v)) fin.adjustBalance(a.id, v);
    setEdit(null); setMsg(`${ev.name.trim()} atualizada.`);
  };
  const addAccount = () => {
    const v = nf.balance.trim() ? parseMoney(nf.balance) : 0;
    if (!nf.name.trim() || !isFinite(v)) { setMsg("Dê um nome e um saldo válido."); return; }
    fin.addAccount({ name: nf.name.trim(), kind: nf.kind, initial: v, inTotal: nf.kind !== "beneficio" && nf.kind !== "caixinha" });
    setNf({ name: "", kind: "banco", balance: "" }); setAdding(false); setMsg("Conta criada.");
  };
  const doTransfer = () => {
    const v = parseMoney(tr.amount);
    if (!tr.from || !tr.to || tr.from === tr.to) { setMsg("Escolha duas contas diferentes."); return; }
    if (!(v > 0)) { setMsg("Digite um valor maior que zero."); return; }
    fin.transfer(tr.from, tr.to, v, today);
    setTr({ open: false, from: "", to: "", amount: "" });
    setMsg(`${brl(v)} transferido de ${accountName(finance, tr.from)} para ${accountName(finance, tr.to)}.`);
  };

  return (
    <Section title="Contas">
      <div style={{ fontSize: 13, color: T.muted, lineHeight: 1.5, marginBottom: 6 }}>Toque numa conta para ajustar o saldo ao valor real do banco.</div>
      {accounts.map((a) => {
        const bal = accountBalance(finance, a.id);
        return (
          <div key={a.id} style={{ borderBottom: `1px solid ${T.border}55` }}>
            <button onClick={() => (edit === a.id ? setEdit(null) : startEdit(a))} aria-expanded={edit === a.id}
              style={{ width: "100%", display: "flex", alignItems: "center", gap: 10, padding: "10px 0", background: "none", border: "none", color: T.text, cursor: "pointer", textAlign: "left", fontFamily: F.ui }}>
              <span style={{ fontSize: 20, width: 26, textAlign: "center" }} aria-hidden="true">{(ACCOUNT_KINDS[a.kind] || {}).icon}</span>
              <span style={{ flex: 1, minWidth: 0 }}>
                <span style={{ display: "block", fontSize: 15 }}>{a.name}</span>
                <span style={{ display: "block", fontSize: 11.5, color: T.muted }}>{(ACCOUNT_KINDS[a.kind] || {}).label}{a.inTotal ? "" : " · fora do total"}</span>
              </span>
              <span style={{ fontSize: 16, fontWeight: 700, color: bal < 0 ? T.danger : T.text, fontVariantNumeric: "tabular-nums" }}>{brl(bal)}</span>
            </button>
            {edit === a.id && (
              <div style={{ display: "flex", flexDirection: "column", gap: 8, padding: "4px 0 12px" }}>
                <input id={`acc-name-${a.id}`} value={ev.name} onChange={(e) => setEv({ ...ev, name: e.target.value })} placeholder="Nome" style={inputStyle} />
                <label htmlFor={`acc-bal-${a.id}`} style={{ fontSize: 13, color: T.muted }}>Saldo real agora</label>
                <input id={`acc-bal-${a.id}`} value={ev.balance} onChange={(e) => setEv({ ...ev, balance: e.target.value })} inputMode="decimal" style={inputStyle} />
                <label style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 14, color: T.text }}>
                  <input type="checkbox" checked={ev.inTotal} onChange={(e) => setEv({ ...ev, inTotal: e.target.checked })} style={{ width: 20, height: 20 }} />
                  Entra no total
                </label>
                <div style={{ display: "flex", gap: 8 }}>
                  <button onClick={() => saveEdit(a)} style={{ ...btnPrimary, flex: 1 }}>Salvar</button>
                  {armed === a.id ? (
                    <button onClick={() => { fin.hideAccount(a.id); setEdit(null); setArmed(null); }} style={btnDanger}>remover</button>
                  ) : (
                    <button onClick={() => setArmed(a.id)} style={{ ...btnDanger, borderColor: T.muted, color: T.muted }}>Remover conta</button>
                  )}
                </div>
              </div>
            )}
          </div>
        );
      })}

      <div style={{ display: "flex", gap: 8, marginTop: 10, flexWrap: "wrap" }}>
        <button onClick={() => { setTr({ ...tr, open: !tr.open, from: tr.from || defaultAccountId(finance) || "" }); setAdding(false); }} style={{ ...btnPrimary, flex: "1 1 140px" }}>Transferir</button>
        <button onClick={() => { setAdding(!adding); setTr({ ...tr, open: false }); }} style={{ ...btnPrimary, flex: "1 1 140px", background: "transparent", border: `1px dashed ${T.border}`, color: T.text, boxShadow: "none" }}>+ Nova conta</button>
      </div>

      {tr.open && (
        <div style={{ display: "flex", flexDirection: "column", gap: 8, marginTop: 10 }}>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" }}>
            <select id="tr-from" aria-label="De" value={tr.from} onChange={(e) => setTr({ ...tr, from: e.target.value })} style={{ ...inputStyle, flex: "1 1 130px" }}>
              <option value="">De…</option>
              {accounts.map((a) => <option key={a.id} value={a.id}>{a.name}</option>)}
            </select>
            <span style={{ color: T.muted }}>→</span>
            <select id="tr-to" aria-label="Para" value={tr.to} onChange={(e) => setTr({ ...tr, to: e.target.value })} style={{ ...inputStyle, flex: "1 1 130px" }}>
              <option value="">Para…</option>
              {accounts.map((a) => <option key={a.id} value={a.id}>{a.name}</option>)}
            </select>
          </div>
          <input id="tr-amount" value={tr.amount} onChange={(e) => setTr({ ...tr, amount: e.target.value })} inputMode="decimal" placeholder="Valor (R$)" style={inputStyle} />
          <button onClick={doTransfer} style={btnPrimary}>Confirmar transferência</button>
          <div style={{ fontSize: 12, color: T.muted }}>Transferência não conta como gasto nem como renda.</div>
        </div>
      )}

      {adding && (
        <div style={{ display: "flex", flexDirection: "column", gap: 8, marginTop: 10 }}>
          <input id="acc-new-name" value={nf.name} onChange={(e) => setNf({ ...nf, name: e.target.value })} placeholder="Nome (ex: PicPay)" style={inputStyle} />
          <select id="acc-new-kind" value={nf.kind} onChange={(e) => setNf({ ...nf, kind: e.target.value })} style={inputStyle}>
            {Object.entries(ACCOUNT_KINDS).map(([k, v]) => <option key={k} value={k}>{v.icon} {v.label}</option>)}
          </select>
          <input id="acc-new-bal" value={nf.balance} onChange={(e) => setNf({ ...nf, balance: e.target.value })} inputMode="decimal" placeholder="Saldo atual (R$)" style={inputStyle} />
          <button onClick={addAccount} style={btnPrimary}>Criar conta</button>
        </div>
      )}
      {msg && <div style={{ fontSize: 13, color: T.accentSoft, marginTop: 8 }}>{msg}</div>}
    </Section>
  );
}

/* ----- número principal: livre para gastar ----- */
function FreeToSpend({ plan, finance, isCurrent }) {
  const hasIncome = (finance.plan.income || 0) > 0;
  const neg = plan.free < 0;
  return (
    <div data-pn="" style={{ position: "relative", marginTop: 14, border: `1px solid ${T.border}`, background: T.panel, padding: "16px 16px 14px" }}>
      <Corner pos="tl" /><Corner pos="tr" /><Corner pos="bl" /><Corner pos="br" />
      {!hasIncome ? (
        <div style={{ fontSize: 14, color: T.text, lineHeight: 1.5 }}>
          Defina sua renda líquida em <b>Plano do mês</b>, no fim desta aba. Com ela o Caixa calcula quanto você pode gastar por dia sem furar as contas.
        </div>
      ) : (
        <>
          <div style={{ fontSize: 13, color: T.muted }}>{isCurrent ? "Livre para gastar até o fim do mês" : "Sobrou do planejado"}</div>
          <div style={{ fontFamily: F.display, fontSize: 46, lineHeight: 1.05, color: neg ? T.danger : T.text, marginTop: 4, fontVariantNumeric: "tabular-nums" }}>{brl(plan.free)}</div>
          {isCurrent && plan.daysLeft > 0 && (
            <div style={{ fontSize: 15, color: neg ? T.danger : T.good, marginTop: 2 }}>
              {neg ? "Acima do planejado. Segure os gastos variáveis." : `${brl(plan.free / plan.daysLeft)} por dia, por ${plan.daysLeft} dia(s)`}
            </div>
          )}
          {plan.vsLast !== null && (
            <div style={{ fontSize: 12, color: T.muted, marginTop: 6 }}>
              Gastos do dia a dia {plan.vsLast >= 0 ? `${plan.vsLast}% acima` : `${Math.abs(plan.vsLast)}% abaixo`} do mesmo ponto do mês passado
            </div>
          )}
          <div style={{ fontSize: 12, color: T.muted, marginTop: 10, lineHeight: 1.6 }}>
            Renda {brl(plan.income)} − contas fixas {brl(plan.fixed)} − dívidas no cartão {brl(plan.debtMin)} − reserva {brl(plan.save)} − dia a dia {brl(plan.variable)}
          </div>
        </>
      )}
    </div>
  );
}

/* ----- dias registrados ----- */
function LogDays({ finance, viewMonth, today, fin }) {
  const [y, mo] = viewMonth.split("-").map(Number);
  const last = new Date(y, mo, 0).getDate();
  const logged = new Set(finance.entries.filter((e) => !e.cardId || !e.inst || String(e.inst).startsWith("1/")).map((e) => e.date));
  const noSpend = new Set(finance.noSpend || []);
  const streak = logStreak(finance, today);
  const todayDone = logged.has(today) || noSpend.has(today);
  return (
    <Section title="Dias registrados">
      <div style={{ display: "grid", gridTemplateColumns: "repeat(7, minmax(0, 1fr))", gap: 5 }}>
        {Array.from({ length: last }, (_, i) => {
          const k = `${viewMonth}-${String(i + 1).padStart(2, "0")}`;
          const has = logged.has(k), ns = noSpend.has(k), future = k > today;
          return (
            <div key={k} title={k} style={{ height: 26, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 11, fontFamily: F.ui, fontVariantNumeric: "tabular-nums",
              background: has ? T.accent : "transparent", color: has ? "#fff" : ns ? T.gold : future ? T.border : T.muted,
              border: `1px solid ${ns ? T.gold : k === today ? T.accentSoft : future ? T.track : T.border}` }}>
              {i + 1}
            </div>
          );
        })}
      </div>
      <div style={{ display: "flex", alignItems: "center", gap: 10, marginTop: 10, flexWrap: "wrap" }}>
        <span style={{ flex: 1, fontSize: 13, color: T.muted }}>
          Sequência: <b style={{ color: T.text }}>{streak} dia(s)</b>. Vermelho = lançou; dourado = dia sem gasto.
        </span>
        {viewMonth === today.slice(0, 7) && !logged.has(today) && (
          <button onClick={() => fin.toggleNoSpend(today)} style={{ ...btnPrimary, background: "transparent", border: `1px solid ${T.gold}`, color: T.gold, boxShadow: "none", padding: "8px 12px", fontSize: 13 }}>
            {noSpend.has(today) ? "Desmarcar dia sem gasto" : "Hoje não gastei"}
          </button>
        )}
      </div>
      {!todayDone && viewMonth === today.slice(0, 7) && <div style={{ fontSize: 12, color: T.muted, marginTop: 6 }}>Hoje ainda não tem registro.</div>}
    </Section>
  );
}

/* ----- métricas ----- */
function FinanceMetrics({ m }) {

    <div style={{ borderTop: `2px solid ${color || T.border}`, background: T.panel, padding: "10px 10px 12px", minWidth: 0 }}>
      <div style={{ fontSize: 12, color: T.muted }}>{label}</div>
      <div style={{ fontFamily: F.ui, fontSize: 19, fontWeight: 700, color: T.text, marginTop: 3, fontVariantNumeric: "tabular-nums", overflowWrap: "anywhere" }}>{value}</div>
      {sub && <div style={{ fontSize: 11.5, color: color === T.danger ? T.danger : T.muted, marginTop: 2, lineHeight: 1.3 }}>{sub}</div>}
    </div>
  );
  return (
    <Section title="Números do mês">
      <div style={{ display: "grid", gridTemplateColumns: "repeat(2, minmax(0, 1fr))", gap: 8 }}>
        {tile("Custo de vida", brl(m.life), GROUPS.vida.color, m.lifeAvg ? `média ${brl(m.lifeAvg)}/mês` : "contas da casa, comida, transporte, faculdade")}
        {tile("Sobra", brl(m.net), m.net >= 0 ? T.good : T.danger, `entrou ${brl(m.totalIn)} · saiu ${brl(m.totalOut)}`)}
        {tile("Renda em dívida", m.debtPct === null ? "—" : `${m.debtPct}%`, m.debtPct !== null && m.debtPct > 30 ? T.danger : T.gold, m.debtPct !== null && m.debtPct > 30 ? "acima de 30%: zona de alerta" : "parcelas ÷ renda")}
        {tile("Reserva cobre", m.reserveMonths === null ? "—" : `${m.reserveMonths.toFixed(1)} mês(es)`, T.gold, "do seu custo de vida")}
      </div>
    </Section>
  );
}

/* ----- para onde foi ----- */
function WhereItWent({ finance, viewMonth }) {
  const outs = finance.entries.filter((e) => isSpend(e) && e.date.slice(0, 7) === viewMonth);
  const total = outs.reduce((a, e) => a + e.amount, 0);
  if (!total) return null;
  const byGroup = {}, byCat = {};
  outs.forEach((e) => {
    const g = CAT_GROUP[e.cat] || "escolha";
    byGroup[g] = (byGroup[g] || 0) + e.amount;
    byCat[e.cat] = (byCat[e.cat] || 0) + e.amount;
  });
  const top = Object.entries(byCat).sort((a, b) => b[1] - a[1]).slice(0, 4);
  return (
    <Section title="Para onde foi o dinheiro">
      <div style={{ display: "flex", height: 14, overflow: "hidden", border: `1px solid ${T.border}` }} aria-label="Divisão das saídas por grupo">
        {Object.keys(GROUPS).filter((g) => byGroup[g]).map((g) => (
          <div key={g} style={{ width: `${(byGroup[g] / total) * 100}%`, background: GROUPS[g].color }} />
        ))}
      </div>
      <div style={{ display: "flex", flexWrap: "wrap", gap: "4px 14px", marginTop: 8 }}>
        {Object.keys(GROUPS).filter((g) => byGroup[g]).map((g) => (
          <span key={g} style={{ fontSize: 12.5, color: T.text }}>
            <span style={{ display: "inline-block", width: 9, height: 9, background: GROUPS[g].color, marginRight: 5 }} />
            {GROUPS[g].label} {Math.round((byGroup[g] / total) * 100)}%
          </span>
        ))}
      </div>
      <div style={{ fontSize: 12, color: T.muted, marginTop: 6 }}>Referência para quem tem dívida: ~70% custo de vida, ~20% dívida e reserva, ~10% escolha.</div>
      <div style={{ marginTop: 10 }}>
        {top.map(([c, v]) => (
          <div key={c} style={{ display: "flex", justifyContent: "space-between", gap: 8, padding: "5px 0", fontSize: 14, borderBottom: `1px solid ${T.border}55` }}>
            <span style={{ color: T.text }}>{CAT_ICON[c] || ""} {c}</span>
            <span style={{ color: T.muted, fontVariantNumeric: "tabular-nums" }}>{brl(v)}</span>
          </div>
        ))}
      </div>
    </Section>
  );
}

/* ----- contas fixas e recorrentes ----- */
function RecurringPanel({ finance, viewMonth, today, fin }) {
  const [adding, setAdding] = useState(false);
  const [f, setF] = useState({ name: "", amount: "", day: "", type: "out", cat: "Contas e boletos", accountId: "" });
  const [msg, setMsg] = useState("");
  const [edit, setEdit] = useState(null);
  const [editVal, setEditVal] = useState("");
  const [armed, setArmed] = useState(null);
  const list = recurringStatus(finance, viewMonth, today);
  const isCurrent = viewMonth === today.slice(0, 7);

  const submit = () => {
    const amount = parseMoney(f.amount);
    const day = parseInt(f.day, 10);
    if (!f.name.trim() || !(amount > 0) || !(day >= 1 && day <= 31)) { setMsg("Preencha nome, valor e dia (1 a 31)."); return; }
    fin.addRecurring({ name: f.name.trim(), amount, day, type: f.type, cat: f.cat, accountId: f.accountId || defaultAccountId(finance) });
    setF({ name: "", amount: "", day: "", type: "out", cat: "Contas e boletos", accountId: "" });
    setAdding(false); setMsg("");
  };

  return (
    <Section title="Contas fixas e recorrentes">
      <div style={{ fontSize: 13, color: T.muted, lineHeight: 1.5, marginBottom: 8 }}>
        Cadastre uma vez. Todo mês elas aparecem como pendentes e você confirma com um toque.
      </div>
      {list.length === 0 && <Empty text="Nenhuma conta fixa ainda. Comece pelo salário e pelas contas de todo mês." />}
      {list.map((r) => (
        <div key={r.id} style={{ display: "flex", alignItems: "center", gap: 8, padding: "9px 0", borderBottom: `1px solid ${T.border}55`, flexWrap: "wrap" }}>
          <div style={{ flex: "1 1 140px", minWidth: 0 }}>
            <div style={{ fontSize: 14, color: T.text }}>{r.name}</div>
            <div style={{ fontSize: 12, color: r.done ? T.good : r.overdue && isCurrent ? T.danger : T.muted }}>
              {r.type === "in" ? "entrada" : "saída"} · dia {r.due} · {r.done ? (r.type === "in" ? "recebido" : "pago") : r.overdue && isCurrent ? "atrasado" : "pendente"}
            </div>
          </div>
          {edit === r.id ? (
            <span style={{ display: "flex", gap: 6 }}>
              <input id={`rec-val-${r.id}`} value={editVal} onChange={(e) => setEditVal(e.target.value)} inputMode="decimal" style={{ ...inputStyle, width: 100, flex: "0 0 auto" }} />
              <button onClick={() => { const v = parseMoney(editVal); if (v > 0) { fin.confirmRecurring(r.id, v, viewMonth, today); setEdit(null); } }} style={{ ...btnPrimary, padding: "8px 12px" }}>OK</button>
            </span>
          ) : r.done ? (
            <span style={{ fontSize: 14, color: T.good, fontVariantNumeric: "tabular-nums" }}>{brl(r.paidAmount)}</span>
          ) : (
            <span style={{ display: "flex", gap: 6, alignItems: "center" }}>
              <button onClick={() => fin.confirmRecurring(r.id, r.amount, viewMonth, today)} style={{ ...btnPrimary, padding: "8px 12px", fontSize: 13 }}>
                {r.type === "in" ? "Recebi" : "Paguei"} {brl(r.amount)}
              </button>
              <button onClick={() => { setEdit(r.id); setEditVal(String(r.amount).replace(".", ",")); }} style={{ background: "none", border: "none", color: T.muted, fontFamily: F.ui, fontSize: 12, cursor: "pointer", textDecoration: "underline" }}>outro valor</button>
            </span>
          )}
          {armed === r.id ? (
            <button onClick={() => { fin.removeRecurring(r.id); setArmed(null); }} style={{ ...btnDanger, padding: "6px 8px" }}>remover</button>
          ) : (
            <button aria-label={`Remover ${r.name}`} onClick={() => setArmed(r.id)} style={{ background: "none", border: "none", color: T.muted, fontSize: 15, cursor: "pointer", padding: 6 }}>✕</button>
          )}
        </div>
      ))}
      {adding ? (
        <div style={{ marginTop: 10, display: "flex", flexDirection: "column", gap: 8 }}>
          <div style={{ display: "flex", gap: 6 }}>
            {[["out", "Saída"], ["in", "Entrada"]].map(([t, label]) => (
              <button key={t} onClick={() => setF({ ...f, type: t, cat: t === "in" ? FIN_IN[0] : "Contas e boletos" })} aria-pressed={f.type === t}
                style={{ flex: 1, minHeight: 38, background: f.type === t ? T.panel2 : "transparent", border: `1px solid ${f.type === t ? T.accent : T.border}`, color: f.type === t ? T.text : T.muted, fontFamily: F.ui, fontWeight: 600, cursor: "pointer" }}>{label}</button>
            ))}
          </div>
          <input id="rec-name" value={f.name} onChange={(e) => setF({ ...f, name: e.target.value })} placeholder="Nome (ex: Internet, Salário, Mensalidade)" style={inputStyle} />
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
            <input id="rec-amount" value={f.amount} onChange={(e) => setF({ ...f, amount: e.target.value })} inputMode="decimal" placeholder="Valor (R$)" style={{ ...inputStyle, flex: "1 1 110px" }} />
            <input id="rec-day" value={f.day} onChange={(e) => setF({ ...f, day: e.target.value.replace(/\D/g, "") })} inputMode="numeric" placeholder="Dia" style={{ ...inputStyle, flex: "0 0 80px" }} />
            <select id="rec-cat" value={f.cat} onChange={(e) => setF({ ...f, cat: e.target.value })} style={{ ...inputStyle, flex: "1 1 140px" }}>
              {(f.type === "in" ? FIN_IN : FIN_OUT).map((c) => <option key={c} value={c}>{c}</option>)}
            </select>
          </div>
          <select id="rec-acc" aria-label="Conta" value={f.accountId || defaultAccountId(finance) || ""} onChange={(e) => setF({ ...f, accountId: e.target.value })} style={inputStyle}>
            {liveAccounts(finance).map((a) => <option key={a.id} value={a.id}>{f.type === "in" ? "Entra em" : "Sai de"} {a.name}</option>)}
          </select>
          <div style={{ display: "flex", gap: 8 }}>
            <button onClick={submit} style={{ ...btnPrimary, flex: 1 }}>Salvar conta fixa</button>
            <button onClick={() => { setAdding(false); setMsg(""); }} style={{ ...btnDanger, borderColor: T.muted, color: T.muted }}>Cancelar</button>
          </div>
        </div>
      ) : (
        <button onClick={() => setAdding(true)} style={{ ...btnPrimary, background: "transparent", border: `1px dashed ${T.border}`, color: T.text, boxShadow: "none", width: "100%", marginTop: 10 }}>+ Nova conta fixa</button>
      )}
      {msg && <div style={{ fontSize: 13, color: T.accentSoft, marginTop: 8 }}>{msg}</div>}
    </Section>
  );
}

/* ----- dívidas ----- */
function DebtPanel({ debts, today, fin }) {
  const [adding, setAdding] = useState(false);
  const [f, setF] = useState({ name: "", balance: "", rate: "", payment: "", dueDay: "" });
  const [msg, setMsg] = useState("");
  const [paying, setPaying] = useState(null);
  const [payVal, setPayVal] = useState("");
  const [editing, setEditing] = useState(null);
  const [ef, setEf] = useState({ rate: "", payment: "" });
  const [armed, setArmed] = useState(null);
  const [extra, setExtra] = useState(100);

  const open = debts.filter((d) => d.balance > 0).sort((a, b) => (b.rate ?? -1) - (a.rate ?? -1));
  const closed = debts.filter((d) => d.balance <= 0);
  const missing = open.filter((d) => d.rate == null || !d.payment);
  const target = open.find((d) => d.rate != null);
  const initial = debts.reduce((a, d) => a + (d.initial || d.balance), 0);
  const paid = debts.reduce((a, d) => a + Math.max(0, (d.initial || d.balance) - d.balance), 0);
  const pct = initial ? Math.round((paid / initial) * 100) : 0;
  const base = missing.length ? null : simulateDebts(debts, 0);
  const plus = base && !base.stuck ? simulateDebts(debts, extra) : null;
  const expensive = open.filter((d) => (d.rate || 0) >= 6);

  const submit = () => {
    const balance = parseMoney(f.balance);
    if (!f.name.trim() || !(balance > 0)) { setMsg("Informe o credor e o saldo devedor."); return; }
    const rate = f.rate.trim() ? parseMoney(f.rate) : null;
    const payment = f.payment.trim() ? parseMoney(f.payment) : null;
    const dueDay = f.dueDay.trim() ? Math.min(31, Math.max(1, parseInt(f.dueDay, 10) || 1)) : null;
    fin.addDebt({ name: f.name.trim(), balance, initial: balance, rate: isFinite(rate) ? rate : null, payment: isFinite(payment) ? payment : null, dueDay });
    setF({ name: "", balance: "", rate: "", payment: "", dueDay: "" });
    setAdding(false); setMsg("");
  };

  return (
    <Section title="Dívidas" accent={T.danger} glow="rgba(255,23,68,0.12)">
      {debts.length > 0 && (
        <div style={{ marginBottom: 12 }}>
          <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13, color: T.muted }}>
            <span>Quitado</span><span style={{ fontVariantNumeric: "tabular-nums" }}>{brl(paid)} de {brl(initial)} · {pct}%</span>
          </div>
          <div style={{ height: 8, background: T.track, marginTop: 4 }}>
            <div style={{ height: "100%", width: `${pct}%`, background: T.good }} />
          </div>
        </div>
      )}

      {base && !base.stuck && open.length > 0 && (
        <div data-pn="" style={{ border: `1px solid ${T.border}`, background: T.panel2, padding: "10px 12px", marginBottom: 12 }}>
          <div style={{ fontSize: 13, color: T.muted }}>Livre de dívidas em</div>
          <div style={{ fontFamily: F.display, fontSize: 30, color: T.text, lineHeight: 1.1 }}>{monthLabel(addMonthsKey(today.slice(0, 7), base.months))}</div>
          <div style={{ fontSize: 13, color: T.muted, marginTop: 2 }}>{base.months} mês(es) pagando as parcelas · {brl(base.interest)} de juros no caminho</div>
          {plus && !plus.stuck && (
            <div style={{ marginTop: 10 }}>
              <div style={{ display: "flex", gap: 6, alignItems: "center", flexWrap: "wrap" }}>
                <span style={{ fontSize: 13, color: T.text }}>Pagando a mais por mês:</span>
                {[50, 100, 200, 300].map((v) => (
                  <button key={v} onClick={() => setExtra(v)} aria-pressed={extra === v}
                    style={{ minHeight: 32, padding: "4px 10px", background: extra === v ? T.panel : "transparent", border: `1px solid ${extra === v ? T.gold : T.border}`, color: extra === v ? T.gold : T.muted, fontFamily: F.ui, fontSize: 13, cursor: "pointer" }}>+{v}</button>
                ))}
              </div>
              <div style={{ fontSize: 14, color: T.good, marginTop: 6 }}>
                {base.months - plus.months > 0
                  ? `Termina ${base.months - plus.months} mês(es) antes e economiza ${brl(base.interest - plus.interest)} de juros.`
                  : `Economiza ${brl(base.interest - plus.interest)} de juros.`}
              </div>
            </div>
          )}
        </div>
      )}
      {base && base.stuck && <div style={{ fontSize: 13, color: T.danger, marginBottom: 10, lineHeight: 1.5 }}>As parcelas não cobrem os juros: a dívida cresce todo mês. Aumente o pagamento ou renegocie.</div>}
      {missing.length > 0 && <div style={{ fontSize: 13, color: T.gold, marginBottom: 10, lineHeight: 1.5 }}>Informe juros e parcela de cada dívida. Só assim o Caixa ordena o ataque e calcula a data de quitação.</div>}
      {expensive.length > 0 && (
        <div style={{ fontSize: 13, color: T.danger, marginBottom: 10, lineHeight: 1.5 }}>
          Juros de 6% ao mês ou mais é nível de cheque especial ou rotativo. Antes de amortizar, pesquise trocar por um crédito mais barato (portabilidade ou consignado).
        </div>
      )}
      {debts.length === 0 && <Empty text="Nenhuma dívida cadastrada. Cadastre cada uma com saldo, juros ao mês e parcela." />}

      {[...open, ...closed].map((d) => {
        const isTarget = target && d.id === target.id;
        const interestMonth = d.rate ? d.balance * d.rate / 100 : 0;
        const doneIn = base && !base.stuck && base.perDebt[d.id];
        return (
          <div key={d.id} data-pn="" style={{ border: `1px solid ${isTarget ? T.danger : T.border}`, background: T.panel2, padding: "10px 12px", marginBottom: 8, opacity: d.balance <= 0 ? 0.6 : 1 }}>
            <div style={{ display: "flex", alignItems: "baseline", gap: 8, flexWrap: "wrap" }}>
              <span style={{ fontSize: 15, fontWeight: 700, color: T.text, flex: 1, minWidth: 0 }}>{d.name}</span>
              {isTarget && <span style={{ fontSize: 12, fontWeight: 700, color: "#fff", background: T.danger, padding: "2px 7px" }}>Atacar primeiro</span>}
              {d.balance <= 0 && <span style={{ fontSize: 12, fontWeight: 700, color: T.onAccent, background: T.good, padding: "2px 7px" }}>Quitada</span>}
            </div>
            <div style={{ fontFamily: F.display, fontSize: 28, color: d.balance > 0 ? T.text : T.good, marginTop: 2, fontVariantNumeric: "tabular-nums" }}>{brl(Math.max(0, d.balance))}</div>
            <div style={{ fontSize: 13, color: T.muted, marginTop: 4, lineHeight: 1.6 }}>
              {d.rate == null ? <span style={{ color: T.gold }}>juros não informados</span> : `juros ${String(d.rate).replace(".", ",")}% a.m. = ${brl(interestMonth)}/mês`}
              {d.payment ? ` · parcela ${brl(d.payment)}` : ""}{d.dueDay ? ` · vence dia ${d.dueDay}` : ""}
              {doneIn ? <><br />Quitação prevista: <span style={{ color: T.text }}>{monthLabel(addMonthsKey(today.slice(0, 7), doneIn))}</span></> : null}
            </div>
            {editing === d.id ? (
              <div style={{ display: "flex", gap: 6, marginTop: 8, flexWrap: "wrap" }}>
                <input id={`debt-rate-${d.id}`} value={ef.rate} onChange={(e) => setEf({ ...ef, rate: e.target.value })} inputMode="decimal" placeholder="Juros % a.m." style={{ ...inputStyle, flex: "1 1 100px" }} />
                <input id={`debt-pay-${d.id}`} value={ef.payment} onChange={(e) => setEf({ ...ef, payment: e.target.value })} inputMode="decimal" placeholder="Parcela R$" style={{ ...inputStyle, flex: "1 1 100px" }} />
                <button onClick={() => {
                  const rate = ef.rate.trim() ? parseMoney(ef.rate) : null;
                  const payment = ef.payment.trim() ? parseMoney(ef.payment) : null;
                  fin.updateDebt(d.id, { rate: isFinite(rate) ? rate : null, payment: isFinite(payment) ? payment : null });
                  setEditing(null);
                }} style={btnPrimary}>Salvar</button>
              </div>
            ) : paying === d.id ? (
              <div style={{ display: "flex", gap: 6, marginTop: 8, flexWrap: "wrap" }}>
                <input id={`pay-${d.id}`} value={payVal} onChange={(e) => setPayVal(e.target.value)} inputMode="decimal" placeholder="Valor pago" style={{ ...inputStyle, flex: "1 1 110px" }} />
                <button onClick={() => { const v = parseMoney(payVal); if (v > 0) { fin.payDebt(d.id, v, today); setPaying(null); } }} style={btnPrimary}>Confirmar</button>
                <button onClick={() => setPaying(null)} style={{ ...btnDanger, borderColor: T.muted, color: T.muted }}>Cancelar</button>
              </div>
            ) : d.balance > 0 ? (
              <div style={{ display: "flex", gap: 6, marginTop: 8, flexWrap: "wrap" }}>
                <button onClick={() => { setPaying(d.id); setPayVal(d.payment ? String(d.payment).replace(".", ",") : ""); }} style={{ ...btnPrimary, flex: "1 1 160px" }}>Registrar pagamento</button>
                <button onClick={() => { setEditing(d.id); setEf({ rate: d.rate != null ? String(d.rate).replace(".", ",") : "", payment: d.payment ? String(d.payment).replace(".", ",") : "" }); }}
                  style={{ ...btnPrimary, background: "transparent", border: `1px solid ${T.border}`, color: T.text, boxShadow: "none" }}>Juros e parcela</button>
                {armed === d.id ? (
                  <button onClick={() => { fin.removeDebt(d.id); setArmed(null); }} style={btnDanger}>apagar</button>
                ) : (
                  <button aria-label={`Apagar ${d.name}`} onClick={() => setArmed(d.id)} style={{ background: "none", border: `1px solid ${T.border}`, color: T.muted, cursor: "pointer", padding: "0 12px" }}>✕</button>
                )}
              </div>
            ) : null}
          </div>
        );
      })}

      {adding ? (
        <div style={{ marginTop: 6, display: "flex", flexDirection: "column", gap: 8 }}>
          <input id="debt-name" value={f.name} onChange={(e) => setF({ ...f, name: e.target.value })} placeholder="Credor (ex: cartão, banco, família)" style={inputStyle} />
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
            <input id="debt-balance" value={f.balance} onChange={(e) => setF({ ...f, balance: e.target.value })} inputMode="decimal" placeholder="Saldo devedor (R$)" style={{ ...inputStyle, flex: "1 1 130px" }} />
            <input id="debt-rate" value={f.rate} onChange={(e) => setF({ ...f, rate: e.target.value })} inputMode="decimal" placeholder="Juros % ao mês" style={{ ...inputStyle, flex: "1 1 110px" }} />
          </div>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
            <input id="debt-payment" value={f.payment} onChange={(e) => setF({ ...f, payment: e.target.value })} inputMode="decimal" placeholder="Parcela (R$)" style={{ ...inputStyle, flex: "1 1 110px" }} />
            <input id="debt-due" value={f.dueDay} onChange={(e) => setF({ ...f, dueDay: e.target.value.replace(/\D/g, "") })} inputMode="numeric" placeholder="Dia de vencimento" style={{ ...inputStyle, flex: "1 1 110px" }} />
          </div>
          <div style={{ display: "flex", gap: 8 }}>
            <button onClick={submit} style={{ ...btnPrimary, flex: 1 }}>Salvar dívida</button>
            <button onClick={() => { setAdding(false); setMsg(""); }} style={{ ...btnDanger, borderColor: T.muted, color: T.muted }}>Cancelar</button>
          </div>
        </div>
      ) : (
        <button onClick={() => setAdding(true)} style={{ ...btnPrimary, background: "transparent", border: `1px dashed ${T.danger}`, color: T.text, boxShadow: "none", width: "100%", marginTop: 4 }}>+ Nova dívida</button>
      )}
      {msg && <div style={{ fontSize: 13, color: T.accentSoft, marginTop: 8 }}>{msg}</div>}
      <div style={{ fontSize: 11.5, color: T.muted, marginTop: 10, lineHeight: 1.5 }}>
        Referência do Banco Central: rotativo do cartão ~445% ao ano, cheque especial ~7% ao mês, crédito pessoal ~6% ao mês, consignado ~3% ao mês.
      </div>
    </Section>
  );
}

/* ----- reserva: soma das caixinhas ----- */
function ReservePanel({ finance, m, fin, today }) {
  const { target } = finance.reserve;
  const saved = reserveSaved(finance);
  const boxes = liveAccounts(finance).filter((a) => a.kind === "caixinha");
  const others = liveAccounts(finance).filter((a) => a.kind !== "caixinha");
  const [val, setVal] = useState("");
  const [acc, setAcc] = useState("");
  const [tgt, setTgt] = useState(target ? String(target).replace(".", ",") : "");
  const [msg, setMsg] = useState("");
  const pct = target ? Math.min(100, Math.round((saved / target) * 100)) : 0;
  const monthly = finance.plan.reserveMonthly || 0;
  const left = Math.max(0, target - saved);
  const eta = target && left > 0 && monthly > 0 ? Math.ceil(left / monthly) : null;
  const from = acc || defaultAccountId(finance) || (others[0] || {}).id;
  const move = (sign) => {
    const v = parseMoney(val);
    if (!boxes.length) { setMsg("Crie uma conta do tipo Caixinha em Contas."); return; }
    if (!(v > 0)) { setMsg("Digite um valor maior que zero."); return; }
    const box = boxes[0].id;
    if (sign < 0 && v > accountBalance(finance, box)) { setMsg(`A caixinha tem ${brl(accountBalance(finance, box))}.`); return; }
    if (sign > 0) fin.transfer(from, box, v, today); else fin.transfer(box, from, v, today);
    setVal("");
    setMsg(sign > 0 ? `${brl(v)} guardado, saiu de ${accountName(finance, from)}.` : `${brl(v)} voltou para ${accountName(finance, from)}.`);
  };
  return (
    <Section title="Reserva de transição" accent={T.gold} glow="rgba(251,191,36,0.1)">
      <div style={{ fontSize: 13, color: T.muted, lineHeight: 1.5, marginBottom: 8 }}>É a soma das suas caixinhas. O colchão para sair da Italac sem depender de ninguém. Não é dinheiro de trading.</div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", gap: 8, flexWrap: "wrap" }}>
        <span style={{ fontFamily: F.display, fontSize: 32, color: T.gold, fontVariantNumeric: "tabular-nums" }}>{brl(saved)}</span>
        <span style={{ fontSize: 13, color: T.muted }}>{target ? `meta ${brl(target)} · ${pct}%` : "sem meta definida"}</span>
      </div>
      <div style={{ height: 8, background: T.track, marginTop: 6 }}>
        <div style={{ height: "100%", width: `${pct}%`, background: T.gold }} />
      </div>
      <div style={{ fontSize: 13, color: T.muted, marginTop: 6 }}>
        {m.reserveMonths !== null ? `Cobre ${m.reserveMonths.toFixed(1)} mês(es) do seu custo de vida.` : "Lance seus gastos para saber quantos meses a reserva cobre."}
        {eta ? ` Guardando ${brl(monthly)}/mês, chega na meta em ${eta} mês(es).` : ""}
      </div>
      <div style={{ display: "flex", gap: 6, marginTop: 10, flexWrap: "wrap" }}>
        <input id="reserve-move" value={val} onChange={(e) => setVal(e.target.value)} inputMode="decimal" placeholder="Valor (R$)" style={{ ...inputStyle, flex: "1 1 110px" }} />
        <select id="reserve-acc" aria-label="Conta" value={from || ""} onChange={(e) => setAcc(e.target.value)} style={{ ...inputStyle, flex: "1 1 120px" }}>
          {others.map((a) => <option key={a.id} value={a.id}>{a.name}</option>)}
        </select>
      </div>
      <div style={{ display: "flex", gap: 6, marginTop: 8 }}>
        <button onClick={() => move(1)} style={{ ...btnPrimary, flex: 1, background: T.gold, color: T.onAccent, boxShadow: "none" }}>Guardar</button>
        <button onClick={() => move(-1)} style={{ ...btnDanger, flex: 1, borderColor: T.muted, color: T.muted }}>Retirar</button>
      </div>
      <div style={{ display: "flex", gap: 6, marginTop: 8 }}>
        <input id="reserve-target" value={tgt} onChange={(e) => setTgt(e.target.value)} inputMode="decimal" placeholder="Meta da reserva (R$)" style={inputStyle} />
        <button onClick={() => { const v = parseMoney(tgt); if (v >= 0) { fin.setReserveTarget(v); setMsg("Meta atualizada."); } }} style={{ ...btnPrimary, background: "transparent", border: `1px solid ${T.gold}`, color: T.gold, boxShadow: "none" }}>Definir meta</button>
      </div>
      {msg && <div style={{ fontSize: 13, color: T.accentSoft, marginTop: 8 }}>{msg}</div>}
    </Section>
  );
}

/* ----- plano do mês ----- */

  const [res, setRes] = useState(plan.reserveMonthly ? String(plan.reserveMonthly).replace(".", ",") : "");

  return (
    <Section title="Plano do mês">
      <button onClick={() => setOpen(!open)} style={{ background: "none", border: "none", color: T.muted, fontFamily: F.ui, fontSize: 13, padding: 0, cursor: "pointer" }}>
        {open ? "▾ Fechar" : `▸ Renda ${brl(plan.income)} · reserva ${brl(plan.reserveMonthly)}/mês`}
      </button>
      {open && (
        <div style={{ marginTop: 8, display: "flex", flexDirection: "column", gap: 8 }}>
          <label style={{ fontSize: 13, color: T.text }} htmlFor="plan-income">Renda líquida do mês (o que cai na conta, somando todos os trabalhos)</label>
          <input id="plan-income" value={inc} onChange={(e) => setInc(e.target.value)} inputMode="decimal" placeholder="R$" style={inputStyle} />
          <label style={{ fontSize: 13, color: T.text }} htmlFor="plan-reserve">Quanto guardar por mês na reserva</label>
          <input id="plan-reserve" value={res} onChange={(e) => setRes(e.target.value)} inputMode="decimal" placeholder="R$" style={inputStyle} />
          <button onClick={() => {
            const i = inc.trim() ? parseMoney(inc) : 0;
            const r = res.trim() ? parseMoney(res) : 0;

            fin.setPlan({ income: i, reserveMonthly: r });
            setMsg("Plano salvo."); setOpen(false);
          }} style={btnPrimary}>Salvar plano</button>

      )}
