}

/* ----- contas e faturas vencendo ----- */
function DueStrip({ finance, today, fin }) {
  const monthKey = today.slice(0, 7);
  const dToday = Number(today.slice(8));
  const bills = recurringStatus(finance, monthKey, today)
    .filter((r) => !r.done && (r.overdue || r.due - dToday <= 5))
    .map((r) => ({ key: `r${r.id}`, label: r.name, overdue: r.overdue, when: r.overdue ? `atrasada desde dia ${r.due}` : r.due === dToday ? "vence hoje" : `dia ${r.due}`, amount: r.amount, btn: r.type === "in" ? "Recebi" : "Paguei", act: () => fin.confirmRecurring(r.id, r.amount, monthKey, today) }));
  const inv = [];
  (finance.cards || []).forEach((c) => {
    cardSummary(finance, c, today).invoices.forEach((i) => {
      if (i.paid || !i.closed) return;
      const daysTo = Math.round((parseKey(i.due) - parseKey(today)) / 86400000);
      if (!i.overdue && daysTo > 5) return;
      inv.push({ key: `c${c.id}${i.key}`, label: `Fatura ${c.name}`, overdue: i.overdue, when: i.overdue ? `venceu ${i.due.slice(8)}/${i.due.slice(5, 7)}` : daysTo === 0 ? "vence hoje" : `vence ${i.due.slice(8)}/${i.due.slice(5, 7)}`, amount: i.total, btn: "Paguei", act: () => fin.payInvoice(c.id, i.key, i.total, today) });
    });
  });
  const list = [...inv, ...bills];
  if (!list.length) return null;
  return (
    <div data-pn="" style={{ marginTop: 12, border: `1px solid ${list.some((r) => r.overdue) ? T.danger : T.border}`, background: T.panel2, padding: "10px 12px" }}>
      {list.some((r) => r.overdue)
        ? <div style={{ fontSize: 14, fontWeight: 700, letterSpacing: 1, color: T.danger, marginBottom: 6 }}>ATRASADO</div>
        : <div style={{ fontSize: 14, fontWeight: 600, color: T.text, marginBottom: 6 }}>Vence em breve</div>}
      {list.map((r) => (
        <div key={r.key} style={{ display: "flex", alignItems: "center", gap: 8, padding: "5px 0" }}>
          <span style={{ flex: 1, minWidth: 0, fontSize: 14, color: r.overdue ? T.danger : T.text }}>
            {r.label} <span style={{ color: T.muted, fontSize: 12 }}>{r.when}</span>
          </span>
          <button onClick={r.act} style={{ ...btnPrimary, padding: "8px 12px", fontSize: 13 }}>{r.btn} {brl(r.amount)}</button>
        </div>
      ))}
    </div>
  );
}

/* ----- lançamento rápido: valor → conta ou cartão → categoria ----- */
function QuickEntry({ finance, today, fin }) {
  const [type, setType] = useState("out");
  const [amount, setAmount] = useState("");
  const accounts = liveAccounts(finance);
  const cards = finance.cards || [];
  const [payWith, setPayWith] = useState(defaultAccountId(finance) || "");
  const [inst, setInst] = useState(1);
  const [more, setMore] = useState(false);
  const [date, setDate] = useState(today);
  const [note, setNote] = useState("");
  const [msg, setMsg] = useState("");
  const [toast, setToast] = useState(null);
  const [free, setFree] = useState(false);
  const timer = useRef(null);
  const cats = type === "in" ? FIN_IN : FIN_OUT;
  const card = type === "out" ? cards.find((c) => c.id === payWith) : null;
  const accountId = card ? undefined : (accounts.some((a) => a.id === payWith) ? payWith : defaultAccountId(finance));

  useEffect(() => () => clearTimeout(timer.current), []);

  const showToast = (id, text) => {
    setToast({ id, text });
    clearTimeout(timer.current);
    timer.current = setTimeout(() => setToast(null), 5000);
  };

  const save = (cat, value, noteText, repeatAcc) => {
    const v = value != null ? value : parseMoney(amount);
    if (!(v > 0)) { setMsg("Digite o valor primeiro, por exemplo 18,50."); return; }
    const id = Date.now() + Math.random();
    const t = value != null ? "out" : type;
    const d = date || today;
    const n = (noteText != null ? noteText : note).trim();
    if (value == null && card) {
      const owedBefore = cardSummary(finance, card, today).used;
      fin.addCardPurchase({ id, cardId: card.id, total: v, installments: inst, cat, date: d, note: n });
      showToast(id, `${brl(v)} em ${cat} no ${card.name}${inst > 1 ? `, ${inst}x de ${brl(round2(v / inst))}` : ""} · sua dívida no ${card.name} subiu para ${brl(round2(owedBefore + v))}`);
    } else {
      const acc = repeatAcc || accountId;
      fin.addEntry({ id, type: t, amount: v, cat, date: d, note: n, accountId: acc, ...(t === "out" && free && value == null ? { free: true } : {}) });
      const after = monthPlan({ ...finance, entries: [...finance.entries, { id, type: t, amount: v, cat, date: d, note: "", accountId: acc }] }, today.slice(0, 7), today);
      const tail = t === "out" && (finance.plan.income || 0) > 0 && after.daysLeft > 0 ? ` · restam ${brl(Math.max(0, after.free) / after.daysLeft)}/dia` : "";
      showToast(id, `${t === "in" ? "Entrada" : "Saída"} de ${brl(v)} em ${cat}, ${accountName(finance, acc)}${d !== today ? `, dia ${d.slice(8)}/${d.slice(5, 7)}` : ""}${tail}`);
    }
    setAmount(""); setNote(""); setMsg(""); setMore(false); setInst(1); setFree(false);
  };

  const seen = new Set();
  const repeats = [];
  [...finance.entries].reverse().forEach((e) => {
    if (e.type !== "out" || e.debtId || e.recId || e.cardId || e.cardPayment) return;
    const k = `${e.cat}|${e.amount}|${e.accountId}`;
    if (seen.has(k) || repeats.length >= 4) return;
    seen.add(k);
    repeats.push(e);
  });

  const chipStyle = (on) => ({ minHeight: 38, padding: "6px 12px", background: on ? T.panel2 : "transparent", border: `1px solid ${on ? T.accent : T.border}`, color: on ? T.text : T.muted, fontFamily: F.ui, fontSize: 14, fontWeight: 600, cursor: "pointer" });

  return (
    <Section title="Lançar">
      <div style={{ display: "flex", gap: 6 }}>
        {[["out", "Saída"], ["in", "Entrada"]].map(([t, label]) => (
          <button key={t} onClick={() => { setType(t); if (t === "in" && cards.some((c) => c.id === payWith)) setPayWith(defaultAccountId(finance) || ""); }} aria-pressed={type === t}
            style={{ flex: 1, minHeight: 40, background: type === t ? T.panel2 : "transparent", border: `1px solid ${type === t ? (t === "in" ? T.good : T.accent) : T.border}`, color: type === t ? (t === "in" ? T.good : T.text) : T.muted, fontFamily: F.ui, fontSize: 15, fontWeight: 600, cursor: "pointer" }}>
            {label}
          </button>
        ))}
      </div>
      <input id="quick-amount" value={amount} onChange={(e) => setAmount(e.target.value)} inputMode="decimal" placeholder="R$ 0,00" aria-label="Valor"
        style={{ ...inputStyle, width: "100%", marginTop: 10, fontFamily: F.display, fontSize: 34, padding: "8px 12px", textAlign: "center" }} />

      <div style={{ display: "flex", alignItems: "center", gap: 6, marginTop: 10, flexWrap: "wrap" }}>
        <span style={{ fontSize: 13, color: T.muted, marginRight: 2 }}>Data</span>
        {[[today, "Hoje"], [addDays(today, -1), "Ontem"]].map(([k, label]) => (
          <button key={label} onClick={() => setDate(k)} aria-pressed={date === k} style={chipStyle(date === k)}>{label}</button>
        ))}
        <input id="quick-date" type="date" value={date} max={today} onChange={(e) => e.target.value && setDate(e.target.value)} aria-label="Outra data"
          style={{ ...inputStyle, flex: "1 1 140px", colorScheme: T.light ? "light" : "dark", padding: "7px 10px", borderColor: date !== today && date !== addDays(today, -1) ? T.accent : T.border }} />
      </div>

      <div style={{ marginTop: 10 }}>
        <div style={{ fontSize: 13, color: T.muted, marginBottom: 6 }}>{type === "out" ? "Pagar com" : "Entrou em"}</div>
        <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
          {accounts.map((a) => (
            <button key={a.id} onClick={() => { setPayWith(a.id); setInst(1); }} aria-pressed={!card && accountId === a.id} style={chipStyle(!card && accountId === a.id)}>{(ACCOUNT_KINDS[a.kind] || {}).icon} {a.name}</button>
          ))}
          {type === "out" && cards.map((c) => (
            <button key={c.id} onClick={() => setPayWith(c.id)} aria-pressed={payWith === c.id} style={chipStyle(payWith === c.id)}>💳 {c.name} crédito</button>
          ))}
        </div>
        {card && (
          <div style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 8, flexWrap: "wrap" }}>
            <label htmlFor="quick-inst" style={{ fontSize: 13, color: T.muted }}>Parcelas</label>
            <select id="quick-inst" value={inst} onChange={(e) => setInst(Number(e.target.value))} style={{ ...inputStyle, flex: "0 0 90px" }}>
              {Array.from({ length: 12 }, (_, i) => <option key={i + 1} value={i + 1}>{i + 1}x</option>)}
            </select>
            {parseMoney(amount) > 0 && inst > 1 && <span style={{ fontSize: 13, color: T.text }}>{inst}x de {brl(round2(parseMoney(amount) / inst))}</span>}
            <span style={{ fontSize: 12, color: T.muted, flexBasis: "100%" }}>Entra na fatura de {monthLabel(invoiceFor(card, date || today)).toLowerCase()}.</span>
          </div>
        )}
      </div>

      {type === "out" && !card && (
        <div style={{ display: "flex", gap: 6, marginTop: 10 }} role="group" aria-label="Envelope">
          {[[false, "Variáveis"], [true, "Livre sem culpa"]].map(([v, label]) => (
            <button key={label} onClick={() => setFree(v)} aria-pressed={free === v} style={{ ...chipStyle(free === v), flex: 1 }}>{label}</button>
          ))}
        </div>
      )}
      {type === "out" && parseMoney(amount) > 0 && <CxOppLine finance={finance} today={today} value={parseMoney(amount)} />}
      <div style={{ fontSize: 13, color: T.muted, margin: "12px 0 6px" }}>Toque na categoria para salvar</div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(4, minmax(0, 1fr))", gap: 6 }}>
        {cats.map((c) => (
          <button key={c} onClick={() => save(c)}
            data-pn="" style={{ minHeight: 64, background: T.panel2, border: `1px solid ${T.border}`, color: T.text, cursor: "pointer", padding: "6px 2px", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 3 }}>
            <span style={{ fontSize: 20 }} aria-hidden="true">{CAT_ICON[c] || "•"}</span>
            <span style={{ fontFamily: F.ui, fontSize: 11.5, lineHeight: 1.1, textAlign: "center", overflowWrap: "anywhere" }}>{c}</span>
          </button>
        ))}
      </div>
      {type === "out" && !card && repeats.length > 0 && (
        <div style={{ marginTop: 10 }}>
          <div style={{ fontSize: 13, color: T.muted, marginBottom: 6 }}>Repetir</div>
          <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
            {repeats.map((e) => (
              <button key={e.id} onClick={() => save(e.cat, e.amount, e.note || "", e.accountId)}
                style={{ minHeight: 36, background: "transparent", border: `1px dashed ${T.border}`, color: T.text, padding: "6px 10px", fontFamily: F.ui, fontSize: 13, cursor: "pointer" }}>
                {CAT_ICON[e.cat] || ""} {e.note || e.cat} {brl(e.amount)}
              </button>
            ))}
          </div>
        </div>
      )}
      <button onClick={() => setMore(!more)} style={{ background: "none", border: "none", color: T.muted, fontFamily: F.ui, fontSize: 13, marginTop: 10, padding: 0, cursor: "pointer" }}>
        {more ? "▾ Fechar nota" : "▸ Adicionar nota"}
      </button>
      {more && (
        <div style={{ display: "flex", gap: 8, marginTop: 8, flexWrap: "wrap" }}>
          <input id="quick-note" value={note} onChange={(e) => setNote(e.target.value)} placeholder="Nota (ex: troca de óleo)" maxLength={60} style={{ ...inputStyle, flex: "1 1 150px" }} />
        </div>
      )}
      {msg && <div style={{ fontSize: 13, color: T.accentSoft, marginTop: 8 }}>{msg}</div>}
      {toast && (
        <div role="status" style={{ marginTop: 10, display: "flex", alignItems: "center", gap: 10, border: `1px solid ${T.good}66`, background: "rgba(110,231,160,0.07)", padding: "8px 10px" }}>
          <span style={{ flex: 1, fontSize: 13, color: T.text }}>Salvo: {toast.text}</span>
          <button onClick={() => { fin.removeEntry(toast.id); setToast(null); }} style={{ background: "none", border: `1px solid ${T.border}`, color: T.accentSoft, fontFamily: F.ui, fontSize: 13, padding: "6px 10px", cursor: "pointer" }}>Desfazer</button>
        </div>
      )}
    </Section>
  );
}

            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 8, flexWrap: "wrap" }}>
              <span style={{ fontSize: 13, color: c.rate == null ? T.gold : T.muted, flex: 1 }}>{c.rate == null ? "Juros ao mês não informados" : `Juros ${String(c.rate).replace(".", ",")}% ao mês`}</span>
              {rateFor === c.id ? (<>
                <input id={`card-rate-${c.id}`} value={rateVal} onChange={(e) => setRateVal(e.target.value)} inputMode="decimal" placeholder="% ao mês" style={{ ...inputStyle, flex: "0 0 100px", padding: "6px 8px" }} />
                <button onClick={() => { const r = parseMoney(rateVal); if (r >= 0 && r < 100) { fin.updateCard(c.id, { rate: r }); setRateFor(null); } }} style={{ ...btnPrimary, padding: "6px 10px", fontSize: 13 }}>Salvar</button>
              </>) : (
                <button onClick={() => { setRateFor(c.id); setRateVal(c.rate == null ? "" : String(c.rate).replace(".", ",")); }} style={{ background: "none", border: "none", color: T.accentSoft, fontFamily: F.ui, fontSize: 13, cursor: "pointer", textDecoration: "underline" }}>{c.rate == null ? "informar" : "editar"}</button>
              )}
            </div>
            {(() => {
              const groups = cardOldDebts(finance, c, today);
              return (
                <div style={{ marginTop: 6 }}>
                  {groups.map((g) => (
                    <div key={g.id} style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 13, padding: "5px 0", borderTop: `1px solid ${T.border}55` }}>
                      <span style={{ flex: 1, color: T.text }}>⛓️ {g.note} <span style={{ color: T.muted }}>· {g.carry || g.left === 1 ? brl(g.total) : `faltam ${g.left}x de ${brl(g.parcela)} (${brl(g.total)})`}</span></span>
                      {odArmed === g.id ? (
                        <button onClick={() => { fin.removeEntry(g.firstId); setOdArmed(null); }} style={{ ...btnDanger, padding: "4px 8px", fontSize: 12 }}>apagar</button>
                      ) : (
                        <button onClick={() => setOdArmed(g.id)} aria-label={`Apagar ${g.note}`} style={{ background: "none", border: "none", color: T.muted, fontSize: 12, cursor: "pointer", textDecoration: "underline", fontFamily: F.ui }}>apagar</button>
                      )}
                    </div>
                  ))}
                  {oldFor === c.id ? <OldDebtForm card={c} today={today} fin={fin} onDone={() => setOldFor(null)} /> : (
                    <button onClick={() => setOldFor(c.id)} style={{ background: "none", border: `1px dashed ${T.border}`, color: T.text, fontFamily: F.ui, fontSize: 13, cursor: "pointer", padding: "7px 10px", width: "100%", marginTop: 4 }}>+ Dívida que já existe neste cartão</button>
                  )}
                </div>
              );
            })()}
            <div style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 8 }}>
              <label htmlFor={`card-from-${c.id}`} style={{ fontSize: 13, color: T.muted }}>Fatura paga com</label>
              <select id={`card-from-${c.id}`} value={c.payFromId || defaultAccountId(finance) || ""} onChange={(e) => fin.updateCard(c.id, { payFromId: e.target.value })} style={{ ...inputStyle, flex: 1, padding: "6px 8px", fontSize: 14 }}>
                {liveAccounts(finance).map((a) => <option key={a.id} value={a.id}>{a.name}</option>)}
              </select>
            </div>

            <div style={{ marginTop: 10 }}>
              {open.filter((i) => i.closed).map((i) => {
                const pk = `${c.id}|${i.key}`;
                const pv = parseMoney(partVal);
                const rest = pv >= 0 && pv < i.total ? round2(i.total - pv) : null;
                return (
                  <div key={i.key} style={{ padding: "6px 0", borderBottom: `1px solid ${T.border}55` }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                      <span style={{ flex: 1, fontSize: 14, color: i.overdue ? T.danger : T.text }}>
                        Fatura de {monthShort(i.key)} <span style={{ fontSize: 12, color: i.overdue ? T.danger : T.muted }}>{i.overdue ? "atrasada" : `fechada, vence ${i.due.slice(8)}/${i.due.slice(5, 7)}`}</span>
                      </span>
                      <button onClick={() => fin.payInvoice(c.id, i.key, i.total, today)} style={{ ...btnPrimary, padding: "8px 12px", fontSize: 13 }}>Paguei {brl(i.total)}</button>
                    </div>
                    {partFor === pk ? (
                      <div style={{ display: "flex", gap: 8, marginTop: 6, alignItems: "center", flexWrap: "wrap" }}>
                        <input id={`part-${c.id}-${i.key}`} value={partVal} onChange={(e) => setPartVal(e.target.value)} inputMode="decimal" placeholder="Quanto pagou (R$)" style={{ ...inputStyle, flex: "1 1 130px", padding: "6px 8px" }} />
                        <button disabled={rest == null} onClick={() => { fin.payInvoice(c.id, i.key, i.total, today, pv); setPartFor(null); setPartVal(""); }} style={{ ...btnPrimary, padding: "6px 10px", fontSize: 13, opacity: rest == null ? 0.5 : 1 }}>Confirmar</button>
                        {rest != null && <span style={{ fontSize: 12, color: T.danger, flexBasis: "100%" }}>{brl(rest)} vira rotativo na fatura de {monthShort(addMonthsKey(i.key, 1))}{c.rate ? `, com ${String(c.rate).replace(".", ",")}% de juros: ${brl(round2(rest * (1 + c.rate / 100)))}` : " (informe os juros do cartão)"}</span>}
                      </div>
                    ) : (
                      <div style={{ display: "flex", gap: 12, marginTop: 4 }}>
                        <button onClick={() => { setPartFor(pk); setPartVal(""); }} style={{ background: "none", border: "none", color: T.accentSoft, fontFamily: F.ui, fontSize: 12.5, cursor: "pointer", textDecoration: "underline", padding: 0 }}>Paguei só uma parte</button>
                        {i.overdue && <button onClick={() => fin.payInvoice(c.id, i.key, i.total, today, 0)} style={{ background: "none", border: "none", color: T.danger, fontFamily: F.ui, fontSize: 12.5, cursor: "pointer", textDecoration: "underline", padding: 0 }}>Não paguei: virou rotativo</button>}
                      </div>
                    )}
                  </div>
                );
              })}
              <div style={{ display: "grid", gridTemplateColumns: "repeat(3, minmax(0, 1fr))", gap: 6, marginTop: 8 }}>
                {nextKeys.map((k, n) => {
                  const inv = sm.invoices.find((i) => i.key === k);
                  return (
                    <div key={k} style={{ border: `1px solid ${n === 0 ? T.accent : T.border}`, padding: "6px 8px", minWidth: 0 }}>
                      <div style={{ fontSize: 12, color: T.muted }}>{n === 0 ? "Fatura aberta" : "Próxima"} · {monthShort(k)}</div>
                      <div style={{ fontSize: 15, fontWeight: 700, color: inv && inv.paid ? T.good : T.text, fontVariantNumeric: "tabular-nums", overflowWrap: "anywhere" }}>{brl(inv ? inv.total : 0)}</div>
                      {inv && inv.paid && <div style={{ fontSize: 11, color: T.good }}>paga</div>}
                      {inv && !inv.paid && inv.advanced > 0 && <div style={{ fontSize: 11, color: T.good }}>já pago {brl(inv.advanced)}</div>}
                    </div>
                  );
                })}
              </div>
              {(() => {
                const cur = sm.invoices.find((i) => i.key === sm.current);
                if (!cur || cur.paid || !(cur.total > 0)) return null;
                const av = parseMoney(advVal);
                return advFor === c.id ? (
                  <div style={{ display: "flex", gap: 8, marginTop: 8, alignItems: "center", flexWrap: "wrap" }}>
                    <input id={`adv-${c.id}`} value={advVal} onChange={(e) => setAdvVal(e.target.value)} inputMode="decimal" placeholder="Quanto pagou (R$)" style={{ ...inputStyle, flex: "1 1 130px", padding: "6px 8px" }} />
                    <button disabled={!(av > 0 && av <= cur.total)} onClick={() => { fin.payAdvance(c.id, cur.key, av, today); setAdvFor(null); setAdvVal(""); }} style={{ ...btnPrimary, padding: "6px 10px", fontSize: 13, opacity: av > 0 && av <= cur.total ? 1 : 0.5 }}>Confirmar</button>
                    <button onClick={() => setAdvFor(null)} style={{ background: "none", border: "none", color: T.muted, fontFamily: F.ui, fontSize: 12.5, cursor: "pointer", textDecoration: "underline" }}>cancelar</button>
                    {av > 0 && av <= cur.total && <span style={{ fontSize: 12, color: T.muted, flexBasis: "100%" }}>A fatura de {monthShort(cur.key)} cai para {brl(round2(cur.total - av))}.</span>}
                  </div>
                ) : (
                  <button onClick={() => { setAdvFor(c.id); setAdvVal(""); }} style={{ background: "none", border: "none", color: T.accentSoft, fontFamily: F.ui, fontSize: 12.5, cursor: "pointer", textDecoration: "underline", padding: 0, marginTop: 6 }}>Paguei antecipado (fatura aberta de {monthShort(cur.key)})</button>
                );
              })()}
            </div>
            <div style={{ display: "flex", justifyContent: "flex-end", marginTop: 8 }}>
              {armed === c.id ? (
                <button onClick={() => { fin.removeCard(c.id); setArmed(null); }} style={{ ...btnDanger, padding: "6px 10px" }}>remover cartão e compras</button>
              ) : (
                <button onClick={() => setArmed(c.id)} style={{ background: "none", border: "none", color: T.muted, fontFamily: F.ui, fontSize: 12, cursor: "pointer", textDecoration: "underline" }}>remover cartão</button>
              )}
            </div>
          </div>
        );
      })}
      {adding ? (
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          <input id="card-name" value={f.name} onChange={(e) => setF({ ...f, name: e.target.value })} placeholder="Nome (ex: Nubank)" style={inputStyle} />
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
            <input id="card-limit" value={f.limit} onChange={(e) => setF({ ...f, limit: e.target.value })} inputMode="decimal" placeholder="Limite (R$)" style={{ ...inputStyle, flex: "1 1 120px" }} />
            <input id="card-close" value={f.closeDay} onChange={(e) => setF({ ...f, closeDay: e.target.value.replace(/\D/g, "") })} inputMode="numeric" placeholder="Dia que fecha" style={{ ...inputStyle, flex: "1 1 100px" }} />
            <input id="card-due" value={f.dueDay} onChange={(e) => setF({ ...f, dueDay: e.target.value.replace(/\D/g, "") })} inputMode="numeric" placeholder="Dia que vence" style={{ ...inputStyle, flex: "1 1 100px" }} />
            <input id="card-rate" value={f.rate} onChange={(e) => setF({ ...f, rate: e.target.value })} inputMode="decimal" placeholder="Juros % ao mês (opcional)" style={{ ...inputStyle, flex: "1 1 160px" }} />
          </div>
          <div style={{ fontSize: 12, color: T.muted, lineHeight: 1.45 }}>Cheque especial: cadastre como cartão. Limite = limite do cheque; fechamento e vencimento = dia em que o banco cobra os juros.</div>
          <div style={{ display: "flex", gap: 8 }}>
            <button onClick={submit} style={{ ...btnPrimary, flex: 1 }}>Salvar cartão</button>
            <button onClick={() => { setAdding(false); setMsg(""); }} style={{ ...btnDanger, borderColor: T.muted, color: T.muted }}>Cancelar</button>
          </div>
        </div>
      ) : (
        <button onClick={() => setAdding(true)} style={{ ...btnPrimary, background: "transparent", border: `1px dashed ${T.border}`, color: T.text, boxShadow: "none", width: "100%" }}>+ Novo cartão</button>
      )}
      {msg && <div style={{ fontSize: 13, color: T.accentSoft, marginTop: 8 }}>{msg}</div>}
    </Section>
  );
}

/* ----- o que eu devo: tudo é cartão (o cheque especial também) ----- */
function OwePanel({ finance, today, fin }) {
  const cards = finance.cards || [];
  const legacy = (finance.debts || []).filter((d) => d.balance > 0);
  const saved = (finance.plan && finance.plan.debtBudget) || 0;
  const [budget, setBudget] = useState(saved ? String(saved).replace(".", ",") : "");
  if (!cards.length && !legacy.length) return null;
  const rows = cards.map((c) => {
    const sm = cardSummary(finance, c, today);
    const late = round2(sm.invoices.filter((i) => i.overdue).reduce((a, i) => a + i.total, 0));
    const old = round2(cardOldDebts(finance, c, today).reduce((a, g) => a + g.total, 0));
    return { c, owed: sm.used, late, old };
  }).filter((r) => r.owed > 0).sort((a, z) => (z.c.rate == null ? -1 : z.c.rate) - (a.c.rate == null ? -1 : a.c.rate));
  const total = round2(rows.reduce((a, r) => a + r.owed, 0) + legacy.reduce((a, d) => a + d.balance, 0));
  const b = parseMoney(budget);
  const sim = b > 0 && rows.length ? simulateCardDebt(finance, today, b) : null;
  const dueNow = round2(cards.reduce((a, c) => a + cardSummary(finance, c, today).invoices.filter((i) => !i.paid && i.key <= today.slice(0, 7)).reduce((t, i) => t + i.total, 0), 0));
  const noRate = rows.filter((r) => r.c.rate == null);
  return (
    <Section title="O que eu devo">
      <div style={{ textAlign: "center", marginBottom: 10 }}>
        <div style={{ fontFamily: F.display, fontSize: 40, lineHeight: 1.05, color: total > 0 ? T.danger : T.good, fontVariantNumeric: "tabular-nums" }}>{brl(total)}</div>
        <div style={{ fontSize: 12, color: T.muted }}>tudo que está no cartão: faturas, parcelas que faltam, dívida antiga e rotativo</div>
      </div>
      {rows.length > 0 && (
        <div style={{ marginBottom: 10 }}>
          <div style={{ fontSize: 12, fontWeight: 700, color: T.gold, letterSpacing: 0.4, marginBottom: 2 }}>ORDEM DE ATAQUE · JUROS MAIS CAROS PRIMEIRO</div>
          {rows.map((r, i) => (
            <div key={r.c.id} style={{ display: "flex", gap: 8, alignItems: "baseline", padding: "6px 0", borderTop: `1px solid ${T.border}55` }}>
              <span style={{ fontWeight: 700, color: i === 0 ? T.accent : T.muted, minWidth: 24 }}>{i + 1}º</span>
              <span style={{ flex: 1, minWidth: 0 }}>
                <span style={{ display: "block", fontSize: 15, color: T.text }}>💳 {r.c.name}</span>
                <span style={{ display: "block", fontSize: 12, color: r.c.rate == null ? T.gold : T.muted }}>
                  {r.c.rate == null ? "juros não informados" : `juros ${String(r.c.rate).replace(".", ",")}% ao mês`}{r.old > 0 ? ` · dívida antiga ${brl(r.old)}` : ""}{r.late > 0 ? ` · atrasado ${brl(r.late)}` : ""}
                </span>
              </span>
              <span style={{ fontWeight: 700, fontVariantNumeric: "tabular-nums", color: T.text }}>{brl(r.owed)}</span>
            </div>
          ))}
        </div>
      )}
      {noRate.length > 0 && <div style={{ fontSize: 13, color: T.gold, marginBottom: 10, lineHeight: 1.5 }}>Informe os juros ao mês de {noRate.map((r) => r.c.name).join(", ")} no cartão. Sem isso a ordem de ataque e a data de quitação ficam erradas.</div>}
      {rows.length > 0 && (
        <div data-pn="" style={{ border: `1px solid ${T.border}`, background: T.panel2, padding: "10px 12px" }}>
          <label htmlFor="owe-budget" style={{ fontSize: 13, color: T.text }}>Consigo pagar por mês nos cartões</label>
          <div style={{ display: "flex", gap: 8, marginTop: 6 }}>
            <input id="owe-budget" value={budget} onChange={(e) => setBudget(e.target.value)} onBlur={() => { const v = parseMoney(budget); if (v >= 0 && v !== saved) fin.setDebtBudget(v); }} inputMode="decimal" placeholder="R$ 0,00" style={{ ...inputStyle, flex: 1 }} />
          </div>
          {dueNow > 0 && <div style={{ fontSize: 12, color: T.muted, marginTop: 6 }}>Faturas deste mês e atrasadas: {brl(dueNow)}. Pagar menos que isso gera rotativo.</div>}
          {sim && !sim.stuck && (
            <div style={{ marginTop: 8 }}>
              <div style={{ fontSize: 13, color: T.muted }}>Livre de dívidas em</div>
              <div style={{ fontFamily: F.display, fontSize: 30, color: T.text, lineHeight: 1.1 }}>{monthLabel(sim.end)}</div>
              <div style={{ fontSize: 13, color: T.muted, marginTop: 2 }}>{sim.months} mês(es) · {brl(sim.interest)} de juros no caminho · sem compras novas no cartão</div>
            </div>
          )}
          {sim && sim.stuck && <div style={{ fontSize: 13, color: T.danger, marginTop: 8, lineHeight: 1.5 }}>Com {brl(b)} por mês a dívida não diminui: os juros comem o pagamento. Aumente o valor ou troque a dívida por uma mais barata.</div>}
          {!sim && <div style={{ fontSize: 12, color: T.muted, marginTop: 6 }}>Coloque o valor para ver quando você zera e quanto paga de juros.</div>}
        </div>
      )}
      {legacy.length > 0 && (
        <div style={{ marginTop: 12 }}>
          <div style={{ fontSize: 12, fontWeight: 700, color: T.gold, letterSpacing: 0.4, marginBottom: 4 }}>DÍVIDAS NO FORMATO ANTIGO</div>
          {legacy.map((d) => (
            <div key={d.id} style={{ display: "flex", gap: 8, alignItems: "center", padding: "6px 0", borderTop: `1px solid ${T.border}55` }}>
              <span style={{ flex: 1, fontSize: 14 }}>{d.name} <span style={{ fontSize: 12, color: T.muted }}>· {brl(d.balance)}</span></span>
              <button onClick={() => fin.convertDebt(d.id, today)} style={{ ...btnPrimary, padding: "7px 10px", fontSize: 13 }}>Converter em cartão</button>
            </div>
          ))}
        </div>
      )}
    </Section>
  );
}

/* dívida que já existia neste cartão: fatura parcelada / acordo, ou saldo devedor (rotativo, cheque especial usado) */
function OldDebtForm({ card, today, fin, onDone }) {
  const [mode, setMode] = useState("parcelado");
  const [a, setA] = useState("");
  const [n, setN] = useState("");
  const [note, setNote] = useState("");
  const [msg, setMsg] = useState("");
  const chip = (on) => ({ flex: 1, minHeight: 36, background: on ? T.panel : "transparent", border: `1px solid ${on ? T.accent : T.border}`, color: on ? T.text : T.muted, fontFamily: F.ui, fontSize: 13, fontWeight: 600, cursor: "pointer", padding: "4px 6px" });
  const v = parseMoney(a), k = parseInt(n, 10);
  const go = () => {
    if (!(v > 0)) { setMsg(mode === "parcelado" ? "Digite o valor da parcela." : "Digite o saldo devedor de hoje."); return; }
    if (mode === "parcelado" && !(k >= 1 && k <= 60)) { setMsg("Quantas parcelas faltam? (1 a 60)"); return; }
    fin.addOldDebt(card.id, mode === "parcelado" ? { mode, parcela: v, n: k, note: note.trim() } : { mode, saldo: v, note: note.trim() }, today);
    onDone();
  };
  return (
    <div style={{ border: `1px dashed ${T.border}`, padding: "8px 10px", marginTop: 8, display: "flex", flexDirection: "column", gap: 8 }}>
      <div style={{ display: "flex", gap: 6 }}>
        <button onClick={() => setMode("parcelado")} aria-pressed={mode === "parcelado"} style={chip(mode === "parcelado")}>Parcelada (fatura parcelada, acordo)</button>
        <button onClick={() => setMode("saldo")} aria-pressed={mode === "saldo"} style={chip(mode === "saldo")}>Saldo devedor (rotativo, cheque usado)</button>
      </div>
      <input id={`od-note-${card.id}`} value={note} onChange={(e) => setNote(e.target.value)} placeholder={mode === "parcelado" ? "Nome (ex: fatura de agosto parcelada)" : "Nome (ex: rotativo, cheque especial)"} style={inputStyle} />
      <div style={{ display: "flex", gap: 8 }}>
        <input id={`od-val-${card.id}`} value={a} onChange={(e) => setA(e.target.value)} inputMode="decimal" placeholder={mode === "parcelado" ? "Valor da parcela (R$)" : "Saldo para quitar hoje (R$)"} style={{ ...inputStyle, flex: 1 }} />
        {mode === "parcelado" && <input id={`od-n-${card.id}`} value={n} onChange={(e) => setN(e.target.value.replace(/\D/g, ""))} inputMode="numeric" placeholder="Faltam" style={{ ...inputStyle, flex: "0 0 90px" }} />}
      </div>
      {mode === "parcelado" && v > 0 && k > 0 && <div style={{ fontSize: 13, color: T.text }}>{k}x de {brl(v)} = {brl(round2(v * k))}, a partir da fatura de {monthLabel(invoiceFor(card, today)).toLowerCase()}</div>}
      {mode === "saldo" && <div style={{ fontSize: 12, color: T.muted, lineHeight: 1.45 }}>Entra na fatura aberta. O que você não pagar dela vira rotativo na próxima, com os juros do cartão.</div>}
      <div style={{ display: "flex", gap: 8 }}>
        <button onClick={go} style={{ ...btnPrimary, flex: 1 }}>Adicionar dívida</button>
        <button onClick={onDone} style={{ ...btnDanger, borderColor: T.muted, color: T.muted }}>Cancelar</button>
      </div>
      {msg && <div style={{ fontSize: 13, color: T.accentSoft }}>{msg}</div>}
    </div>
  );
}

/* ----- categorias ----- */
function CategoryManager({ finance, fin }) {
  const [open, setOpen] = useState(false);
  const [type, setType] = useState("out");
  const [name, setName] = useState("");
  const [icon, setIcon] = useState(CAT_ICONS_PICK[0]);
  const [group, setGroup] = useState("vida");
  const [msg, setMsg] = useState("");
  const [armed, setArmed] = useState(null);
  const cats = (finance.categories || []).filter((c) => !c.hidden && c.type === type);

  const submit = () => {
    const n = name.trim();
    if (!n) { setMsg("Dê um nome para a categoria."); return; }
    if ((finance.categories || []).some((c) => !c.hidden && c.type === type && c.name.toLowerCase() === n.toLowerCase())) { setMsg("Essa categoria já existe."); return; }
    fin.addCategory({ name: n, icon, group: type === "in" ? "entrada" : group, type });
    setName(""); setMsg(`Categoria ${n} criada.`);
  };

  return (
    <Section title="Categorias">
      <button onClick={() => setOpen(!open)} style={{ background: "none", border: "none", color: T.muted, fontFamily: F.ui, fontSize: 13, padding: 0, cursor: "pointer" }}>
        {open ? "▾ Fechar" : `▸ ${FIN_OUT.length} de saída · ${FIN_IN.length} de entrada. Toque para editar.`}
      </button>
      {open && (
        <div style={{ marginTop: 10 }}>
          <div style={{ display: "flex", gap: 6, marginBottom: 10 }}>
            {[["out", "Saídas"], ["in", "Entradas"]].map(([t, label]) => (
              <button key={t} onClick={() => setType(t)} aria-pressed={type === t}
                style={{ flex: 1, minHeight: 38, background: type === t ? T.panel2 : "transparent", border: `1px solid ${type === t ? T.accent : T.border}`, color: type === t ? T.text : T.muted, fontFamily: F.ui, fontWeight: 600, cursor: "pointer" }}>{label}</button>
            ))}
          </div>
          {cats.map((c) => (
            <div key={c.id} style={{ display: "flex", alignItems: "center", gap: 8, padding: "7px 0", borderBottom: `1px solid ${T.border}55` }}>
              <span style={{ fontSize: 18 }} aria-hidden="true">{c.icon}</span>
              <span style={{ flex: 1, fontSize: 14, color: T.text }}>{c.name}</span>
              {c.type === "out" && <span style={{ fontSize: 12, color: GROUPS[c.group] ? GROUPS[c.group].color : T.muted }}>{GROUPS[c.group] ? GROUPS[c.group].label : ""}</span>}
              {armed === c.id ? (
                <button onClick={() => { fin.hideCategory(c.id); setArmed(null); }} style={{ ...btnDanger, padding: "4px 8px", fontSize: 12 }}>remover</button>
              ) : (

/* ----- lançamentos do período (toque para editar) ----- */
function EntryList({ finance, period, fin }) {
  const [armed, setArmed] = useState(null);
  const [editId, setEditId] = useState(null);
  const [ef, setEf] = useState({});
  const [msg, setMsg] = useState("");
  const range = periodRange(period.unit, period.anchor);
  const accounts = liveAccounts(finance);
  const cardName = (id) => { const c = (finance.cards || []).find((x) => x.id === id); return c ? c.name : "cartão"; };
  const list = finance.entries.filter((e) => e.date >= range.start && e.date <= range.end)
    .sort((a, b) => (a.date === b.date ? b.id - a.id : a.date < b.date ? 1 : -1));

  /* o que pode mudar em cada tipo de lançamento sem bagunçar saldo, fatura ou dívida */
  const rules = (e) => {
    const isTr = e.type === "transfer";
    const installment = !!(e.purchaseId && e.inst);
    const owed = !!(e.oldDebt || e.carry);
    return {
      date: !installment && !e.cardPayment && !owed,
      amount: !e.debtId && !e.cardPayment && !installment && !e.recId && !owed,
      cat: !isTr && !e.cardPayment,
      account: !isTr && !e.cardId,
    };
  };
  const open = (e) => {
    setEditId(editId === e.id ? null : e.id);
    setArmed(null); setMsg("");
    setEf({ date: e.date, amount: String(e.amount).replace(".", ","), cat: e.cat, note: e.note || "", accountId: e.accountId || "" });
  };
  const save = (e) => {
    const r = rules(e);
    const patch = { note: ef.note.trim() };
    if (r.date) { if (!/^\d{4}-\d{2}-\d{2}$/.test(ef.date)) { setMsg("Escolha uma data válida."); return; } patch.date = ef.date; }
    if (r.amount) { const v = parseMoney(ef.amount); if (!(v > 0)) { setMsg("Valor inválido."); return; } patch.amount = v; }
    if (r.cat) patch.cat = ef.cat;
    if (r.account && ef.accountId) patch.accountId = ef.accountId;
    fin.updateEntry(e.id, patch);
    setEditId(null); setMsg("Lançamento atualizado.");
  };

  return (
    <Section title={`Lançamentos · ${range.label}`}>
      <div style={{ fontSize: 12, color: T.muted, marginBottom: 4 }}>Toque num lançamento para corrigir data, valor, categoria ou nota.</div>
      {list.length === 0 && <Empty text="Nenhum lançamento neste período." />}
      {list.map((e) => {
        const isTr = e.type === "transfer";
        const needsAcc = !isTr && !e.accountId && !(e.cardId && !e.cardPayment);
        const meta = [
          e.note,
          isTr ? `${accountName(finance, e.fromId)} → ${accountName(finance, e.toId)}` : null,
          !isTr && e.accountId ? accountName(finance, e.accountId) : null,
          e.cardId && !e.cardPayment ? `💳 ${cardName(e.cardId)}${e.inst ? ` · parcela ${e.inst}` : ""}` : null,
          e.cardPayment ? "não conta como gasto: as compras já contaram" : null,
          e.oldDebt || e.carry ? "dívida no cartão: não conta como gasto novo" : null,
        ].filter(Boolean).join(" · ");
        const r = rules(e);
        const cats = e.type === "in" ? FIN_IN : FIN_OUT;
        return (
          <div key={e.id} style={{ borderBottom: `1px solid ${T.border}55` }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8, padding: "9px 0", flexWrap: "wrap" }}>
              <button onClick={() => open(e)} aria-expanded={editId === e.id}
                style={{ flex: "1 1 160px", minWidth: 0, display: "flex", alignItems: "center", gap: 8, background: "none", border: "none", padding: 0, cursor: "pointer", textAlign: "left", fontFamily: F.ui, color: T.text }}>
                <span style={{ fontSize: 12, color: T.muted, minWidth: 40, fontVariantNumeric: "tabular-nums" }}>{e.date.slice(8)}/{e.date.slice(5, 7)}</span>
                <span style={{ flex: 1, minWidth: 0 }}>
                  <span style={{ display: "block", fontSize: 14 }}>{isTr ? "↔ Transferência" : `${CAT_ICON[e.cat] || "•"} ${e.cat}`}</span>
                  {meta && <span style={{ display: "block", fontSize: 12, color: T.muted, overflowWrap: "anywhere" }}>{meta}</span>}
                </span>
                <span style={{ fontSize: 15, fontWeight: 700, color: e.type === "in" ? T.good : e.cardPayment || isTr ? T.muted : T.text, fontVariantNumeric: "tabular-nums" }}>
                  {e.type === "in" ? "+" : isTr ? "" : "−"}{brl(e.amount)}
                </span>
              </button>
              {armed === e.id ? (
                <button onClick={() => { fin.removeEntry(e.id); setArmed(null); setEditId(null); }} style={{ ...btnDanger, padding: "6px 8px", fontSize: 12 }}>{e.purchaseId && e.inst ? "apagar compra" : "apagar"}</button>
              ) : (
                <button aria-label="Apagar lançamento" onClick={() => setArmed(e.id)} style={{ background: "none", border: "none", color: T.muted, fontSize: 15, cursor: "pointer", padding: 8 }}>✕</button>
              )}
            </div>
            {needsAcc && editId !== e.id && (
              <select aria-label="Atribuir conta" value="" onChange={(ev) => ev.target.value && fin.setEntryAccount(e.id, ev.target.value)} style={{ ...inputStyle, margin: "0 0 8px 48px", padding: "4px 6px", fontSize: 12, width: "auto" }}>
                <option value="">sem conta · atribuir…</option>
                {accounts.map((a) => <option key={a.id} value={a.id}>{a.name}</option>)}
              </select>
            )}
            {editId === e.id && (
              <div style={{ display: "flex", flexDirection: "column", gap: 8, padding: "0 0 12px" }}>
                <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                  {r.date && <input id={`ed-date-${e.id}`} type="date" value={ef.date} onChange={(ev) => setEf({ ...ef, date: ev.target.value })} style={{ ...inputStyle, flex: "1 1 150px", colorScheme: T.light ? "light" : "dark" }} />}
                  {r.amount && <input id={`ed-amount-${e.id}`} value={ef.amount} onChange={(ev) => setEf({ ...ef, amount: ev.target.value })} inputMode="decimal" style={{ ...inputStyle, flex: "1 1 110px" }} />}
                </div>
                {r.cat && (
                  <select id={`ed-cat-${e.id}`} value={ef.cat} onChange={(ev) => setEf({ ...ef, cat: ev.target.value })} style={inputStyle}>
                    {[...new Set([ef.cat, ...cats])].map((c) => <option key={c} value={c}>{CAT_ICON[c] || "•"} {c}</option>)}
                  </select>
                )}
                {r.account && (
                  <select id={`ed-acc-${e.id}`} value={ef.accountId} onChange={(ev) => setEf({ ...ef, accountId: ev.target.value })} style={inputStyle}>
                    {!ef.accountId && <option value="">Sem conta</option>}
                    {accounts.map((a) => <option key={a.id} value={a.id}>{a.name}</option>)}
                  </select>
                )}
                <input id={`ed-note-${e.id}`} value={ef.note} onChange={(ev) => setEf({ ...ef, note: ev.target.value })} placeholder="Nota" maxLength={60} style={inputStyle} />
                {!r.date && <div style={{ fontSize: 12, color: T.muted }}>Parcela de cartão e pagamento de fatura não mudam de data. Para refazer, apague e lance de novo.</div>}
                <div style={{ display: "flex", gap: 8 }}>
                  <button onClick={() => save(e)} style={{ ...btnPrimary, flex: 1 }}>Salvar</button>
                  <button onClick={() => setEditId(null)} style={{ ...btnDanger, borderColor: T.muted, color: T.muted }}>Cancelar</button>
                </div>
              </div>
            )}
          </div>
        );
      })}
      {msg && <div style={{ fontSize: 13, color: T.accentSoft, marginTop: 8 }}>{msg}</div>}
    </Section>
  );
}

/* ==================== DIÁRIO: prazo diário ==================== */
const DIARY_PENALTY = 5;       /* XP por hora de atraso */
const DIARY_CAP_HOURS = 8;     /* teto: 8 horas = −40 XP por atraso */
const DIARY_DEADLINES = ["20:00", "21:00", "22:00", "23:00", "23:59"];
function deadlineFor(dayStr, hhmm) {
  const [h, m] = hhmm.split(":").map(Number);
  const d = parseKey(dayStr);
  d.setHours(h, m, 0, 0);
  return d.getTime();
}
/* prazo fixo: todo dia, a página do dia precisa estar escrita até o horário escolhido */
function diaryStatus(s, now) {
  const hhmm = (s.diary && s.diary.deadline) || "23:59";
  const journal = s.journal || {};
  const has = (k) => pageOk(journal[k]);
  const today = dayKey(new Date(now));
  const todayDl = deadlineFor(today, hhmm);
  const writtenToday = has(today);
  const pastToday = now > todayDl;
  const nextDl = writtenToday || pastToday ? deadlineFor(addDays(today, 1), hhmm) : todayDl;
  const lastDay = pastToday ? today : addDays(today, -1);
  const lastDl = deadlineFor(lastDay, hhmm);
  const startAt = (s.diary && s.diary.startAt) || now;
  let late = false, lateHours = 0;
  if (lastDl > startAt && !has(lastDay)) {
    const wroteAfter = Object.values(journal).some((e) => pageOk(e) && e.updatedAt > lastDl);
    if (!wroteAfter) { late = true; lateHours = Math.floor((now - lastDl) / 3600000); }
  }
  const charged = ((s.diary && s.diary.charged) || {})[lastDl] || 0;
  /* antes do Dia 1 o diário não cobra: o selo do livro mostra a data de início, sem pressa */
  const notStarted = startAt > now;
  return { hhmm, nextDl, lastDl, writtenToday, late, lateHours, charged, msLeft: nextDl - now, notStarted, startKey: notStarted ? dayKey(new Date(startAt)) : null };
}
/* dívidas do diário: cada prazo perdido desde o início, até 30 dias para trás.
   A cobrança de um dia para quando você volta a escrever qualquer página depois do prazo. */
function diaryDebts(s, now) {
  const hhmm = (s.diary && s.diary.deadline) || "23:59";
  const journal = s.journal || {};
  const startAt = (s.diary && s.diary.startAt) || now;
  const charged = (s.diary && s.diary.charged) || {};
  const firstAt = (e) => e.createdAt || e.updatedAt || 0;
  const written = Object.values(journal).filter((e) => pageOk(e));
  const today = dayKey(new Date(now));
  const lastDay = now > deadlineFor(today, hhmm) ? today : addDays(today, -1);
  const out = [];
  for (let i = 0; i < 30; i++) {
    const d = addDays(lastDay, -i);
    const dl = deadlineFor(d, hhmm);
    if (dl <= startAt) break;
    const e = journal[d];
    if (pageOk(e) && firstAt(e) <= dl) continue; /* escrito no prazo */
    let stopAt = now;
    written.forEach((x) => { const t = firstAt(x); if (t > dl && t < stopAt) stopAt = t; });
    const due = Math.min(DIARY_CAP_HOURS, Math.max(0, Math.floor((stopAt - dl) / 3600000)));
    const prev = charged[dl] || 0;
    if (due > prev) out.push({ dl, day: d, due, delta: due - prev });
  }
  return out;
}
const fmtLeft = (ms) => {
  const m = Math.max(0, Math.floor(ms / 60000));
  const h = Math.floor(m / 60);
  return h >= 1 ? `${h}h${String(m % 60).padStart(2, "0")}` : `${m}min`;
};

/* ==================== PERGAMINHO NEGRO ==================== */
async function scrollHash(pin) {
  try {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(`rb-scroll:${pin}`));
    return Array.from(new Uint8Array(buf)).map((x) => x.toString(16).padStart(2, "0")).join("");
  } catch (e) { return `plain:${pin}`; }
}

/* ==================== A ROTA SOMBRIA (topo do Pergaminho Negro) ==================== */
/* selos de NoFap: cada selo rompido na sequência atual dá direito a acender uma ambição da névoa */
const DARK_SEALS = [3, 7, 14, 21, 30, 45, 60, 90];
const AMB_COINS = 60;
/* ambição antiga (sem o campo lit) conta como acesa: ninguém perde chama na atualização */
const ambLit = (e) => e.kind === "ambicao" && e.status !== "realizada" && e.lit !== false;
const ambFog = (e) => e.kind === "ambicao" && e.status !== "realizada" && e.lit === false;
const ambGold = (e) => e.kind === "ambicao" && e.status === "realizada";
function darkPath(sc, nfDays, nofap) {
  const reached = DARK_SEALS.filter((d) => d <= nfDays).length;
  const startMs = Math.max(nofap && nofap.start ? new Date(`${nofap.start}T00:00:00`).getTime() : 0, (nofap && nofap.lastRelapseAt) || 0);
  /* acesas nesta sequência (inclusive as já consumadas): impede acender e consumar sem fim no mesmo selo */
  const used = (sc.entries || []).filter((e) => e.kind === "ambicao" && e.litAt && e.litAt >= startMs).length;
  return { reached, used, free: nfDays > 0 ? Math.max(0, reached - used) : 0, next: DARK_SEALS.find((d) => d > nfDays) || null };
}
const ROTA_POS = [[132, 420], [160, 384], [252, 352], [262, 300], [196, 254], [118, 222], [114, 180], [176, 146]];
const ROTA_CSS = `

  const sel = open && open.startsWith("a:") ? ents.find((e) => String(e.id) === open.slice(2)) : null;

  const close = () => { setOpen(null); setProof(""); };
  const small = { background: "none", border: "1px solid #5a2a2c", color: ink, fontFamily: F.ui, fontSize: 13, padding: "9px 10px", cursor: "pointer" };

  else if (open === "altar") sheet = { kicker: "ALTAR · CONSUMADAS", color: "#f0c060", title: gold.length ? `${gold.length} consumada(s)` : "Nenhuma ainda",
