<style>
  :root { color-scheme: dark; }
  html, body { margin:0; padding:0; background:#0b0507; color:#f6e7e9; font-family:'Barlow Semi Condensed', 'Arial Narrow', system-ui, sans-serif; font-size:15px; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid #f87171; outline-offset: 2px; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  input, select, button { font-family: inherit; }
  .cx-rise{animation:cxRise .5s cubic-bezier(.2,.8,.2,1) both}
  .cx-fill{transform-origin:left;animation:cxFill 1.1s cubic-bezier(.2,.8,.2,1) both}
  .cx-pulse{animation:cxPulse 2.2s ease-in-out infinite}
  .cx-breath{animation:cxRise .5s cubic-bezier(.2,.8,.2,1) both,cxBreath 3.4s ease-in-out .5s infinite}
  .cx-flow{animation:cxFlow 3.2s linear infinite}
  .cx-draw{stroke-dasharray:1000;stroke-dashoffset:1000;animation:cxDraw 1.8s .25s cubic-bezier(.3,.7,.2,1) forwards}
  .cx-hit{animation:cxHit .5s 1s both}
  .cx-band{animation:cxBand 3s ease-in-out infinite}
  @keyframes cxRise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes cxFill{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @keyframes cxPulse{0%,100%{opacity:1}50%{opacity:.5}}
  @keyframes cxBreath{0%,100%{box-shadow:0 0 18px rgba(60,160,255,.16),inset 0 0 26px rgba(40,120,220,.09)}50%{box-shadow:0 0 34px rgba(60,160,255,.38),inset 0 0 30px rgba(40,120,220,.18)}}
  @keyframes cxFlow{0%{top:0;opacity:0}10%{opacity:1}90%{opacity:1}100%{top:calc(100% - 6px);opacity:0}}
  @keyframes cxDraw{to{stroke-dashoffset:0}}
  @keyframes cxHit{0%,100%{transform:none}20%{transform:translateX(-3px)}40%{transform:translateX(3px)}60%{transform:translateX(-2px)}}
  @keyframes cxBand{0%,100%{opacity:.25}50%{opacity:.45}}
  .ts-in{animation:tsIn .8s ease-out both}
  @keyframes tsIn{from{opacity:0}to{opacity:1}}
  @media (prefers-reduced-motion: reduce){.cx-rise,.cx-fill,.cx-pulse,.cx-breath,.cx-flow,.cx-hit,.cx-band,.ts-in{animation:none!important}.cx-draw{animation:none!important;stroke-dashoffset:0}}

function questProgress(s, today) {
  const q = s.classQuest;
  if (!q) return null;
  const elapsed = Math.max(0, daysBetween(q.start, today)) + 1;
  const windowEnd = addDays(q.start, QUEST_DAYS - 1);
  const has = (k) => pageOk(s.journal && s.journal[k]);
  let diaryDays = 0, missed = null;
  for (let i = 0; i < QUEST_DAYS; i++) {
    const d = addDays(q.start, i);
    if (d > today) break;
    if (has(d)) diaryDays++;
    else if (d < today && !missed) missed = d;
  }
  const relapsedDuring = !!(s.nofap && s.nofap.lastRelapseAt && q.startedAt && s.nofap.lastRelapseAt > q.startedAt);
  const nofapOk = !!(s.nofap && s.nofap.active && s.nofap.start && s.nofap.start <= q.start) && !relapsedDuring;
  const weeks = q.weeks || [];
  const weeksWon = weeks.filter((w) => w.won).length;
  let failed = null;
  if (!nofapOk) failed = "recaída no NoFap";
  else if (missed) failed = `dia sem diário (${Number(missed.slice(8))}/${missed.slice(5, 7)})`;
  else if (weeks.some((w) => !w.won)) failed = "semana abaixo da linha";
  const daysDone = today > windowEnd;
  const passed = !failed && daysDone && diaryDays >= QUEST_DAYS && weeksWon >= 2;
  return { day: Math.min(QUEST_DAYS, elapsed), diaryDays, nofapDays: nofapOk ? Math.min(QUEST_DAYS, elapsed) : 0, weeksWon, failed, passed, waitingWeek: !failed && daysDone && weeksWon < 2 };

const costToNext = (lvl) => 100 + 60 * lvl;
function levelFromXP(xp) {
  let lvl = 0, acc = 0;
  while (xp >= acc + costToNext(lvl)) { acc += costToNext(lvl); lvl++; }
  return { lvl, into: xp - acc, need: costToNext(lvl), base: acc };
}

  const paid = card.paid || {};
  const totals = {}, advanced = {};
  purchases.forEach((e) => { totals[e.invoice] = round2((totals[e.invoice] || 0) + e.amount); });
  /* pagamento antecipado: abate a fatura ainda aberta (pode ser em partes, antes de fechar) */
  fin.entries.filter((e) => e.cardId === card.id && e.cardPayment && e.advance).forEach((e) => {
    advanced[e.invoice] = round2((advanced[e.invoice] || 0) + e.amount);
    totals[e.invoice] = round2((totals[e.invoice] || 0) - e.amount);
  });
  const current = invoiceFor(card, todayKey);
  const invoices = Object.keys(totals).sort().map((k) => {
    const closed = invoiceCloseDate(card, k) <= todayKey;
    const due = invoiceDueDate(card, k);
    const isPaid = paid[k] != null;
    return { key: k, total: Math.max(0, totals[k]), advanced: advanced[k] || 0, closed, due, paid: isPaid, overdue: !isPaid && due < todayKey && totals[k] > 0 };
  });
  const used = round2(invoices.filter((i) => !i.paid).reduce((a, i) => a + i.total, 0));
  return { current, invoices, used, available: round2((card.limit || 0) - used) };
}

/* todos os cartões juntos: o que pagar agora, o que está acumulando, o futuro parcelado e o limite */
function cardsOverview(fin, todayKey) {
  const cards = fin.cards || [];
  let payNow = 0, openNow = 0, used = 0, limit = 0;
  const future = {}, dues = [], late = [];
  cards.forEach((c) => {
    const sm = cardSummary(fin, c, todayKey);
    used = round2(used + sm.used);
    limit = round2(limit + (c.limit || 0));
    sm.invoices.filter((i) => !i.paid && i.total > 0).forEach((i) => {
      if (i.closed) payNow = round2(payNow + i.total);
      if (i.key === sm.current) openNow = round2(openNow + i.total);
      if (i.key > sm.current) future[i.key] = round2((future[i.key] || 0) + i.total);
      if (i.overdue) late.push({ card: c.name, key: i.key, total: i.total });
      if (i.closed || i.key === sm.current) dues.push({ card: c.name, due: i.due, total: i.total, closed: i.closed, overdue: i.overdue });
    });
  });
  dues.sort((a, b) => (a.due < b.due ? -1 : 1));
  const fut = Object.keys(future).sort().slice(0, 3).map((k) => ({ key: k, total: future[k] }));
  return { count: cards.length, payNow, openNow, used, limit, pct: limit ? Math.min(100, Math.round((used / limit) * 100)) : 0, future: fut, futureTotal: round2(Object.values(future).reduce((a, v) => a + v, 0)), dues: dues.slice(0, 3), late };
}

/* dívida que já existia no cartão (fatura parcelada, saldo devedor, cheque especial): entra nas faturas, não é gasto novo */
function oldDebtEntries(card, todayKey, o, baseId) {
  const first = invoiceFor(card, todayKey);
  if (o.mode === "saldo") return [{ id: baseId, type: "out", amount: round2(o.saldo), cat: "Dívida", note: o.note || "Saldo devedor", date: todayKey, cardId: card.id, purchaseId: baseId, invoice: first, oldDebt: true }];
  const n = Math.max(1, Math.min(60, o.n || 1));
  const out = [];
  for (let k = 0; k < n; k++) {
    const amount = o.total && k === n - 1 ? round2(o.total - o.parcela * (n - 1)) : round2(o.parcela);
    out.push({ id: k === 0 ? baseId : baseId + k, type: "out", amount, cat: "Dívida", note: o.note || "Fatura parcelada", date: shiftDateMonths(todayKey, k), cardId: card.id, purchaseId: baseId, invoice: addMonthsKey(first, k), inst: n > 1 ? `${k + 1}/${n}` : undefined, oldDebt: true });
  }
  return out;
}
/* quanto falta de cada dívida antiga do cartão (só faturas ainda não pagas) */
function cardOldDebts(fin, card, todayKey) {
  const paid = card.paid || {};
  const groups = {};
  fin.entries.filter((e) => e.cardId === card.id && (e.oldDebt || e.carry)).forEach((e) => {
    if (paid[e.invoice] != null) return;
    const k = e.purchaseId || e.id;
    const g = groups[k] || (groups[k] = { id: k, firstId: e.id, note: e.note, carry: !!e.carry, left: 0, total: 0, parcela: e.amount, last: e.invoice });
    g.left += 1; g.total = round2(g.total + e.amount);
    if (e.invoice > g.last) g.last = e.invoice;
  });
  return Object.values(groups);
}
/* plano de quitação: todo mês o que você consegue pagar vai primeiro para o cartão de juros mais altos;
   o que não couber em uma fatura vira rotativo na próxima, com os juros do cartão (sem compras novas) */
function simulateCardDebt(fin, todayKey, budget) {
  const start = todayKey.slice(0, 7);
  const cs = (fin.cards || []).map((c) => {
    const inv = {};
    cardSummary(fin, c, todayKey).invoices.filter((i) => !i.paid && i.total > 0).forEach((i) => { const k = i.key < start ? start : i.key; inv[k] = round2((inv[k] || 0) + i.total); });
    return { r: Math.max(0, (c.rate || 0) / 100), inv, carry: 0, last: Object.keys(inv).sort().pop() || "" };
  }).filter((c) => c.last);
  if (!cs.length) return { months: 0, interest: 0, end: start };
  if (!(budget > 0)) return { stuck: true };
  const lastKey = cs.map((c) => c.last).sort().pop();
  let key = start, months = 0, interest = 0, prevCarry = Infinity;
  for (;;) {
    months++;
    if (months > 240) return { stuck: true };
    cs.forEach((c) => { c.due = round2(c.carry + (c.inv[key] || 0)); });
    let b = budget;
    [...cs].sort((a, z) => z.r - a.r).forEach((c) => { const p = Math.min(c.due, b); c.due = round2(c.due - p); b = round2(b - p); });
    cs.forEach((c) => { const i = round2(c.due * c.r); interest += i; c.carry = round2(c.due + i); });
    const carry = cs.reduce((a, c) => a + c.carry, 0);
    if (key >= lastKey && carry <= 0.005) break;
    if (key >= lastKey) { if (carry >= prevCarry - 0.005) return { stuck: true }; prevCarry = carry; }
    key = addMonthsKey(key, 1);
  }
  return { months, interest: round2(interest), end: key };
}

/* livre para gastar = renda − contas fixas − dívidas no cartão do mês − reserva − gastos do dia a dia */
function monthPlan(fin, monthKey, todayKey) {
  const entries = fin.entries.filter((e) => e.date.slice(0, 7) === monthKey);
  const income = (fin.plan && fin.plan.income) || 0;
  const fixed = (fin.recurring || []).filter((r) => r.type === "out").reduce((a, r) => a + r.amount, 0);
  const legacyMin = (fin.debts || []).filter((d) => d.balance > 0).reduce((a, d) => a + (d.payment || 0), 0);
  const cardOld = fin.entries.filter((e) => (e.oldDebt || e.carry) && e.invoice === monthKey).reduce((a, e) => a + e.amount, 0);
  const debtMin = round2(legacyMin + cardOld);
  const save = (fin.plan && fin.plan.reserveMonthly) || 0;
  const variable = sum(entries.filter(isVariableOut));
  const free = round2(income - fixed - debtMin - save - variable);
  const last = daysIn(monthKey);
  const isCur = todayKey.slice(0, 7) === monthKey;
  const day = Number(todayKey.slice(8));
  const daysLeft = isCur ? last - day + 1 : 0;
  let vsLast = null;
  if (isCur) {
    const pk = addMonthsKey(monthKey, -1);
    const prev = sum(fin.entries.filter((e) => isVariableOut(e) && e.date.slice(0, 7) === pk && Number(e.date.slice(8)) <= day));
    const now = sum(entries.filter((e) => isVariableOut(e) && Number(e.date.slice(8)) <= day));
    if (prev > 0) vsLast = Math.round((now / prev - 1) * 100);
  }
  return { income, fixed, debtMin, save, variable, free, daysLeft, vsLast };
}

function financeMetrics(fin, monthKey) {
  const inMonth = (k) => fin.entries.filter((e) => e.date.slice(0, 7) === k);
  const entries = inMonth(monthKey);
  const totalIn = sum(entries.filter((e) => e.type === "in"));
  const totalOut = sum(entries.filter(isSpend));
  const lifeOf = (list) => sum(list.filter((e) => isSpend(e) && CAT_GROUP[e.cat] === "vida"));
  const life = lifeOf(entries);
  const past = [1, 2, 3].map((n) => lifeOf(inMonth(addMonthsKey(monthKey, -n)))).filter((v) => v > 0);
  const lifeAvg = past.length ? round2(past.reduce((a, v) => a + v, 0) / past.length) : null;
  const incomeBase = totalIn > 0 ? totalIn : (fin.plan && fin.plan.income) || 0;
  const debtPaid = sum(entries.filter((e) => isSpend(e) && CAT_GROUP[e.cat] === "divida"));
  const debtPct = incomeBase > 0 ? Math.round((debtPaid / incomeBase) * 100) : null;
  const cost = lifeAvg || life;
  const reserveMonths = cost > 0 ? reserveSaved(fin) / cost : null;
  return { totalIn, totalOut, net: round2(totalIn - totalOut), life: round2(life), lifeAvg, debtPct, reserveMonths };
}

function recurringStatus(fin, monthKey, todayKey) {
  const last = daysIn(monthKey);
  const curMonth = todayKey.slice(0, 7);
  const dToday = Number(todayKey.slice(8));
  return (fin.recurring || []).map((r) => {
    const due = Math.min(r.day, last);
    const entry = fin.entries.find((e) => e.recId === r.id && e.recMonth === monthKey);
    const done = !!entry;
    const overdue = !done && (monthKey < curMonth || (monthKey === curMonth && due < dToday));
    return { ...r, due, done, paidAmount: entry ? entry.amount : 0, overdue };
  }).sort((a, b) => a.due - b.due);
}

/* dias seguidos com algum registro (lançamento ou "não gastei") */
function logStreak(fin, todayKey) {
  const set = new Set([...fin.entries.filter((e) => !e.oldDebt && !e.carry && !e.imported && (!e.cardId || e.inst === undefined || String(e.inst).startsWith("1/"))).map((e) => e.date), ...(fin.noSpend || [])]);
  let k = set.has(todayKey) ? todayKey : addDays(todayKey, -1);
  let n = 0;
  while (set.has(k) && n < 3650) { n++; k = addDays(k, -1); }
  return n;
}

/* simula mês a mês: parcelas mínimas e o que sobrar vai para os juros mais altos (avalanche);
   quando uma dívida acaba, a parcela dela passa para a próxima */
function simulateDebts(debts, extra) {
  const ds = debts.filter((d) => d.balance > 0).map((d) => ({ id: d.id, bal: d.balance, r: (d.rate || 0) / 100, pmt: d.payment || 0 }));
  if (!ds.length) return { months: 0, interest: 0, perDebt: {} };
  const budget0 = ds.reduce((a, d) => a + d.pmt, 0) + (extra || 0);
  if (budget0 <= 0) return { stuck: true };
  let month = 0, interest = 0;
  const perDebt = {};
  while (ds.some((d) => d.bal > 0.005)) {
    month++;
    if (month > 600) return { stuck: true };
    ds.forEach((d) => { if (d.bal > 0.005) { const i = d.bal * d.r; d.bal += i; interest += i; } });
    let budget = budget0;
    ds.forEach((d) => { if (d.bal > 0.005) { const p = Math.min(d.pmt, d.bal, budget); d.bal -= p; budget -= p; } });
    ds.filter((d) => d.bal > 0.005).sort((a, b) => b.r - a.r).forEach((d) => { const p = Math.min(d.bal, budget); d.bal -= p; budget -= p; });
    ds.forEach((d) => { if (d.bal <= 0.005 && !perDebt[d.id]) perDebt[d.id] = month; });
  }
  return { months: month, interest: round2(interest), perDebt };
}

function migrateShop(shop) {
  let out = (shop || []).map((it) => ({
    icon: it.icon || (it.rarity === "Lendário" ? "📜" : "📦"),
    ...it,
    effect: it.effect || it.title,
    rarity: it.rarity || (it.price >= 500 ? "Lendário" : "Raro"),
  }));
  if ((shop || []).length && (shop || []).every((it) => !it.icon)) {
    const have = new Set(out.map((i) => i.id));
    initialState().shop.forEach((ex) => { if (!have.has(ex.id)) out.push(ex); });
  }
  return out;
}

function normalizeState(p) {
  p = migrateAttrsState(p);
  const base = initialState();
  const s = {
    ...base,
    ...p,
    heroName: p.heroName || "",
    deadline: p.deadline || DEFAULT_DEADLINE,
    attrs: CORE_ATTRS.reduce((o, a) => ({ ...o, [a]: Number((p.attrs || {})[a]) || 0 }), {}),
    attrsV2: true,
    attrsV3: true,
    attrLog: (() => {
      const lg = p.attrLog && typeof p.attrLog === "object" ? p.attrLog : {};
      if (lg.__sub) return lg;
      /* antes dos sub-atributos: tudo o que já existia vai para "geral" */
      const sub = {};
      CORE_ATTRS.forEach((a) => { const v = Number((p.attrs || {})[a]) || 0; if (v > 0) sub[a] = { geral: v }; });
      return { ...lg, __sub: sub };
    })(),
    leafLog: Array.isArray(p.leafLog) ? p.leafLog : [],
    routeLog: Array.isArray(p.routeLog) ? p.routeLog : [],
    drySubs: Array.isArray(p.drySubs) ? p.drySubs : [],
    scroll: { pinHash: null, noPin: false, unlockDays: 14, entries: [], ...((p.scroll && typeof p.scroll === "object") ? p.scroll : {}) },
    agenda: fixAgendaRepeat(migrateAgendaMins(agendaToV2(p.agenda && typeof p.agenda === "object" ? p.agenda : newAgenda()), p.fixedWeek)),
    skills: p.skills && typeof p.skills === "object" ? p.skills : {},
    perkUse: p.perkUse && typeof p.perkUse === "object" ? p.perkUse : {},
    nofap: { ...base.nofap, ...(p.nofap || {}) },
    stats: { ...base.stats, ...(p.stats || {}) },
    fixedWeek: p.fixedWeek && Array.isArray(p.fixedWeek.items) ? p.fixedWeek : base.fixedWeek,
    finance: {
      entries: p.finance && Array.isArray(p.finance.entries) ? p.finance.entries : [],
      debts: p.finance && Array.isArray(p.finance.debts) ? p.finance.debts : [],
      recurring: p.finance && Array.isArray(p.finance.recurring) ? p.finance.recurring : [],
      cards: p.finance && Array.isArray(p.finance.cards) ? p.finance.cards : [],
      accounts: p.finance && Array.isArray(p.finance.accounts) ? p.finance.accounts : base.finance.accounts,
      lastAccountId: (p.finance && p.finance.lastAccountId) || null,
      categories: p.finance && Array.isArray(p.finance.categories) && p.finance.categories.length ? p.finance.categories : base.finance.categories,
      noSpend: p.finance && Array.isArray(p.finance.noSpend) ? p.finance.noSpend : [],
      plan: { ...base.finance.plan, ...((p.finance && p.finance.plan) || {}) },
      reserve: { ...base.finance.reserve, ...((p.finance && p.finance.reserve) || {}) },
      cmd: { ...((p.finance && p.finance.cmd && typeof p.finance.cmd === "object") ? p.finance.cmd : {}) },
    },
    shop: migrateShop(p.shop && p.shop.length ? p.shop : base.shop),
    weeklies: Array.isArray(p.weeklies) ? p.weeklies : [],
    weekPlan: Array.isArray(p.weekPlan) ? p.weekPlan.filter((g) => g && typeof g.week === "string") : [],
    monthlies: Array.isArray(p.monthlies) ? p.monthlies.map((g) => (g && g.month ? g : { ...g, month: p.lastMonth || monthKey(new Date()) })) : [],
    finals: Array.isArray(p.finals) ? p.finals : [],
    trading: normTrading(p.trading),
    history: Array.isArray(p.history) ? p.history : [],
    journal: p.journal && typeof p.journal === "object" ? p.journal : {},
    journalXp: p.journalXp && typeof p.journalXp === "object" ? p.journalXp : {},
    reviews: p.reviews && typeof p.reviews === "object" ? p.reviews : {},
    lastWeekSummary: p.lastWeekSummary || null,
    /* sem marca ainda: começa nos pontos de hoje, para o galho seco já valer na próxima virada */
    attrMark: p.attrMark && typeof p.attrMark === "object" ? p.attrMark : CORE_ATTRS.reduce((o, a) => ({ ...o, [a]: Number((p.attrs || {})[a]) || 0 }), {}),
    dryAttrs: Array.isArray(p.dryAttrs) ? p.dryAttrs : [],
    subMark: p.subMark && typeof p.subMark === "object" ? p.subMark : null,
    treeSnaps: Array.isArray(p.treeSnaps) ? p.treeSnaps : [],
    diary: { deadline: (p.diary && p.diary.deadline) || "23:59", startAt: (p.diary && p.diary.startAt) || Date.now(), charged: (p.diary && p.diary.charged) || {} },
  };
  /* versão sem contas: o que estava guardado na reserva vira saldo da Caixinha */
  if (!(p.finance && Array.isArray(p.finance.accounts))) {
    const old = (p.finance && p.finance.reserve && p.finance.reserve.saved) || 0;
    if (old > 0) s.finance.accounts = s.finance.accounts.map((a) => (a.kind === "caixinha" ? { ...a, initial: old } : a));
  }
  if (!p.shopV2) {
    const have = new Set(s.shop.map((i) => i.id));
    base.shop.filter((i) => i.id >= 5).forEach((i) => { if (!have.has(i.id)) s.shop.push(i); });
    s.shopV2 = true;
  }
  if (s.nofap.active && s.nofap.start && !s.nofap.countedThrough) s.nofap.countedThrough = addDays(s.nofap.start, -1);
  return s;
}

@keyframes fadeOut { 0%{opacity:1} 100%{opacity:0} }
@keyframes sealIgnite { 0%{transform:scale(.55);filter:brightness(.4)} 55%{transform:scale(1.25);filter:brightness(1.8)} 100%{transform:scale(1);filter:brightness(1)} }
@keyframes breathe { 0%,100%{box-shadow:0 0 12px rgba(185,28,28,.35)} 50%{box-shadow:0 0 30px rgba(239,68,68,.75)} }
@keyframes sectionPulse { 0%,100%{box-shadow:0 0 8px var(--glow)} 50%{box-shadow:0 0 20px var(--glow)} }
@keyframes radarIn { 0%{transform:scale(.5);opacity:0} 100%{transform:scale(1);opacity:1} }
@keyframes particle { 0%{transform:translate(0,0) scale(1);opacity:1} 100%{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0} }
@keyframes coinSpin { 0%{transform:rotateY(0)} 100%{transform:rotateY(360deg)} }
@keyframes mistA { 0%{transform:translate(-12%, -6%) scale(1)} 50%{transform:translate(10%, 8%) scale(1.25)} 100%{transform:translate(-12%, -6%) scale(1)} }
@keyframes mistB { 0%{transform:translate(14%, 10%) scale(1.15)} 50%{transform:translate(-10%, -8%) scale(1)} 100%{transform:translate(14%, 10%) scale(1.15)} }
@keyframes emberFlicker { 0%,100%{opacity:.55} 50%{opacity:1} }
@keyframes countPulse { 0%,100%{text-shadow:0 0 14px rgba(239,68,68,.5)} 50%{text-shadow:0 0 30px rgba(239,68,68,.95)} }
.xpring circle.fill { transition: stroke-dashoffset .8s cubic-bezier(.22,1,.36,1); }
.fadetab { animation: popIn .28s ease; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
`;

/* ==================== APP ==================== */
function App() {
  const [state, setState] = useState(null);
  const [tab, setTab] = useState("dash");
  const [flash, setFlash] = useState(null);
  const [floaters, setFloaters] = useState([]);
  const [particles, setParticles] = useState([]);
  const [confirmRelapse, setConfirmRelapse] = useState(false);
  const [bookOpen, setBookOpen] = useState(false);
  const [scrollOpen, setScrollOpen] = useState(false);
  const [dailyReq, setDailyReq] = useState(0);
  const [reviewOpen, setReviewOpen] = useState(false);
  const loaded = useRef(false);
  const rolledDay = useRef(null); /* último dia em que a virada rodou */

  useEffect(() => {
    (async () => {
      let s = initialState();
      try {
        const r = await storageGet("sistema_v1");
        if (r && r.value) {
          const p = JSON.parse(r.value);
          if (!p.attrsV2) { try { await storageSet("sistema_v1_antes_da_arvore", r.value); } catch (e) { /* segue */ } }
          else if (!p.attrsV3) { try { await storageSet("sistema_v1_antes_atributos_novos", r.value); } catch (e) { /* segue */ } }
          s = normalizeState(p);
          if (!p.skinSys) s = { ...s, themeId: "sistema", fontId: "sistema", skinSys: true };
          applyTheme(s.themeId);
          applyFont(s.fontId);
        }
      } catch (e) { /* primeira vez */ }
      if (s.skinSys && !document.body.classList.contains("sys") && s.themeId === "sistema") { applyTheme(s.themeId); applyFont(s.fontId); }
      s = processRollover(s);
      rolledDay.current = dayKey(new Date());
      s = applyDiaryPenalty(s);
      s = evalQuest(s);
      /* pede ao navegador para não apagar os dados quando faltar espaço */
      try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* sem suporte */ }
      loaded.current = true;
      setState(s);
    })();
  }, []);

  const stateRef = useRef(null);
  stateRef.current = state;
  useEffect(() => {
    if (!state || !loaded.current) return;
    const t = setTimeout(async () => {
      try { await storageSet("sistema_v1", JSON.stringify(state)); } catch (e) { console.error(e); }
    }, 150);
    return () => clearTimeout(t);
  }, [state]);
  /* ao trocar de app, bloquear a tela ou fechar: grava o estado na hora, sem esperar */
  useEffect(() => {
    const saveNow = () => {
      if (!loaded.current || !stateRef.current) return;
      try { localStorage.setItem("sistema_v1", JSON.stringify(stateRef.current)); } catch (e) { /* sem espaço */ }
    };
    const onVis = () => { if (document.visibilityState === "hidden") saveNow(); };
    document.addEventListener("visibilitychange", onVis);
    window.addEventListener("pagehide", saveNow);
    window.addEventListener("beforeunload", saveNow);
    return () => {
      document.removeEventListener("visibilitychange", onVis);
      window.removeEventListener("pagehide", saveNow);
      window.removeEventListener("beforeunload", saveNow);
    };
  }, []);
  const applyRemoteRef = useRef(null);
  useGithubSync(stateRef, loaded, state, applyRemoteRef);

  function spawnFloat(text, good) {
    const id = Date.now() + Math.random();
    setFloaters((f) => [...f, { id, text, good }]);
    setTimeout(() => setFloaters((f) => f.filter((x) => x.id !== id)), 1300);
  }
  function burstParticles() {
    const ps = Array.from({ length: 16 }, (_, i) => ({
      id: Date.now() + i,
      dx: `${(Math.random() - 0.5) * 260}px`,
      dy: `${(Math.random() - 0.9) * 240}px`,
    }));
    setParticles(ps);
    setTimeout(() => setParticles([]), 1000);
  }
  useEffect(() => {
    if (!flash) return;
    const t = setTimeout(() => setFlash(null), 2200);
    return () => clearTimeout(t);
  }, [flash]);

  function processRollover(s) {
    const now = new Date();
    const today = dayKey(now);
    /* antes do Dia 1 a rota ainda não começou: nenhuma virada de semana ou mês é processada */
    if (s.routeStart && s.routeStart > today) return s;
    const thisWeek = weekStartKey(now);
    const thisMonth = monthKey(now);
    let xp = s.xp, coins = s.coins, streak = s.streak;
    let attrs = { ...s.attrs };
    let attrLog = s.attrLog;
    let nofap = { ...s.nofap };
    let perkUse = { ...(s.perkUse || {}) };
    let reserveMark = s.reserveMark;
    let classQuest = s.classQuest;
    let shadows = [...(s.shadows || [])];
    let fixedRuns = { ...(s.fixedRuns || {}) };
    let lastWeekSummary = s.lastWeekSummary || null;
    let dryAttrs = s.dryAttrs || [];
    let drySubs = s.drySubs || [];
    let treeSnaps = [...(s.treeSnaps || [])];
    const hist = [...s.history];
    let stats = { ...s.stats };
    const log = (type, text, delta, c = 0) => hist.unshift({ date: today, type, text, xp: delta, coins: c });
    const earn = (amount) => { const c = Math.round(amount * coinMult(s)); coins += c; return c; };
    const before = levelFromXP(xp).lvl;
    const floorBase = levelFromXP(xp).base; /* o XP nunca cai abaixo do início do nível atual */

    const hitAttrs = (goal, amount) => {
      (goal.attrs || []).forEach((a) => {
        if (attrs[a] !== undefined) attrs[a] = Math.max(0, attrs[a] - amount);
        attrLog = srcAdd(attrLog, a, "metas", -amount, subOf(goal, a));
      });
    };

    let weeklies = s.weeklies;
    let fixedWeek = s.fixedWeek || newFixedWeek();
    if (s.lastWeek !== thisWeek) {
      /* árvore: foto do fim da semana e galhos que não cresceram nela */
      if (s.lastWeek && !treeSnaps.some((x) => x.week === s.lastWeek)) treeSnaps = [...treeSnaps, { week: s.lastWeek, p: { ...treeParamsOf(s), weather: null, rainbow: false }, xp: s.xp, pts: CORE_ATTRS.map((a) => s.attrs[a] || 0) }].slice(-30);
      const mk = s.attrMark || {};
      dryAttrs = s.attrMark ? CORE_ATTRS.filter((a) => !((s.attrs[a] || 0) > (mk[a] || 0))) : [];
      const spNow = allSubPts(s.attrs, s.attrLog);
      const sm = s.subMark || allSubPts(s.attrMark || {}, {});
      drySubs = Object.keys(spNow).filter((k) => !k.endsWith("/geral") && !(spNow[k] > (sm[k] || 0)));
      const fails = weeklies.filter((g) => !g.done);
      const wins = weeklies.filter((g) => g.done);
      stats.weeklyDone += wins.length;
      stats.weeklyFail += fails.length;
      if (fails.length) {
        let charged = fails;
        if (hasSkill(s, "disciplina2") && perkUse.forgive !== thisMonth) {
          const top = fails.slice().sort((a, b) => goalXP(b) - goalXP(a))[0];
          charged = fails.filter((g) => g !== top);
          perkUse.forgive = thisMonth;
          log("info", `🔥 Vontade de Ferro: "${top.title}" perdoada, sem penalidade`, 0);
        }
        let pen = 0;
        const arauto = isClass(s, "arauto");
        charged.forEach((g) => {
          const full = Math.round(goalXP(g) * PENALTY_RATE);
          const p = arauto && (g.attrs || []).includes("Influência") ? Math.round(full / 2) : full;
          pen += p;
          hitAttrs(g, p);
        });
        if (charged.length) {
          xp = Math.max(floorBase, xp - pen);
          log("penalty", `Semana encerrada: ${charged.length} meta(s) não cumprida(s)`, -pen);
        }
      }
      const items = fixedWeek.items || [];
      const avg = items.length ? items.reduce((a, i) => a + i.count, 0) / items.length : 0;
      const allHit = items.length > 0 && items.every((i) => i.count >= FIXED_TARGET);
      const vigorMins = items.filter((i) => i.attr === "Vigor");
      const recNeed = isClass(s, "cavaleiro") ? 6 : 7;
      if (hasSkill(s, "forca2") && vigorMins.length && vigorMins.every((i) => i.count >= recNeed)) {
        xp += 25;
        log("gain", `🛌 Recuperação: mínimos de Vigor em ${recNeed}/7`, 25, earn(25 * COIN_RATE));
      }
      if (allHit) {
        xp += FIXED_BONUS;
        log("gain", `Missão fixa: todos os mínimos em ${FIXED_TARGET}/7 ou mais`, FIXED_BONUS, earn(FIXED_BONUS * COIN_RATE));
      }
      const touched = weeklies.length > 0 || items.some((i) => i.count > 0);
      const minsOk = !items.length || avg >= FIXED_TARGET;
      const weekWon = touched && (weeklies.length ? wins.length / weeklies.length : 1) >= 0.8 && minsOk;
      if (touched) {
        const rate = weeklies.length ? wins.length / weeklies.length : 1;
        const resumo = `metas ${Math.round(rate * 100)}% · mínimos ${avg.toFixed(1)}/7`;
        if (rate >= 0.8 && minsOk) {
          streak += 1;
          log("info", `Semana vencida (${resumo}). Streak: ${streak}`, 0);
          if (hasSkill(s, "intelecto2")) {
            const est = isClass(s, "sabio") ? 40 : 25;
            xp += est;
            log("gain", `♟️ Estrategista: semana vencida${est > 25 ? " (Sábio)" : ""}`, est, earn(est * COIN_RATE));
          }
        } else if (streak > 0 && isClass(s, "asceta") && perkUse.asceta !== thisMonth) {
          perkUse.asceta = thisMonth;
          log("info", `Semana abaixo da linha (${resumo}). ⛓️ Asceta: streak mantido (${streak}).`, 0);
        } else {
          streak = 0;
          log("info", `Semana abaixo da linha (${resumo}). Streak recomeça.`, 0);
        }
      }
      /* semana sem nenhum registro, ou semanas inteiras sem abrir o app: o streak zera */
      const gap = !!s.lastWeek && addDays(s.lastWeek, 7) < thisWeek;
      if ((!touched || gap) && streak > 0) {
        streak = 0;
        log("info", gap ? "Semana(s) inteira(s) sem abrir o app. Streak zerado." : "Semana sem nenhum registro. Streak zerado.", 0);
      }
      /* resumo da semana que fechou, para a revisão de domingo */
      if (s.lastWeek) {
        const ws = s.lastWeek, we = addDays(s.lastWeek, 6);
        const inWeek = (d) => d >= ws && d <= we;
        const jr = s.journal || {};
        let diaryDays = 0, nofapDays = 0;
        for (let i = 0; i < 7; i++) {
          const d = addDays(ws, i);
          if (pageOk(jr[d])) diaryDays++;
          if (s.nofap && s.nofap.active && s.nofap.start && d >= s.nofap.start && d < today) nofapDays++;
        }
        lastWeekSummary = {
          week: ws,
          total: weeklies.length, wins: wins.length,
          goals: weeklies.map((g) => ({ title: g.title, done: !!g.done })),
          mins: items.map((i) => ({ title: i.title, count: i.count })),
          minsAvg: Math.round(avg * 10) / 10,
          won: weekWon, touched,
          xp: (s.history || []).filter((h) => inWeek(h.date)).reduce((t, h) => t + (h.xp || 0), 0),
          diaryDays, nofapDays,
        };
      }
      /* missão de classe: guarda o resultado da semana que terminou */
      if (classQuest && classQuest.status === "active" && s.lastWeek && addDays(s.lastWeek, 6) >= classQuest.start) {
        classQuest = { ...classQuest, weeks: [...(classQuest.weeks || []), { week: s.lastWeek, won: weekWon }, ...(gap ? [{ week: "sem-registro", won: false }] : [])] };
      }
      /* Exército de Sombras: as sombras pagam, e o mínimo com 4 semanas seguidas vira sombra */
      if (isClass(s, "monarca") && shadows.length) {
        xp += SHADOW_XP * shadows.length;
        log("gain", `☾ Exército de Sombras: ${shadows.length} sombra(s) em serviço`, SHADOW_XP * shadows.length);
      }
      const keep = [];
      items.forEach((i) => {
        fixedRuns[i.title] = i.count >= FIXED_TARGET ? (fixedRuns[i.title] || 0) + 1 : 0;
        if (isClass(s, "monarca") && fixedRuns[i.title] >= SHADOW_WEEKS && !shadows.some((x) => x.title === i.title)) {
          shadows.push({ title: i.title, since: today, attr: i.attr });
          delete fixedRuns[i.title];
          log("levelup", `☾ "${i.title}" virou sombra. A vaga está livre para um hábito novo.`, 0);
        } else keep.push(i);
      });
      weeklies = [];
      fixedWeek = newFixedWeek(keep.map((i) => ({ title: i.title, attr: i.attr })));
    }

    /* objetivos da rota vencidos sem concluir: −25% do XP, uma vez por prazo */
    const finals = (s.finals || []).map((g) => {
      if (g.done) return g;
      const eff = g.due || s.deadline;
      if (!(today > eff) || (g.charged || []).includes(eff)) return g;
      const pen = Math.round(goalXP(g, true) * PENALTY_RATE);
      xp = Math.max(floorBase, xp - pen);
      (g.attrs || []).forEach((a) => {
        const amt = Math.min(pen, 100);
        if (attrs[a] !== undefined) attrs[a] = Math.max(0, attrs[a] - amt);
        attrLog = srcAdd(attrLog, a, "metas", -amt, subOf(g, a));
      });
      log("penalty", `☠ Objetivo vencido: ${g.title} (prazo ${fmtDM(eff)})`, -pen);
      return { ...g, charged: [...(g.charged || []), eff] };
    });

    /* Cofre: compara a reserva com a do fechamento do mês anterior */
    const reserveNow = reserveSaved(s.finance || newFinance());
    if (s.lastMonth !== thisMonth) {
      if (typeof reserveMark === "number" && reserveNow > reserveMark + 0.009) {
        attrs["Riqueza"] = (attrs["Riqueza"] || 0) + 30;
        attrLog = srcAdd(attrLog, "Riqueza", "caixa", 30, "reserva");
        log("info", "🪙 Riqueza +30: a reserva cresceu no mês", 0);
      }
      if (hasSkill(s, "fortuna2") && typeof reserveMark === "number" && reserveNow > reserveMark + 0.009) {
        xp += 30;
        log("gain", "🏦 Cofre: a reserva cresceu no mês", 30, earn(30 * COIN_RATE));
      }
      reserveMark = reserveNow;
    } else if (typeof reserveMark !== "number") {
      reserveMark = reserveNow;
    }

    let monthlies = s.monthlies;
    if (s.lastMonth !== thisMonth && monthlies.length) {
      const mOf = (g) => g.month || s.lastMonth || thisMonth;
      const fails = monthlies.filter((g) => mOf(g) < thisMonth && !g.done);
      if (fails.length) {
        let pen = 0;
        fails.forEach((g) => {
          const p = Math.round(goalXP(g) * PENALTY_RATE);
          pen += p;
          hitAttrs(g, p);
        });
        xp = Math.max(floorBase, xp - pen);
        log("penalty", `Mês encerrado: ${fails.length} meta(s) não cumprida(s)`, -pen);
      }
      monthlies = monthlies.filter((g) => (g.month || s.lastMonth || thisMonth) >= thisMonth);
    }

    /* com o Dia 1 no futuro, nada conta ainda (nem recorde, nem vitórias, nem bônus) */
    if (nofap.active && nofap.start && nofap.start <= today) {
      const days = Math.max(1, daysBetween(nofap.start, today) + 1);
      const milestones = Math.floor(days / 7);
      if (milestones > (nofap.rewarded || 0)) {
        const n = milestones - (nofap.rewarded || 0);
        xp += n * NOFAP_WEEK_XP;
        const nfCoins = earn(n * NOFAP_WEEK_COINS);
        attrs["Domínio"] = (attrs["Domínio"] || 0) + n * NOFAP_WEEK_XP;
        attrLog = srcAdd(attrLog, "Domínio", "nofap", n * NOFAP_WEEK_XP);
        nofap.rewarded = milestones;
        log("gain", `NoFap: ${milestones} semana(s) de sequência — bônus`, n * NOFAP_WEEK_XP, nfCoins);
      }
      if (days > (nofap.best || 0)) nofap.best = days;
      /* vitórias totais: cada dia encerrado sem recaída soma 1 e nunca zera */
      const yest = addDays(today, -1);
      const from = nofap.countedThrough || addDays(nofap.start, -1);
      if (from < yest) {
        nofap.wins = (nofap.wins || 0) + daysBetween(from, yest);
        nofap.countedThrough = yest;
      }
    }

    let weekPlan = Array.isArray(s.weekPlan) ? s.weekPlan : [];
    if (weekPlan.some((g) => g.week <= thisWeek)) {
      const have = new Set(weeklies.map((g) => String(g.id)));
      weeklies = [...weeklies, ...weekPlan.filter((g) => g.week === thisWeek && !have.has(String(g.id)))];
      weekPlan = weekPlan.filter((g) => g.week > thisWeek);
    }

    const after = levelFromXP(xp).lvl;
    if (after < before) log("leveldown", `Você caiu para o nível ${after} — ${titleFor(after)}`, 0);

    return { ...s, xp, coins, streak, attrs, nofap, perkUse, reserveMark, classQuest, shadows, fixedRuns, attrLog, stats, history: hist.slice(0, 120), weeklies, weekPlan, monthlies, fixedWeek, finals, lastWeekSummary, dryAttrs, drySubs, subMark: s.lastWeek !== thisWeek ? allSubPts(attrs, attrLog) : (s.subMark || allSubPts(s.attrs, s.attrLog)), treeSnaps, attrMark: s.lastWeek !== thisWeek ? { ...attrs } : s.attrMark, lastWeek: thisWeek, lastMonth: thisMonth };
  }

  function applyXP(s, delta, text, extra = {}) {
    const before = levelFromXP(s.xp).lvl;
    const xp = Math.max(extra.floor ? levelFromXP(s.xp).base : 0, s.xp + delta);
    const coinDelta = extra.coins !== undefined ? extra.coins : Math.round(Math.max(0, delta) * COIN_RATE * coinMult(s)) * (delta >= 0 ? 1 : 0) - (delta < 0 && extra.refundCoins ? extra.refundCoins : 0);
    const coins = Math.max(0, s.coins + coinDelta);
    const after = levelFromXP(xp).lvl;
    const hist = [{ date: dayKey(new Date()), type: delta >= 0 ? "gain" : "penalty", text, xp: delta, coins: coinDelta }, ...s.history];
    if (after > before) {
      hist.unshift({ date: dayKey(new Date()), type: "levelup", text: `Nível ${after} — ${titleFor(after)}`, xp: 0 });
      setFlash({ kind: "up", text: `NÍVEL ${after} · ${titleFor(after).toUpperCase()}` });
      burstParticles();
    } else if (after < before) {
      hist.unshift({ date: dayKey(new Date()), type: "leveldown", text: `Caiu para o nível ${after} — ${titleFor(after)}`, xp: 0 });
      setFlash({ kind: "down", text: `NÍVEL ${after} · ${titleFor(after).toUpperCase()}` });
    }
    return { ...s, xp, coins, history: hist.slice(0, 120) };
  }

  function toggleItem(listKey, id, isFinal) {
    setState((s) => {
      const list = s[listKey].map((g) => ({ ...g }));
      const g = list.find((x) => x.id === id);
      if (!g) return s;
      if (isFinal && !g.done && (g.milestones || []).some((m) => !m.done)) { spawnFloat("Conclua os marcos primeiro", false); return s; }
      g.done = !g.done;
      const base = isFinal ? Math.max(0, goalXP(g, true) - msPaid(g)) : goalXP(g, isFinal);
      const fedFinals = !isFinal && g.goalId && s.finals.some((f) => f.id === g.goalId)
        ? s.finals.map((f) => (f.id === g.goalId ? { ...f, fed: Math.max(0, (f.fed || 0) + (g.done ? 1 : -1)), lastFed: g.done ? dayKey(new Date()) : f.lastFed } : f))
        : null;
      const pct = g.done ? goalBonusPct(s, g) : 0;
      const given = g.done ? Math.round(base * (1 + pct / 100)) : (g.awarded || base);
      g.awarded = g.done ? given : null;
      const delta = g.done ? given : -given;
      const attrs = { ...s.attrs };
      let attrLog = s.attrLog;
      (g.attrs || []).forEach((a) => {
        if (attrs[a] !== undefined) attrs[a] = Math.max(0, attrs[a] + (g.done ? base : -base));
        attrLog = srcAdd(attrLog, a, "metas", g.done ? base : -base, subOf(g, a));
      });
      if ((g.attrs || []).includes("Influência") && hasSkill(s, "presenca3")) {
        attrs["Riqueza"] = Math.max(0, (attrs["Riqueza"] || 0) + (g.done ? 10 : -10));
        attrLog = srcAdd(attrLog, "Riqueza", "metas", g.done ? 10 : -10, "renda");
      }
      const gotCoins = delta > 0 ? Math.round(delta * COIN_RATE * coinMult(s)) : 0;
      spawnFloat(`${delta > 0 ? "+" : ""}${delta} XP${gotCoins ? ` · +${gotCoins} 🪙` : ""}`, delta > 0);
      const gid = `${listKey}:${g.id}`;
      const leafLog = g.done
        ? [...(s.leafLog || []).filter((x) => x.gid !== gid), ...(g.attrs || []).map((a) => ({ gid, date: dayKey(new Date()), title: g.title, xp: given, attr: a, sub: subOf(g, a) }))].slice(-800)
        : (s.leafLog || []).filter((x) => x.gid !== gid);
      const others = (s.routeLog || []).filter((x) => x.gid !== gid);
      const routeLog = !isFinal && g.goalId && g.done
        ? [...others, { gid, goal: g.goalId, kind: listKey, title: g.title, month: g.month || null, date: dayKey(new Date()), xp: given }].slice(-600)
        : others;
      return applyXP(
        { ...s, [listKey]: list, attrs, attrLog, leafLog, routeLog, ...(fedFinals ? { finals: fedFinals } : {}) },
        delta,
        g.done ? `Concluído: ${g.title}${pct ? ` (+${pct}% da árvore)` : ""}` : `Revertido: ${g.title}`,
        delta < 0 ? { refundCoins: Math.round(given * COIN_RATE * coinMult(s)) } : {}
      );
    });
  }

  function addItem(listKey, title, diff, attrsSel, xpCustom, extra = {}) {
    const fin = listKey === "finals";

  /* ---- objetivos da rota: marcos e prazo ---- */
  function toggleMilestone(fid, mid) {

      m.done = !m.done;
      const val = Math.round(goalXP(f, true) * MS_SHARE);
      const given = m.done ? val : (m.awarded || val);
      m.awarded = m.done ? given : null;
      m.doneAt = m.done ? dayKey(new Date()) : null;
      const delta = m.done ? given : -given;
      spawnFloat(`${delta > 0 ? "+" : ""}${delta} XP`, delta > 0);
      return applyXP({ ...s, finals: s.finals.map((x) => (x.id === fid ? { ...x, milestones: ms } : x)) }, delta,
        m.done ? `🏁 Marco: ${m.title} (${f.title})` : `Marco revertido: ${m.title}`,

  function bumpFixed(id, d) {
    setState((s) => {
      const fw = s.fixedWeek || newFixedWeek();
      const it = fw.items.find((i) => i.id === id);
      if (!it) return s;
      const next = Math.min(7, Math.max(0, it.count + d));
      if (next === it.count) return s;
      const delta = (next - it.count) * FIXED_XP_PER_DAY;
      const items = fw.items.map((i) => (i.id === id ? { ...i, count: next } : i));
      spawnFloat(`${delta > 0 ? "+" : ""}${delta} XP`, delta > 0);
      const at = CORE_ATTRS.includes(it.attr) ? it.attr : "Domínio";
      const ns = applyXP({ ...s, fixedWeek: { ...fw, items }, attrs: { ...s.attrs, [at]: Math.max(0, (s.attrs[at] || 0) + delta) }, attrLog: srcAdd(s.attrLog, at, "minimos", delta, it.sub || "geral") }, delta, `Missão fixa · ${it.title}`, { coins: 0 });

      const key = dayKey(new Date());
      const text = `Missão fixa · ${it.title}`;
      const [first, ...rest] = ns.history;
      const idx = rest.findIndex((h) => h.date === key && h.text === text);
      if (first && first.text === text && idx >= 0) {
        const merged = { ...rest[idx], xp: rest[idx].xp + first.xp };
        merged.type = merged.xp >= 0 ? "gain" : "penalty";
        const out = rest.slice();
        if (merged.xp === 0) out.splice(idx, 1); else out[idx] = merged;
        return { ...ns, history: out };

      return ns;

  });

  /* diário: salva a página do dia; o primeiro registro de hoje rende 10 XP, uma vez */
  function applyDiaryPenalty(s) {
    const now = Date.now();
    const debts = diaryDebts(s, now);
    if (!debts.length) return s;
    const charged = {};
    Object.entries((s.diary && s.diary.charged) || {}).forEach(([k, v]) => { if (now - Number(k) < 40 * 86400000) charged[k] = v; });
    let total = 0;
    debts.forEach((d) => { charged[d.dl] = d.due; total += d.delta; });
    const diary = { ...(s.diary || {}), charged };
    const label = debts.length > 1 ? `${debts.length} dias sem escrever` : `${debts[0].due}h${debts[0].due >= DIARY_CAP_HOURS ? " (teto)" : ""}`;
    return applyXP({ ...s, diary }, -DIARY_PENALTY * total, `☠ Diário atrasado, ${label}: −${DIARY_PENALTY * total} XP`, { coins: 0, floor: true });
  }
  function evalQuest(s) {
    const q = s.classQuest;
    if (!q || q.status !== "active") return s;

  const setDiaryDeadline = (hhmm) => setState((s) => ({ ...s, diary: { ...(s.diary || {}), deadline: hhmm } }));

  /* bloco da agenda: Cumpri/Atrasei marcam o mínimo ligado (se ainda não marcado hoje); Pulei/Desfazer devolvem o que o bloco marcou */
  function markBlock(blockId, k) {
    const day = agendaDay(state, Date.now());
    const b = day.blocks.find((x) => x.id === blockId);
    if (!b) return;
    const today = day.today;
    const prev = day.marks[blockId];
    const it = b.link != null ? ((state.fixedWeek && state.fixedWeek.items) || []).find((i) => i.id === b.link) : null;
    const minOnNow = !!(it && (it.days || []).includes(today));
    let viaMin = !!(prev && prev.min);
    if (k === null || k === "skip") { if (viaMin && minOnNow) markMinToday(b.link); viaMin = false; }
    else if (it && !minOnNow && it.count < 7) { markMinToday(b.link); viaMin = true; }
    setAgenda((a) => {
      const marks = { ...(a.marks || {}) };
      const d = { ...(marks[today] || {}) };
      if (k === null) delete d[blockId]; else d[blockId] = { k, min: viaMin, at: Date.now() };
      marks[today] = d;
      Object.keys(marks).sort().slice(0, -14).forEach((x) => { delete marks[x]; });
      return { ...a, marks };
    });
  }

    const it = ((state.fixedWeek && state.fixedWeek.items) || []).find((i) => i.id === id);

  /* revisão de domingo: +20 XP e +20 de Estratégia, uma vez por semana */
  function saveReview(rv) {

      const plans = rv.plans || {};
      const weeklies = s.weeklies.map((g) => (plans[g.id] && plans[g.id].trim() ? { ...g, ifThen: plans[g.id].trim() } : g));
      const attrs = { ...s.attrs, "Estratégia": (s.attrs["Estratégia"] || 0) + REVIEW_ATTR };
      const attrLog = srcAdd(s.attrLog, "Estratégia", "revisao", REVIEW_ATTR);
      const review = { ...rv, plans: s.weeklies.filter((g) => plans[g.id] && plans[g.id].trim()).map((g) => ({ title: g.title, text: plans[g.id].trim() })), doneAt: Date.now() };
      spawnFloat(`+${REVIEW_XP} XP · Estratégia +${REVIEW_ATTR}`, true);
      return applyXP({ ...s, weeklies, attrs, attrLog, reviews: { ...(s.reviews || {}), [rv.week]: review } }, REVIEW_XP, "📜 Revisão de domingo feita");
    });
  }

  function unlockSkill(id) {
    setState((s) => {
      const k = SKILLS.find((x) => x.id === id);
      if (!k || hasSkill(s, id) || skillState(s, k).status !== "av") return s;
      setFlash({ kind: "up", text: `HABILIDADE · ${k.name.toUpperCase()}` });
      burstParticles();
      return {
        ...s,
        skills: { ...(s.skills || {}), [id]: Date.now() },
        history: [{ date: dayKey(new Date()), type: "levelup", text: `${k.icon} Habilidade desbloqueada: ${k.name}`, xp: 0 }, ...s.history].slice(0, 120),
      };
    });
  }
  const newId = () => Date.now() + Math.random();
  const trdUpdate = (fn) => setState((s) => ({ ...s, trading: fn(normTrading(s.trading)) }));
  const trd = {
    add: (kind, item, patch) => trdUpdate((t) => ({ ...t, ...(patch || {}), [kind]: [...t[kind], { ...item, id: Date.now() + Math.random() }] })),
    remove: (kind, id) => trdUpdate((t) => ({ ...t, [kind]: t[kind].filter((x) => x.id !== id) })),
    set: (patch) => trdUpdate((t) => ({ ...t, ...patch })),
  };
  const fin = {
    addEntry: (e) => finUpdate((f) => ({ ...f, lastAccountId: e.accountId || f.lastAccountId, entries: [...f.entries, { ...e, id: e.id || newId() }] })),
    removeEntry: (id) => finUpdate((f) => {
      const e = f.entries.find((x) => x.id === id);
      if (!e) return f;
      /* pagamento parcial e o rotativo que ele gerou andam juntos: apagar um apaga o outro */
      const gone = (x) => x.id === id || (e.purchaseId && x.purchaseId === e.purchaseId) || (e.carryId && x.id === e.carryId) || (e.carry && e.payId && x.id === e.payId);
      const removed = f.entries.filter(gone);
      let debts = f.debts, cards = f.cards || [];
      const unpay = (cardId, key) => { cards = cards.map((c) => { if (c.id !== cardId) return c; const paid = { ...(c.paid || {}) }; delete paid[key]; return { ...c, paid }; }); };
      removed.forEach((r) => {
        if (r.debtId) debts = debts.map((dd) => (dd.id === r.debtId ? { ...dd, balance: round2(dd.balance + r.amount) } : dd));
        if (r.cardPayment && !r.advance) unpay(r.cardId, r.invoice);
        if (r.carry && r.rolled) unpay(r.cardId, r.rolled);
      });
      return { ...f, debts, cards, entries: f.entries.filter((x) => !gone(x)) };
    }),
    addCardPurchase: ({ id, cardId, total, installments, cat, date, note }) => finUpdate((f) => {
      const card = (f.cards || []).find((c) => c.id === cardId);
      if (!card) return f;
      const n = Math.max(1, Math.min(12, installments || 1));
      const first = invoiceFor(card, date);
      const part = Math.floor((total / n) * 100) / 100;
      const out = [];
      for (let k = 0; k < n; k++) {
        const amount = k < n - 1 ? part : round2(total - part * (n - 1));
        out.push({ id: k === 0 ? id : id + k, type: "out", amount, cat, note, date: shiftDateMonths(date, k), cardId, purchaseId: id, invoice: addMonthsKey(first, k), inst: n > 1 ? `${k + 1}/${n}` : undefined });
      }
      return { ...f, entries: [...f.entries, ...out] };
    }),
    /* pagar a fatura: inteira, parte (o resto vira rotativo na próxima, com juros) ou nada */
    payInvoice: (cardId, key, total, todayKey, amount) => {
      const pay = amount == null ? total : round2(Math.max(0, Math.min(total, amount)));
      if (pay > 0) jurosCompostos(`card:${cardId}`, todayKey);
      return finUpdate((f) => {
        const card = (f.cards || []).find((c) => c.id === cardId);
        if (!card || (card.paid && card.paid[key] != null)) return f;
        const rest = round2(total - pay);
        const payId = newId(), carryId = rest > 0 ? newId() + 0.5 : null;
        const add = [];
        if (pay > 0) add.push({ id: payId, type: "out", amount: pay, cat: "Fatura do cartão", note: `Fatura de ${monthShort(key)} · ${card.name}${rest > 0 ? " (parte)" : ""}`, date: todayKey, cardId, cardPayment: true, invoice: key, accountId: card.payFromId || defaultAccountId(f), carryId: carryId || undefined });
        if (rest > 0) {
          const r = card.rate || 0;
          add.push({ id: carryId, type: "out", amount: round2(rest * (1 + r / 100)), cat: "Dívida", note: `Rotativo da fatura de ${monthShort(key)}${r ? ` (+${String(r).replace(".", ",")}% de juros)` : " (juros não informados)"}`, date: todayKey, cardId, invoice: addMonthsKey(key, 1), carry: true, rolled: key, payId: pay > 0 ? payId : undefined });
        }
        return { ...f, cards: f.cards.map((c) => (c.id === cardId ? { ...c, paid: { ...(c.paid || {}), [key]: pay } } : c)), entries: [...f.entries, ...add] };
      });
    },
    payAdvance: (cardId, key, amount, todayKey) => {
      if (!(amount > 0)) return;
      jurosCompostos(`card:${cardId}`, todayKey);
      finUpdate((f) => {
        const card = (f.cards || []).find((c) => c.id === cardId);
        if (!card) return f;
        return { ...f, entries: [...f.entries, { id: newId(), type: "out", amount: round2(amount), cat: "Fatura do cartão", note: `Pagamento antecipado · fatura de ${monthShort(key)} · ${card.name}`, date: todayKey, cardId, cardPayment: true, advance: true, invoice: key, accountId: card.payFromId || defaultAccountId(f) }] };
      });
    },
    addOldDebt: (cardId, o, todayKey) => finUpdate((f) => {
      const card = (f.cards || []).find((c) => c.id === cardId);
      if (!card) return f;
      return { ...f, entries: [...f.entries, ...oldDebtEntries(card, todayKey, o, newId())] };
    }),
    /* dívida do formato antigo vira um cartão com a dívida dentro */
    convertDebt: (id, todayKey) => finUpdate((f) => {
      const d = (f.debts || []).find((x) => x.id === id);
      if (!d) return f;
      const day = Math.max(1, Math.min(28, d.dueDay || 10));
      const card = { id: newId(), name: d.name, limit: d.balance, closeDay: day, dueDay: day, rate: d.rate == null ? null : d.rate, paid: {} };
      const o = d.payment > 0 && d.payment < d.balance ? { mode: "parcelado", parcela: d.payment, n: Math.ceil(d.balance / d.payment), total: d.balance, note: d.name } : { mode: "saldo", saldo: d.balance, note: d.name };
      return { ...f, cards: [...(f.cards || []), card], debts: f.debts.filter((x) => x.id !== id), entries: [...f.entries, ...oldDebtEntries(card, todayKey, o, newId())] };
    }),
    setDebtBudget: (v) => finUpdate((f) => ({ ...f, plan: { ...(f.plan || {}), debtBudget: round2(v) } })),
    updateCard: (id, patch) => finUpdate((f) => ({ ...f, cards: (f.cards || []).map((c) => (c.id === id ? { ...c, ...patch } : c)) })),
    addAccount: (a) => finUpdate((f) => ({ ...f, accounts: [...(f.accounts || []), { id: `acc-${newId()}`, ...a }] })),
    updateAccount: (id, patch) => finUpdate((f) => ({ ...f, accounts: f.accounts.map((a) => (a.id === id ? { ...a, ...patch } : a)) })),
    adjustBalance: (id, desired) => finUpdate((f) => {
      const delta = round2(desired - accountBalance(f, id));
      if (!delta) return f;
      return { ...f, accounts: f.accounts.map((a) => (a.id === id ? { ...a, initial: round2((a.initial || 0) + delta) } : a)) };
    }),
    hideAccount: (id) => finUpdate((f) => ({ ...f, accounts: f.accounts.map((a) => (a.id === id ? { ...a, hidden: true } : a)) })),
    transfer: (fromId, toId, amount, date) => finUpdate((f) => ({ ...f, entries: [...f.entries, { id: newId(), type: "transfer", fromId, toId, amount, date, note: "" }] })),
    /* lançamento antigo: o saldo real já refletia esse gasto, então o saldo da conta não muda */
    updateEntry: (id, patch) => finUpdate((f) => {
      const e = f.entries.find((x) => x.id === id);
      if (!e) return f;
      const next = { ...e, ...patch };
      /* compra à vista no cartão: data nova pode cair em outra fatura */
      if (next.cardId && !next.cardPayment && !next.inst && patch.date && patch.date !== e.date) {
        const card = (f.cards || []).find((c) => c.id === next.cardId);
        if (card) next.invoice = invoiceFor(card, patch.date);
      }
      return { ...f, entries: f.entries.map((x) => (x.id === id ? next : x)) };
    }),
    setEntryAccount: (id, accountId) => finUpdate((f) => {
      const e = f.entries.find((x) => x.id === id);
      if (!e) return f;
      const comp = e.type === "in" ? -e.amount : e.amount;
      return {
        ...f,
        accounts: f.accounts.map((a) => (a.id === accountId ? { ...a, initial: round2((a.initial || 0) + comp) } : a)),
        entries: f.entries.map((x) => (x.id === id ? { ...x, accountId } : x)),
      };
    }),
    addCard: (c) => finUpdate((f) => ({ ...f, cards: [...(f.cards || []), { id: newId(), paid: {}, ...c }] })),
    removeCard: (id) => finUpdate((f) => ({ ...f, cards: (f.cards || []).filter((c) => c.id !== id), entries: f.entries.filter((e) => e.cardId !== id) })),
    addCategory: (c) => finUpdate((f) => ({ ...f, categories: [...(f.categories || DEFAULT_CATS), { id: newId(), ...c }] })),
    hideCategory: (id) => finUpdate((f) => ({ ...f, categories: (f.categories || DEFAULT_CATS).map((c) => (c.id === id ? { ...c, hidden: true } : c)) })),
    addDebt: (dd) => finUpdate((f) => ({ ...f, debts: [...f.debts, { id: newId(), ...dd }] })),
    updateDebt: (id, patch) => finUpdate((f) => ({ ...f, debts: f.debts.map((dd) => (dd.id === id ? { ...dd, ...patch } : dd)) })),
    payDebt: (id, amount, date) => { jurosCompostos(id, date); return finUpdate((f) => {
      const dd = f.debts.find((x) => x.id === id);
      if (!dd) return f;
      return {
        ...f,
        debts: f.debts.map((x) => (x.id === id ? { ...x, balance: round2(Math.max(0, x.balance - amount)) } : x)),
        entries: [...f.entries, { id: newId(), type: "out", amount, cat: "Dívida", note: `Pagamento · ${dd.name}`, date, debtId: id, accountId: defaultAccountId(f) }],
      };
    }); },
    removeDebt: (id) => finUpdate((f) => ({ ...f, debts: f.debts.filter((dd) => dd.id !== id) })),
    setReserveTarget: (v) => finUpdate((f) => ({ ...f, reserve: { ...f.reserve, target: round2(v) } })),
    moveReserve: (delta) => finUpdate((f) => ({ ...f, reserve: { ...f.reserve, saved: round2(Math.max(0, f.reserve.saved + delta)) } })),
    addRecurring: (r) => finUpdate((f) => ({ ...f, recurring: [...f.recurring, { id: newId(), ...r }] })),
    removeRecurring: (id) => finUpdate((f) => ({ ...f, recurring: f.recurring.filter((r) => r.id !== id) })),
    confirmRecurring: (id, amount, monthKey, todayKey) => finUpdate((f) => {
      const r = f.recurring.find((x) => x.id === id);
      if (!r || f.entries.some((e) => e.recId === id && e.recMonth === monthKey)) return f;
      const due = Math.min(r.day, daysIn(monthKey));
      const date = monthKey === todayKey.slice(0, 7) ? todayKey : `${monthKey}-${String(due).padStart(2, "0")}`;
      return {
        ...f,
        recurring: f.recurring.map((x) => (x.id === id ? { ...x, amount } : x)),
        entries: [...f.entries, { id: newId(), type: r.type, amount, cat: r.cat, note: r.name, date, recId: id, recMonth: monthKey, accountId: r.accountId || defaultAccountId(f) }],
      };
    }),
    setPlan: (p) => finUpdate((f) => ({ ...f, plan: { ...f.plan, ...p } })),
    setCmd: (p) => finUpdate((f) => ({ ...f, cmd: { ...(f.cmd || {}), ...p } })),
    toggleNoSpend: (k) => finUpdate((f) => ({ ...f, noSpend: f.noSpend.includes(k) ? f.noSpend.filter((x) => x !== k) : [...f.noSpend, k] })),
  };

  const addAttr = (name) =>
    setState((s) => (s.attrs[name] !== undefined ? s : { ...s, attrs: { ...s.attrs, [name]: 0 } }));
  const removeAttr = (name) =>
    setState((s) => {
      const attrs = { ...s.attrs };
      delete attrs[name];
      return { ...s, attrs };
    });
  const setDeadline = (d) => setState((s) => ({ ...s, deadline: d }));
  const setHeroName = (n) => setState((s) => ({ ...s, heroName: n }));

  if (!state)
    return (
      <div style={{ minHeight: "100vh", background: T.bg, color: T.muted, display: "flex", alignItems: "center", justifyContent: "center", fontFamily: F.ui }}>
        abrindo o Sistema…
      </div>
    );

  syncCategories(state.finance);
  const { lvl, into, need } = levelFromXP(state.xp);
  const rank = rankFromLevel(lvl);
  const title = titleFor(lvl);
  const pct = Math.min(100, Math.round((into / need) * 100));
  const now = new Date();
  const today = dayKey(now);
  const daysLeft = Math.max(0, daysBetween(today, state.deadline));
  const weeksLeft = Math.max(0, Math.ceil(daysLeft / 7));
  const monthName = MONTHS_PT[now.getMonth()];
  const nextMonthName = MONTHS_PT[(now.getMonth() + 1) % 12];
  const nfDays = state.nofap.active && state.nofap.start && state.nofap.start <= today ? Math.max(1, daysBetween(state.nofap.start, today) + 1) : 0;
  const totalW = state.stats.weeklyDone + state.stats.weeklyFail;
  const taxa = totalW ? Math.round((state.stats.weeklyDone / totalW) * 100) : null;
  const attrNames = Object.keys(state.attrs);

  const tabs = [
    { id: "dash", label: "Status" },
    { id: "profile", label: "Perfil" },
    { id: "goals", label: "Objetivos" },
    { id: "cash", label: "Caixa" },
    { id: "shop", label: "Loja" },
  ];

  return (
    <div style={{ minHeight: "100vh", background: T.bg, color: T.text, fontFamily: F.ui, paddingBottom: 76, paddingTop: "calc(64px + env(safe-area-inset-top, 0px))", position: "relative", overflow: "hidden", animation: flash && flash.kind === "down" ? "shake .5s ease" : "none" }}>
      <style>{CSS}</style>

      <div style={{ position: "fixed", inset: 0, pointerEvents: "none", zIndex: 0 }}>
        <div style={{ position: "absolute", top: "-20%", left: "-10%", width: "80%", height: "60%", background: `radial-gradient(circle, ${T.mist1}, transparent 65%)`, willChange: "transform", animation: "mistA 16s ease-in-out infinite" }} />
        <div style={{ position: "absolute", bottom: "-15%", right: "-15%", width: "75%", height: "55%", background: `radial-gradient(circle, ${T.mist2}, transparent 60%)`, willChange: "transform", animation: "mistB 20s ease-in-out infinite" }} />
        <div style={{ position: "absolute", top: "35%", left: "45%", width: "40%", height: "30%", background: `radial-gradient(circle, ${T.mist3}, transparent 70%)`, willChange: "transform", animation: "mistA 24s ease-in-out infinite reverse" }} />
      </div>

      <div style={{ position: "fixed", top: "38%", left: 0, right: 0, display: "flex", justifyContent: "center", zIndex: 60, pointerEvents: "none" }}>
        {floaters.map((f) => (
          <div key={f.id} style={{ position: "absolute", animation: "floatUp 1.2s ease forwards", fontFamily: F.ui, fontWeight: 700, fontSize: 20, color: f.good ? T.good : T.bad, textShadow: `0 0 12px ${f.good ? "#166534" : T.danger}` }}>
            {f.text}
          </div>
        ))}
      </div>

      <div style={{ position: "fixed", top: "40%", left: "50%", zIndex: 55, pointerEvents: "none" }}>
        {particles.map((p) => (
          <div key={p.id} style={{ position: "absolute", width: 7, height: 7, background: T.accentSoft, boxShadow: `0 0 8px ${T.glow}`, "--dx": p.dx, "--dy": p.dy, animation: "particle .9s ease-out forwards" }} />
        ))}
      </div>

      {flash && (
        <div style={{ position: "fixed", inset: 0, display: "flex", alignItems: "center", justifyContent: "center", zIndex: 50, pointerEvents: "none" }}>
          <div style={{ padding: "18px 28px", border: `1px solid ${flash.kind === "up" ? T.accent : T.danger}`, background: T.bg, boxShadow: `0 0 44px ${flash.kind === "up" ? T.glow : T.danger}`, fontFamily: F.ui, letterSpacing: 0.4, fontSize: 19, color: flash.kind === "up" ? T.accentSoft : T.danger, animation: "popIn .3s ease", textAlign: "center" }}>
            {flash.kind === "up" ? "▲ " : "▼ "}{flash.text}

      )}

      {tab === "dash" && reviewPending(state) && (

            border: `1px solid ${T.gold}`, background: T.panel2, color: T.text, boxShadow: `0 0 18px ${T.gold}44`, animation: "sectionPulse 2.4s ease-in-out infinite", ["--glow"]: `${T.gold}55`, fontFamily: "inherit" }}>
          <span style={{ fontSize: 28 }} aria-hidden="true">📜</span>
          <span style={{ flex: 1 }}>

            <span style={{ display: "block", fontSize: 12, color: T.muted }}>A semana fechou. 3 respostas · +{REVIEW_XP} XP · Estratégia +{REVIEW_ATTR}{daysBetween(weekStartKey(new Date()), dayKey(new Date())) >= REVIEW_DAYS - 1 ? " · último dia" : ""}</span>
          </span>

      {reviewOpen && reviewPending(state) && (

/* ==================== ANEL DE XP ==================== */
function XPRing({ pct, size, stroke, color, trackColor }) {
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const offset = c * (1 - pct / 100);
  return (
    <div className="xpring" style={{ position: "relative", width: size, height: size, minWidth: size }}>
      <svg width={size} height={size} style={{ transform: "rotate(-90deg)" }}>
        <circle cx={size / 2} cy={size / 2} r={r} stroke={trackColor} strokeWidth={stroke} fill="none" />
        <circle className="fill" cx={size / 2} cy={size / 2} r={r} stroke={color} strokeWidth={stroke} fill="none"
          strokeDasharray={c} strokeDashoffset={offset} strokeLinecap="round"
          style={{ filter: `drop-shadow(0 0 5px ${color})` }} />
      </svg>
      <div style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center" }}>
        <span style={{ fontFamily: F.ui, fontSize: size * 0.24, fontWeight: 800, color: T.text }}>{pct}%</span>
      </div>
    </div>
  );
}

/* ==================== GRÁFICO SEMANAL DE XP ==================== */
function WeeklyXPChart({ history, weekStart }) {
  const start = parseKey(weekStart);
  const days = Array.from({ length: 7 }, (_, i) => {
    const d = new Date(start);
    d.setDate(start.getDate() + i);
    return d;
  });
  const sums = days.map((d) => {
    const key = dayKey(d);
    return history.filter((h) => h.date === key).reduce((a, h) => a + (h.xp || 0), 0);
  });
  const max = Math.max(20, ...sums.map((v) => Math.abs(v)));
  const todayKey = dayKey(new Date());
  return (
    <div style={{ display: "flex", alignItems: "flex-end", gap: 6, height: 108, padding: "4px 2px 0" }}>
      {sums.map((v, i) => {
        const h = Math.round((Math.abs(v) / max) * 68);
        const isToday = dayKey(days[i]) === todayKey;
        return (
          <div key={i} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "flex-end", height: "100%" }}>
            <div style={{ fontSize: 9, color: v > 0 ? T.good : v < 0 ? T.danger : T.muted, fontFamily: F.ui, marginBottom: 3, minHeight: 11 }}>
              {v !== 0 ? (v > 0 ? "+" : "") + v : "·"}
            </div>
            <div style={{
              width: "62%", height: Math.max(3, h), borderRadius: 2,
              background: v > 0 ? `linear-gradient(180deg, ${T.accentSoft}, ${T.glow})` : v < 0 ? T.danger : T.border,
              boxShadow: v !== 0 ? `0 0 8px ${v > 0 ? T.glow : T.danger}` : "none",
            }} />
            <div style={{ fontSize: 9, color: isToday ? T.accentSoft : T.muted, marginTop: 5, fontFamily: F.ui, fontWeight: isToday ? 700 : 400 }}>
              {WEEKDAYS_PT[i]}
            </div>
          </div>
        );
      })}
    </div>
  );
}

  const [txt, setTxt] = useState("");

    <div data-pn="" style={{ border: `1px solid ${accent || T.border}`, marginBottom: 8, background: T.panel2 }}>

        <div style={{ padding: "0 12px 12px" }}>
          {doneCount > 0 && (
            <button onClick={() => setHideDone(!hideDone)} style={{ background: "none", border: "none", color: T.muted, fontFamily: F.ui, fontSize: 10, cursor: "pointer", padding: 0, marginBottom: 8 }}>
              {hideDone ? `▸ mostrar concluídas (${doneCount})` : `▾ ocultar concluídas (${doneCount})`}
            </button>
          )}
          {visible.length === 0 && <Empty text={hideDone ? "Todas concluídas estão ocultas." : "Nada por aqui ainda."} />}

/* ==================== ÁRVORE DO RENASCIMENTO (desenho) ==================== */
/* Árvore do Renascimento — cena nas montanhas que acompanha a hora real.
   rebirthTreeSVG(p): desenha a cena uma vez (forma vem do progresso).
   rebirthApplyTime(svg, hour, rk): pinta céu, sol, lua e luz para uma hora (sem redesenhar).
   rebirthTimelapse(svg, hour, rk): em ~4 s corre do amanhecer até a hora atual. */
const rbLerp = (a, b, t) => a + (b - a) * t;
const rbMix = (c1, c2, t) => {
  const a = parseInt(c1.slice(1), 16), b = parseInt(c2.slice(1), 16);
  const ch = (sh) => Math.round(rbLerp((a >> sh) & 255, (b >> sh) & 255, t));
  return `#${[16, 8, 0].map((sh) => ch(sh).toString(16).padStart(2, "0")).join("")}`;
};
/* horários perto dos de Jaru (RO): sol nasce ~5h35 e se põe ~18h05 */
const RB_SKY = [
  [0, "#060a1c", "#0d1734", "#17244a", "#0a1030", 0.62],
  [4.4, "#0b1230", "#1f2350", "#3a2f5e", "#141a40", 0.5],
  [5.4, "#2b3a78", "#b0607a", "#ffb08a", "#6a3a5a", 0.28],
  [6.6, "#4a8ad0", "#a8cfe8", "#ffe2b8", "#ffb070", 0.08],
  [8.5, "#3f8fd8", "#8cc8ee", "#d8eef6", "#ffffff", 0],
  [15.8, "#3f8fd8", "#8cc8ee", "#d8eef6", "#ffffff", 0],
  [17.1, "#4a7cc8", "#f0b070", "#ffd38a", "#ff9a40", 0.1],
  [18.0, "#2e3470", "#d0606a", "#ff9248", "#c0503a", 0.24],
  [18.9, "#141a40", "#4a2c5c", "#9a4a5a", "#20204a", 0.45],
  [19.8, "#070b1f", "#0f1a3a", "#1c2a4f", "#0a1030", 0.6],
  [24, "#060a1c", "#0d1734", "#17244a", "#0a1030", 0.62],
];
const RB_SUNRISE = 5.55, RB_DAYLEN = 12.5;
function rbSkyAt(hour) {
  const h = ((hour % 24) + 24) % 24;
  let k0 = RB_SKY[0], k1 = RB_SKY[1];
  for (let i = 0; i < RB_SKY.length - 1; i++) if (h >= RB_SKY[i][0] && h <= RB_SKY[i + 1][0]) { k0 = RB_SKY[i]; k1 = RB_SKY[i + 1]; break; }
  const t = (h - k0[0]) / Math.max(0.001, k1[0] - k0[0]);
  const amt = rbLerp(k0[5], k1[5], t);
  return { h, top: rbMix(k0[1], k1[1], t), mid: rbMix(k0[2], k1[2], t), hor: rbMix(k0[3], k1[3], t), tint: rbMix(k0[4], k1[4], t), amt, night: Math.max(0, Math.min(1, (amt - 0.2) / 0.4)) };
}

function rebirthTreeSVG(p) {
  const W = p.w || 400, H = p.h || 480;
  const esc = (t) => String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
  const U = p.uid || "rb";
  let seed = 11;
  const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
  const f = (n) => n.toFixed(1);
  const life = Math.min(1, p.level / 25);
  const rk = Math.min(1, (p.rankIdx || 0) / 5);
  const vig = Math.max(0, Math.min(1, p.vigor));
  const cx = W / 2, groundY = H - 70;
  const trunkH = 92 + Math.min(88, p.level * 3.6);
  const tw = 15 + life * 13;
  /* paleta: cada cor da paisagem vira uma variável que muda com a luz da hora */
  const pal = {};
  const cv = (base) => { let k = Object.keys(pal).find((x) => pal[x] === base); if (!k) { k = `c${Object.keys(pal).length}`; pal[k] = base; } return `var(--${k})`; };
  const bark = cv("#4a2e1c"), barkL = cv("#7a5236"), barkD = cv("#2e1b10");
  const g = (a, b) => rbMix(a, b, 0.35 + vig * 0.65);
  const g1 = cv(g("#8a8f3a", "#2e7d32")), g2 = cv(g("#a8a44a", "#43a047")), g3 = cv(g("#c9c46a", "#7cc95a")), g4 = cv(g("#e0d890", "#b6e886"));
  const o = [];
  o.push(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="100%" style="display:block" data-u="${U}" data-rk="${rk}">`);
  o.push(`<defs>
    <linearGradient id="${U}Sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--sky0)"/><stop offset=".55" style="stop-color:var(--sky1)"/><stop offset="1" style="stop-color:var(--sky2)"/></linearGradient>
    <radialGradient id="${U}Sun"><stop offset="0" style="stop-color:var(--sunCore)"/><stop offset=".25" style="stop-color:var(--sunGlow)" stop-opacity=".9"/><stop offset="1" style="stop-color:var(--sunGlow)" stop-opacity="0"/></radialGradient>
    <linearGradient id="${U}Bark" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color:${barkD}"/><stop offset=".45" style="stop-color:${barkL}"/><stop offset="1" style="stop-color:${bark}"/></linearGradient>
    <linearGradient id="${U}Hill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:${cv("#6cbf4a")}"/><stop offset="1" style="stop-color:${cv("#2f7a2c")}"/></linearGradient>
    <linearGradient id="${U}Ray" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff6c8" stop-opacity=".55"/><stop offset="1" stop-color="#fff6c8" stop-opacity="0"/></linearGradient>
    <radialGradient id="${U}Bloom"><stop offset="0" stop-color="#fffbe8"/><stop offset=".5" stop-color="#ffe27a" stop-opacity=".8"/><stop offset="1" stop-color="#ffe27a" stop-opacity="0"/></radialGradient>
    <radialGradient id="${U}Fruit" cx=".38" cy=".35"><stop offset="0" stop-color="#fff6c0"/><stop offset=".45" stop-color="#f4b81e"/><stop offset="1" stop-color="#b06d08"/></radialGradient>
    <radialGradient id="${U}Bud"><stop offset="0" stop-color="#fff0a0"/><stop offset=".5" stop-color="#ffb02e" stop-opacity=".7"/><stop offset="1" stop-color="#ffb02e" stop-opacity="0"/></radialGradient>
  </defs>`);
  o.push(`<rect width="${W}" height="${H}" fill="url(#${U}Sky)"/>`);
  /* estrelas (acendem com a noite) */
  o.push(`<g class="rb-stars" style="opacity:0">`);
  for (let i = 0; i < 46; i++) o.push(`<circle class="star" style="animation-delay:${f(rnd() * 4)}s" cx="${f(rnd() * W)}" cy="${f(rnd() * 230)}" r="${(0.6 + rnd() * 1.1).toFixed(2)}" fill="#ffffff" opacity="${(0.4 + rnd() * 0.6).toFixed(2)}"/>`);
  o.push(`</g>`);
  /* sol: desenhado na origem e levado pelo céu via transform */
  o.push(`<g class="rb-sun" style="opacity:0">`);
  if (rk > 0) for (let i = 0; i < 5; i++) {
    const a1 = (112 + i * 13) * Math.PI / 180, a2 = (117 + i * 13) * Math.PI / 180;
    o.push(`<path class="ray rb-ray" style="animation-delay:${i * 0.9}s" d="M 0 0 L ${f(Math.cos(a1) * 560)} ${f(Math.sin(a1) * 560)} L ${f(Math.cos(a2) * 560)} ${f(Math.sin(a2) * 560)} Z" fill="url(#${U}Ray)" opacity="${(0.15 + rk * 0.35).toFixed(2)}"/>`);
  }
  o.push(`<circle class="rb-sunglow" r="80" fill="url(#${U}Sun)"/><circle r="17" style="fill:var(--sunCore)"/></g>`);
  /* lua crescente */
  o.push(`<g class="rb-moon" style="opacity:0"><circle r="38" fill="#cfd8ff" opacity=".12"/><circle r="14" fill="#f2f4ff"/><circle cx="5" cy="-3" r="12" style="fill:var(--sky0)" opacity=".92"/></g>`);
  /* nuvens */
  for (let i = 0; i < 4; i++) {
    const y = 30 + i * 34 + rnd() * 20, s = 0.6 + rnd() * 0.7, dur = 60 + rnd() * 50;
    o.push(`<g class="cloud" style="animation-duration:${f(dur)}s;animation-delay:${f(-rnd() * dur)}s"><g transform="translate(0 ${f(y)}) scale(${f(s)})" opacity=".9">
      <ellipse cx="0" cy="0" rx="34" ry="12" style="fill:var(--cloud)"/><ellipse cx="-16" cy="-6" rx="18" ry="12" style="fill:var(--cloud)"/><ellipse cx="12" cy="-9" rx="20" ry="14" style="fill:var(--cloud)"/><ellipse cx="2" cy="4" rx="40" ry="8" style="fill:var(--cloudB)"/></g></g>`);
  }
  /* montanhas */
  const far = [[0, 250], [40, 190], [80, 225], [130, 150], [175, 205], [215, 170], [262, 215], [300, 140], [345, 200], [400, 175], [400, 300], [0, 300]];
  o.push(`<path d="M ${far.map(([x, y]) => `${x} ${y}`).join(" L ")} Z" style="fill:${cv("#9db8d0")}"/>`);
  [[130, 150], [300, 140], [40, 190]].forEach(([x, y]) => o.push(`<path d="M ${x - 14} ${y + 16} L ${x} ${y} L ${x + 15} ${y + 17} L ${x + 6} ${y + 13} L ${x} ${y + 19} L ${x - 6} ${y + 12} Z" style="fill:${cv("#f4f8fb")}"/>`));
