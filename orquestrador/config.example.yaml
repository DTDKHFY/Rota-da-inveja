# Copia para config.yaml e ajusta. O config.yaml esta no .gitignore.
# Segredos NAO entram aqui — o token do Telegram vem de TELEGRAM_BOT_TOKEN (.env).

telegram:
  # So estes chat_ids podem dar ordens ao orquestrador. Qualquer outro e ignorado
  # em silencio e registado. Descobre o teu falando com @userinfobot no Telegram.
  allowed_chat_ids:
    - 000000000
  poll_timeout_sec: 30

llm:
  provider: ollama          # ollama | fake (fake = para testes, nao chama modelo)
  base_url: http://localhost:11434
  request_timeout_sec: 300
  temperature: 0.2
  num_ctx: 8192
  max_json_retries: 3       # tentativas de reparar JSON invalido antes de desistir
  # Um modelo por agente. Ve os nomes EXATOS com: ollama list
  #
  # Atencao aos modelos com sufixo `:cloud`: nao correm na tua maquina. O
  # conteudo que lhes mandas — incluindo o teu codigo de estrategia — sai daqui.
  # Se isso te incomodar, poe o agente de desenvolvimento num modelo local.
  models:
    research: minimax-m3:cloud      # Agente Pesquisa: decide o que investigar
    coder: dcxglm-5.2:cloud         # Agente Desenvolvimento: escreve o codigo
    proposer: qwen2.5-coder:7b      # so usado no modo `params`
    report: gemma4:26b              # frase de leitura no Telegram (opcional)

target:
  # Onde vive o teu codigo de backtest. NAO e este repositorio.
  path: /caminho/para/o/teu/backtest
  # Comando que corre um backtest. Placeholders disponiveis:
  #   {params_file}  JSON com os parametros do ensaio
  #   {metrics_file} onde o teu script deve escrever o JSON de metricas
  #   {start} {end}  limites de data da janela a testar (YYYY-MM-DD)
  backtest_cmd: "python run_backtest.py --params {params_file} --start {start} --end {end} --out {metrics_file}"
  timeout_sec: 1800
  network: false            # true = deixa o backtest aceder a rede (evita se puderes)
  # Pastas que o backtest precisa mas que nao estao no git (dados historicos, cache).
  # Sao ligadas por symlink dentro do worktree em vez de copiadas a cada ensaio.
  link_paths:
    - data
    - cache
  # Onde vivem os parametros em producao. Uma proposta aprovada e escrita aqui,
  # num ramo git novo — nunca no ramo ativo. Es tu que fazes o merge.
  params_file: params.json
  # O que o agente VE. Por omissao, tudo o que esta versionado no git.
  # Ver o arnes nao lhe da poder sobre ele — a lista de edicao e verificada em
  # separado. O que ver lhe da e contexto: sem isso escreve codigo que nao
  # encaixa na interface que o resto do sistema espera.
  visible_paths: ["*"]
  max_visible_files: 40

  # === A guarda mais importante do modo `code` ===
  # Os UNICOS ficheiros que o Agente de Desenvolvimento pode alterar.
  #
  # Deixa de fora tudo o que corre e mede o backtest. Um agente cuja tarefa e
  # melhorar o Sharpe tem um atalho obvio: reescrever a funcao que o calcula.
  # Nao e um cenario rebuscado — e o caminho de menor resistencia.
  #
  # Regra pratica: so a estrategia. Nunca o arnes, nunca os dados, nunca os
  # testes que a validam.
  editable_paths:
    - estrategia
  # Para quando a estrategia e as metricas vivem no MESMO ficheiro — o caso
  # comum em backtests que cresceram organicamente. Aí a lista acima nao protege
  # nada: para o agente mexer na estrategia tem de poder mexer no ficheiro
  # inteiro, incluindo o Sharpe.
  #
  # Estas funcoes ficam congeladas: depois de cada alteracao o codigo delas e
  # comparado com o original, e qualquer diferenca faz a proposta ser recusada,
  # com o motivo devolvido ao modelo.
  frozen_functions: []
  # Variaveis de ambiente que o teu backtest precisa (uma chave de API de dados,
  # por exemplo). So os NOMES; os valores vem do teu ambiente. Tudo o que nao
  # estiver aqui fica de fora — e assim que o token do Telegram nunca chega ao
  # subprocesso.
  env_passthrough: []
  #  - CHAVE_API_DADOS
  #  - calcular_sharpe
  #  - calcular_drawdown
  #  - gravar_resultado
  # Testes do projeto-alvo. Correm depois de aplicar a alteracao e ANTES do
  # backtest: um erro de sintaxe apanhado em 2s poupa 40 minutos.
  test_cmd: "python -m pytest testes -q"

experiment:
  # params = o agente so escolhe valores dentro dos limites abaixo
  # code   = o Agente de Desenvolvimento altera o codigo da estrategia
  mode: code
  # Travao de tamanho no modo `code`. Uma proposta que toca 300 linhas nao e uma
  # hipotese testavel — e uma reescrita, e nao ha como rever isso pelo Telegram.
  max_edit_lines: 120
  # Limites duros. O LLM nao consegue propor nada fora daqui — e validado em codigo.
  params_schema:
    sma_fast:
      type: int
      min: 2
      max: 50
    sma_slow:
      type: int
      min: 10
      max: 300
    stop_atr:
      type: float
      min: 0.5
      max: 6.0
    risco_por_trade:
      type: float
      min: 0.001
      max: 0.02

protocol:
  # Janela onde o agente pode otimizar a vontade.
  train_start: "2015-01-01"
  train_end: "2021-12-31"
  # Janela onde se mede o resultado out-of-sample de cada ensaio.
  validation_start: "2022-01-01"
  validation_end: "2023-12-31"
  # Holdout: o agente NUNCA corre aqui. So tu, manualmente, com /holdout.
  holdout_start: "2024-01-01"
  holdout_end: "2025-12-31"
  # Trava de multiple testing: acima disto o estudo fecha e tens de abrir outro.
  max_trials_per_study: 200

gate:
  # Criterios deterministicos. Se falhar qualquer um, nem chega a pedir aprovacao.
  min_trades: 100
  min_oos_sharpe: 0.5
  max_oos_drawdown: 0.25
  min_dsr: 0.95                    # Deflated Sharpe Ratio (probabilidade)
  require_oos_improvement_pct: 5.0 # tem de bater a baseline em pelo menos isto
  # Diferenca maxima tolerada entre in-sample e out-of-sample antes de cheirar a overfit
  max_is_oos_sharpe_gap: 1.0

storage:
  db_path: ./data/orq.db
  worktrees_dir: ./data/worktrees
  log_dir: ./data/logs
