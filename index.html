@property --scn{syntax:'<integer>';inherits:false;initial-value:0}
@keyframes scCount{from{--scn:0}to{--scn:var(--to)}}
.sc-count{animation:scCount 1.2s cubic-bezier(.2,.8,.2,1) .3s both;counter-reset:scn var(--scn)}
.sc-count::after{content:counter(scn)}
@keyframes scDrift{from{transform:translateX(-140px)}to{transform:translateX(560px)}}
.sc-cloud{animation:scDrift linear infinite}
@keyframes scTw{0%,100%{opacity:.25}50%{opacity:1}}
.sc-star{animation:scTw 3s ease-in-out infinite}
@keyframes scTrail{from{stroke-dashoffset:100}to{stroke-dashoffset:var(--off)}}
.sc-trail{stroke-dasharray:100;animation:scTrail 1.6s cubic-bezier(.3,.9,.3,1) .4s both}
@keyframes scWalk{from{left:var(--l0);top:var(--t0)}to{left:var(--l1);top:var(--t1)}}
.sc-walk{animation:scWalk 1.6s cubic-bezier(.3,.9,.3,1) .4s both}
@keyframes scBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.sc-bob{animation:scBob 1.8s ease-in-out 2s infinite}
@keyframes scWave{0%,100%{transform:skewY(0) scaleX(1)}50%{transform:skewY(-10deg) scaleX(.92)}}
.sc-wave{transform-origin:left center;animation:scWave 1.7s ease-in-out infinite}
@keyframes scFlick{0%,100%{transform:scale(1,1) rotate(-2deg)}25%{transform:scale(1.06,.94) rotate(2deg)}50%{transform:scale(.94,1.08) rotate(-3deg)}75%{transform:scale(1.03,.97) rotate(1deg)}}
.sc-flame{transform-origin:50% 100%;animation:scFlick .9s ease-in-out infinite}
@keyframes scGlow{0%,100%{opacity:.45;transform:scale(.95)}50%{opacity:.85;transform:scale(1.08)}}
.sc-glow{animation:scGlow 1.6s ease-in-out infinite}
@keyframes scSmoke{0%{transform:translate(0,0) scale(.6);opacity:.55}100%{transform:translate(8px,-46px) scale(2);opacity:0}}
.sc-smoke{animation:scSmoke 2.4s ease-out infinite}
@keyframes scEmber{0%{transform:translate(0,0);opacity:1}100%{transform:translate(var(--dx),-60px);opacity:0}}
.sc-ember{animation:scEmber 1.8s ease-out infinite}
@keyframes scLight{0%{transform:scale(0);opacity:0}70%{transform:scale(1.2);opacity:1}100%{transform:scale(1);opacity:1}}
.sc-light{transform-origin:50% 100%;animation:scLight .5s ease both}
@keyframes scWait{0%,100%{opacity:.25}50%{opacity:.9}}
.sc-wait{animation:scWait 1.4s ease-in-out infinite}
@keyframes scRise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.sc-rise{animation:scRise .5s ease both}
@keyframes scFill{from{width:0}to{width:var(--w)}}
.sc-fill{animation:scFill 1.2s cubic-bezier(.2,.8,.2,1) .5s both}
@keyframes hcWin{0%{transform:scaleY(.02);opacity:0}40%{transform:scaleY(.02);opacity:1}100%{transform:scaleY(1);opacity:1}}
.hc-win{transform-origin:center;animation:hcWin .7s cubic-bezier(.2,.9,.3,1) both}
@keyframes hcType{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.hc-type{animation:hcType .6s steps(18) both}
@keyframes hcShine{0%{transform:translateX(-50px)}100%{transform:translateX(320px)}}
.hc-shine{animation:hcShine 2.4s ease-in-out 2.4s infinite}
@keyframes hcSpin{to{transform:rotate(360deg)}}
.hc-spin{animation:hcSpin var(--spd) linear infinite}
@keyframes hcSpinR{to{transform:rotate(-360deg)}}
.hc-spinr{animation:hcSpinR calc(var(--spd) * 1.6) linear infinite}
@keyframes hcBreath{0%,100%{opacity:var(--lo);transform:scale(.94)}50%{opacity:var(--hi);transform:scale(1.06)}}
.hc-breath{animation:hcBreath 2.6s ease-in-out infinite}
@keyframes hcMote{0%{transform:translateY(0) scale(1);opacity:0}15%{opacity:1}100%{transform:translateY(-150px) scale(.3);opacity:0}}
.hc-mote{animation:hcMote var(--d) ease-out infinite}
@keyframes hcCrystal{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.hc-crystal{transform-origin:50% 100%;animation:hcCrystal .7s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes hcPulse{0%,100%{filter:drop-shadow(0 0 2px var(--c))}50%{filter:drop-shadow(0 0 14px var(--c)) brightness(1.4)}}
.hc-pulse{animation:hcCrystal .7s cubic-bezier(.2,.9,.3,1.2) both,hcPulse 1.3s ease-in-out 1.6s infinite}
@keyframes hcBeam{0%,100%{opacity:.15}50%{opacity:.4}}
.hc-beam{animation:hcBeam 3s ease-in-out infinite}
@keyframes hcHero{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
