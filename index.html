/* ==================== ARMAZENAMENTO LOCAL (celular) ====================
   Fora do Claude não existe window.storage, então guardamos tudo no
   localStorage do navegador. Os dados ficam salvos apenas neste
   navegador/celular — não sincronizam com a versão usada dentro do Claude. */
async function storageGet(key) {
  try {
    const v = localStorage.getItem(key);
    return v !== null ? { value: v } : null;
  } catch (e) { return null; }
}
async function storageSet(key, value) {
  try { localStorage.setItem(key, value); return { value }; } catch (e) { return null; }
}

const MONTHS_PT = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
const WEEKDAYS_PT = ["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sáb"];

/* ==================== NÍVEL / TÍTULO / RANK ==================== */
const costToNext = (lvl) => Math.round(100 * Math.pow(1.35, lvl));
function levelFromXP(xp) {
  let lvl = 0, acc = 0;
  while (xp >= acc + costToNext(lvl)) { acc += costToNext(lvl); lvl++; }
  return { lvl, into: xp - acc, need: costToNext(lvl), base: acc };
}
const TITLES = [
  [0, "Fracassado"], [1, "Iniciante"], [2, "Aprendiz"], [3, "Aspirante"],
  [5, "Lutador"], [8, "Caçador"], [12, "Veterano"], [18, "Elite"],
  [25, "Mestre"], [35, "Lorde"], [50, "Monarca"],
];
function titleFor(lvl) {
  let t = TITLES[0][1];
  for (const [min, name] of TITLES) if (lvl >= min) t = name;
  return t;
}
function rankFromLevel(lvl) {
  if (lvl >= 25) return "S";
  if (lvl >= 15) return "A";
  if (lvl >= 10) return "B";
  if (lvl >= 6) return "C";
  if (lvl >= 3) return "D";
  return "E";
}
function totalXPForLevel(target) {
  let acc = 0;
  for (let l = 0; l < target; l++) acc += costToNext(l);
  return acc;
}
const attrLevel = (pts) => Math.floor((pts || 0) / 100);

/* ==================== DATAS (semana dom–sáb) ==================== */
const dayKey = (d) => {
  const x = new Date(d);
  return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, "0")}-${String(x.getDate()).padStart(2, "0")}`;
};
function weekStartKey(d) {
  const x = new Date(d);
  x.setHours(0, 0, 0, 0);
  x.setDate(x.getDate() - x.getDay());
  return dayKey(x);
}
const monthKey = (d) => {
  const x = new Date(d);
  return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, "0")}`;
};
const daysBetween = (a, b) => Math.round((new Date(b) - new Date(a)) / 86400000);

/* ==================== ESTADO INICIAL ==================== */
const initialState = () => ({
  xp: 0,
  coins: 0,
  streak: 0,
  heroName: "",
  deadline: DEFAULT_DEADLINE,
  attrs: DEFAULT_ATTRS.reduce((o, a) => ({ ...o, [a]: 0 }), {}),
  finals: [],
  monthlies: [],
  weeklies: [],
  shop: [
    { id: 1, icon: "📖", title: "Grimório do Otaku", effect: "Liberação para assistir um anime", price: 200, rarity: "Raro" },
    { id: 2, icon: "📜", title: "Pergaminho do Sono Eterno", effect: "Direito de dormir o dia inteiro", price: 800, rarity: "Lendário" },
    { id: 3, icon: "🧪", title: "Poção da Gula", effect: "Comer o que quiser por um dia", price: 350, rarity: "Raro" },
    { id: 4, icon: "🗝️", title: "Chave do Portal", effect: "Um dia inteiro livre de metas, sem penalidade", price: 600, rarity: "Épico" },
  ],
  nofap: { active: false, start: null, best: 0, rewarded: 0 },
  history: [],
  lastWeek: weekStartKey(new Date()),
  lastMonth: monthKey(new Date()),
  stats: { weeklyDone: 0, weeklyFail: 0 },
});

function migrateShop(shop) {
  let out = (shop || []).map((it) => ({
    icon: it.icon || (it.rarity === "Lendário" ? "📜" : "📦"),
    ...it,
    effect: it.effect || it.title,
    rarity: it.rarity || (it.price >= 500 ? "Lendário" : "Raro"),
  }));
  if ((shop || []).length && (shop || []).every((it) => !it.icon)) {
    const have = new Set(out.map((i) => i.id));
    initialState().shop.forEach((ex) => { if (!have.has(ex.id)) out.push(ex); });
  }
  return out;
}

const goalXP = (g, isFinal) => g.xp || (isFinal ? XP_FINAL : XP_GOAL[g.diff] || 100);

/* ==================== CSS / ANIMAÇÕES ==================== */
const CSS = `
@keyframes floatUp { 0%{transform:translateY(0);opacity:1} 100%{transform:translateY(-60px);opacity:0} }
@keyframes popIn { 0%{transform:scale(.4);opacity:0} 60%{transform:scale(1.12)} 100%{transform:scale(1);opacity:1} }

@keyframes radarIn { 0%{transform:scale(.5);opacity:0} 100%{transform:scale(1);opacity:1} }
@keyframes particle { 0%{transform:translate(0,0) scale(1);opacity:1} 100%{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0} }

`;

/* ==================== APP ==================== */
function App() {
  const [state, setState] = useState(null);
  const [tab, setTab] = useState("dash");
  const [flash, setFlash] = useState(null);
  const [floaters, setFloaters] = useState([]);
  const [particles, setParticles] = useState([]);
  const [confirmRelapse, setConfirmRelapse] = useState(false);
  const loaded = useRef(false);

  useEffect(() => {
    (async () => {
      let s = initialState();
      try {
        const r = await storageGet("sistema_v1");
        if (r && r.value) {
          const p = JSON.parse(r.value);
          s = {
            ...initialState(),
            ...p,
            heroName: p.heroName || "",
            deadline: p.deadline || DEFAULT_DEADLINE,
            attrs: { ...initialState().attrs, ...(p.attrs || {}) },
            nofap: { ...initialState().nofap, ...(p.nofap || {}) },
            shop: migrateShop(p.shop && p.shop.length ? p.shop : initialState().shop),
          };
        }
      } catch (e) { /* primeira vez */ }
      s = processRollover(s);
      loaded.current = true;
      setState(s);
    })();
  }, []);

  useEffect(() => {
    if (!state || !loaded.current) return;
    const t = setTimeout(async () => {
      try { await storageSet("sistema_v1", JSON.stringify(state)); } catch (e) { console.error(e); }
    }, 400);
    return () => clearTimeout(t);
  }, [state]);

  function spawnFloat(text, good) {
    const id = Date.now() + Math.random();
    setFloaters((f) => [...f, { id, text, good }]);
    setTimeout(() => setFloaters((f) => f.filter((x) => x.id !== id)), 1300);
  }
  function burstParticles() {
    const ps = Array.from({ length: 16 }, (_, i) => ({
      id: Date.now() + i,
      dx: `${(Math.random() - 0.5) * 260}px`,
      dy: `${(Math.random() - 0.9) * 240}px`,
    }));
    setParticles(ps);
    setTimeout(() => setParticles([]), 1000);
  }
  useEffect(() => {
    if (!flash) return;
    const t = setTimeout(() => setFlash(null), 2200);
    return () => clearTimeout(t);
  }, [flash]);

  function processRollover(s) {
    const now = new Date();
    const today = dayKey(now);
    const thisWeek = weekStartKey(now);
    const thisMonth = monthKey(now);
    let xp = s.xp, coins = s.coins, streak = s.streak;
    let attrs = { ...s.attrs };
    let nofap = { ...s.nofap };
    const hist = [...s.history];
    let stats = { ...s.stats };
    const log = (type, text, delta) => hist.unshift({ date: today, type, text, xp: delta });
    const before = levelFromXP(xp).lvl;

    const hitAttrs = (goal, amount) => {
      (goal.attrs || []).forEach((a) => {
        if (attrs[a] !== undefined) attrs[a] = Math.max(0, attrs[a] - amount);
      });
    };

    let weeklies = s.weeklies;
    if (s.lastWeek !== thisWeek && weeklies.length) {
      const fails = weeklies.filter((g) => !g.done);
      const wins = weeklies.filter((g) => g.done);
      stats.weeklyDone += wins.length;
      stats.weeklyFail += fails.length;
      if (fails.length) {
        let pen = 0;
        fails.forEach((g) => {
          const p = Math.round(goalXP(g) * PENALTY_RATE);
          pen += p;
          hitAttrs(g, p);
        });
        xp = Math.max(0, xp - pen);
        log("penalty", `Semana encerrada: ${fails.length} meta(s) falharam`, -pen);
        streak = 0;
        log("info", "Streak zerado. A rota exige mais.", 0);
      } else {
        streak += 1;
        log("info", `Semana perfeita. Streak: ${streak}`, 0);
      }
      weeklies = [];
    }

    let monthlies = s.monthlies;
    if (s.lastMonth !== thisMonth && monthlies.length) {
      const fails = monthlies.filter((g) => !g.done);
      if (fails.length) {
        let pen = 0;
        fails.forEach((g) => {
          const p = Math.round(goalXP(g) * PENALTY_RATE);
          pen += p;
          hitAttrs(g, p);
        });
        xp = Math.max(0, xp - pen);
        log("penalty", `Mês encerrado: ${fails.length} meta(s) falharam`, -pen);
      }
      monthlies = [];
    }

    if (nofap.active && nofap.start) {
      const days = Math.max(1, daysBetween(nofap.start, today) + 1);
      const milestones = Math.floor(days / 7);
      if (milestones > (nofap.rewarded || 0)) {
        const n = milestones - (nofap.rewarded || 0);
        xp += n * NOFAP_WEEK_XP;
        coins += n * NOFAP_WEEK_COINS;
        nofap.rewarded = milestones;
        log("gain", `NoFap: ${milestones} semana(s) de sequência — bônus`, n * NOFAP_WEEK_XP);
      }
      if (days > (nofap.best || 0)) nofap.best = days;
    }

    const after = levelFromXP(xp).lvl;
    if (after < before) log("leveldown", `Você caiu para o nível ${after} — ${titleFor(after)}`, 0);

    return { ...s, xp, coins, streak, attrs, nofap, stats, history: hist.slice(0, 120), weeklies, monthlies, lastWeek: thisWeek, lastMonth: thisMonth };
  }

  function applyXP(s, delta, text, extra = {}) {
    const before = levelFromXP(s.xp).lvl;
    const xp = Math.max(0, s.xp + delta);
    const coinDelta = extra.coins !== undefined ? extra.coins : Math.round(Math.max(0, delta) * COIN_RATE) * (delta >= 0 ? 1 : 0) - (delta < 0 && extra.refundCoins ? extra.refundCoins : 0);
    const coins = Math.max(0, s.coins + coinDelta);
    const after = levelFromXP(xp).lvl;
    const hist = [{ date: dayKey(new Date()), type: delta >= 0 ? "gain" : "penalty", text, xp: delta }, ...s.history];
    if (after > before) {
      hist.unshift({ date: dayKey(new Date()), type: "levelup", text: `Nível ${after} — ${titleFor(after)}`, xp: 0 });
      setFlash({ kind: "up", text: `NÍVEL ${after} · ${titleFor(after).toUpperCase()}` });
      burstParticles();
    } else if (after < before) {
      hist.unshift({ date: dayKey(new Date()), type: "leveldown", text: `Caiu para o nível ${after} — ${titleFor(after)}`, xp: 0 });
      setFlash({ kind: "down", text: `NÍVEL ${after} · ${titleFor(after).toUpperCase()}` });
    }
    return { ...s, xp, coins, history: hist.slice(0, 120) };
  }

  function toggleItem(listKey, id, isFinal) {
    setState((s) => {
      const list = s[listKey].map((g) => ({ ...g }));
      const g = list.find((x) => x.id === id);
      if (!g) return s;
      g.done = !g.done;
      const val = goalXP(g, isFinal);
      const delta = g.done ? val : -val;
      const attrs = { ...s.attrs };
      (g.attrs || []).forEach((a) => {
        if (attrs[a] !== undefined) attrs[a] = Math.max(0, attrs[a] + delta);
      });
      spawnFloat(`${delta > 0 ? "+" : ""}${delta} XP`, delta > 0);
      return applyXP(
        { ...s, [listKey]: list, attrs },
        delta,
        g.done ? `Concluído: ${g.title}` : `Revertido: ${g.title}`,
        delta < 0 ? { refundCoins: Math.round(val * COIN_RATE) } : {}
      );
    });
  }

  function addItem(listKey, title, diff, attrsSel, xpCustom) {
    setState((s) => ({
      ...s,
      [listKey]: [...s[listKey], { id: Date.now() + Math.random(), title, diff, done: false, attrs: attrsSel || [], xp: xpCustom || null }],
    }));
  }
  const removeItem = (listKey, id) =>
    setState((s) => ({ ...s, [listKey]: s[listKey].filter((g) => g.id !== id) }));

  function buyItem(item) {
    setState((s) => {
      if (s.coins < item.price) return s;
      spawnFloat(`−${item.price} 🪙`, false);
      return {
        ...s,
        coins: s.coins - item.price,
        history: [{ date: dayKey(new Date()), type: "shop", text: `${item.icon} ${item.title} usado: ${item.effect}`, xp: 0 }, ...s.history].slice(0, 120),
      };
    });
  }
  const addShopItem = (icon, title, effect, price, rarity) =>
    setState((s) => ({ ...s, shop: [...s.shop, { id: Date.now(), icon, title, effect, price, rarity }] }));
  const removeShopItem = (id) =>
    setState((s) => ({ ...s, shop: s.shop.filter((i) => i.id !== id) }));

  function startNoFap() {
    setState((s) => ({
      ...s,
      nofap: { ...s.nofap, active: true, start: dayKey(new Date()), rewarded: 0 },
      history: [{ date: dayKey(new Date()), type: "info", text: "Sequência NoFap iniciada. Resista.", xp: 0 }, ...s.history].slice(0, 120),
    }));
  }
  function relapse() {
    setConfirmRelapse(false);
    setState((s) => {
      const days = s.nofap.start ? Math.max(1, daysBetween(s.nofap.start, dayKey(new Date())) + 1) : 0;
      const best = Math.max(s.nofap.best || 0, days);
      const halfLost = Math.floor(s.coins / 2);
      setFlash({ kind: "down", text: "RECAÍDA" });
      spawnFloat(`−${NOFAP_RELAPSE_XP} XP`, false);
      return applyXP(
        { ...s, coins: s.coins - halfLost, nofap: { active: true, start: dayKey(new Date()), best, rewarded: 0 } },
        -NOFAP_RELAPSE_XP,
        `☠ Recaída NoFap após ${days} dia(s). −${halfLost} moedas.`,
        { coins: 0 }
      );
    });
  }

  const addAttr = (name) =>
    setState((s) => (s.attrs[name] !== undefined ? s : { ...s, attrs: { ...s.attrs, [name]: 0 } }));
  const removeAttr = (name) =>
    setState((s) => {
      const attrs = { ...s.attrs };
      delete attrs[name];
      return { ...s, attrs };
    });
  const setDeadline = (d) => setState((s) => ({ ...s, deadline: d }));
  const setHeroName = (n) => setState((s) => ({ ...s, heroName: n }));

  if (!state)
    return (
      <div style={{ minHeight: "100vh", background: T.bg, color: T.muted, display: "flex", alignItems: "center", justifyContent: "center", fontFamily: "ui-monospace, monospace" }}>
        abrindo o Sistema…
      </div>
    );

  const { lvl, into, need } = levelFromXP(state.xp);
  const rank = rankFromLevel(lvl);
  const title = titleFor(lvl);
  const pct = Math.min(100, Math.round((into / need) * 100));
  const now = new Date();
  const today = dayKey(now);
  const daysLeft = Math.max(0, daysBetween(today, state.deadline));
  const weeksLeft = Math.max(0, Math.ceil(daysLeft / 7));
  const monthName = MONTHS_PT[now.getMonth()];
  const nextMonthName = MONTHS_PT[(now.getMonth() + 1) % 12];
  const nfDays = state.nofap.active && state.nofap.start ? Math.max(1, daysBetween(state.nofap.start, today) + 1) : 0;
  const totalW = state.stats.weeklyDone + state.stats.weeklyFail;
  const taxa = totalW ? Math.round((state.stats.weeklyDone / totalW) * 100) : null;
  const attrNames = Object.keys(state.attrs);

  const tabs = [
    { id: "dash", label: "Status" },
    { id: "week", label: `Sem ${weeksLeft}` },
    { id: "month", label: monthName },
    { id: "final", label: "Rota" },
    { id: "shop", label: "Loja" },
  ];

  return (
    <div style={{ minHeight: "100vh", background: T.bg, color: T.text, fontFamily: "system-ui, sans-serif", paddingBottom: 76, position: "relative", overflow: "hidden", animation: flash && flash.kind === "down" ? "shake .5s ease" : "none" }}>
      <style>{CSS}</style>

      <div style={{ position: "fixed", inset: 0, pointerEvents: "none", zIndex: 0 }}>
        <div style={{ position: "absolute", top: "-20%", left: "-10%", width: "80%", height: "60%", background: "radial-gradient(circle, rgba(185,28,28,0.22), transparent 65%)", filter: "blur(30px)", animation: "mistA 16s ease-in-out infinite" }} />
        <div style={{ position: "absolute", bottom: "-15%", right: "-15%", width: "75%", height: "55%", background: "radial-gradient(circle, rgba(127,29,29,0.28), transparent 60%)", filter: "blur(36px)", animation: "mistB 20s ease-in-out infinite" }} />
        <div style={{ position: "absolute", top: "35%", left: "45%", width: "40%", height: "30%", background: "radial-gradient(circle, rgba(239,68,68,0.10), transparent 70%)", filter: "blur(26px)", animation: "mistA 24s ease-in-out infinite reverse" }} />
      </div>

      <div style={{ position: "fixed", top: "38%", left: 0, right: 0, display: "flex", justifyContent: "center", zIndex: 60, pointerEvents: "none" }}>
        {floaters.map((f) => (
          <div key={f.id} style={{ position: "absolute", animation: "floatUp 1.2s ease forwards", fontFamily: "ui-monospace, monospace", fontWeight: 700, fontSize: 20, color: f.good ? T.good : "#fda4af", textShadow: `0 0 12px ${f.good ? "#166534" : T.danger}` }}>
            {f.text}
          </div>
        ))}
      </div>

      <div style={{ position: "fixed", top: "40%", left: "50%", zIndex: 55, pointerEvents: "none" }}>
        {particles.map((p) => (
          <div key={p.id} style={{ position: "absolute", width: 7, height: 7, background: T.accentSoft, boxShadow: `0 0 8px ${T.glow}`, "--dx": p.dx, "--dy": p.dy, animation: "particle .9s ease-out forwards" }} />
        ))}
      </div>

      {flash && (
        <div style={{ position: "fixed", inset: 0, display: "flex", alignItems: "center", justifyContent: "center", zIndex: 50, pointerEvents: "none" }}>
          <div style={{ padding: "18px 28px", border: `1px solid ${flash.kind === "up" ? T.accent : T.danger}`, background: "rgba(11,5,7,0.94)", boxShadow: `0 0 44px ${flash.kind === "up" ? T.glow : T.danger}`, fontFamily: "ui-monospace, monospace", letterSpacing: 3, fontSize: 19, color: flash.kind === "up" ? T.accentSoft : T.danger, animation: "popIn .3s ease", textAlign: "center" }}>
            {flash.kind === "up" ? "▲ " : "▼ "}{flash.text}
          </div>
        </div>
      )}

      {/* ===== janela do herói — SÓ na aba Status ===== */}
      {tab === "dash" && (
        <div style={{ margin: "14px 14px 10px", border: `1px solid ${T.border}`, background: T.panel, animation: "breathe 5s ease infinite", position: "relative", padding: "14px 16px", zIndex: 1 }}>
          <Corner pos="tl" /><Corner pos="tr" /><Corner pos="bl" /><Corner pos="br" />
          <div style={{ fontFamily: "ui-monospace, monospace", fontSize: 10, letterSpacing: 3, color: T.muted, textAlign: "center" }}>
            ◆ SISTEMA — ROTA DA INVEJA ◆
          </div>

          <div style={{ textAlign: "center", margin: "10px 0 4px" }}>
            <span style={{ fontSize: 40, fontWeight: 800, fontFamily: "ui-monospace, monospace", color: daysLeft <= 30 ? T.danger : T.accentSoft, animation: "countPulse 3s ease infinite", letterSpacing: 2 }}>
              {daysLeft}
            </span>
            <div style={{ fontFamily: "ui-monospace, monospace", fontSize: 9, letterSpacing: 3, color: T.muted, marginTop: 2 }}>
              DIAS ATÉ O FIM DA ROTA · SEMANA {weeksLeft} · {monthName.toUpperCase()} → {nextMonthName.toUpperCase()}
            </div>
          </div>

          <div style={{ display: "flex", alignItems: "center", gap: 12, marginTop: 12 }}>
            <Avatar size={50} color={RANK_COLOR[rank]} />
            <div style={{ flex: 1, minWidth: 0 }}>
              <input
                value={state.heroName}
                onChange={(e) => setHeroName(e.target.value)}
                placeholder="Nome do Herói…"
                maxLength={24}
                style={{ background: "transparent", border: "none", borderBottom: `1px solid ${T.border}`, color: T.text, fontSize: 16, fontWeight: 700, outline: "none", width: "100%", padding: "2px 0" }}
              />
              <div style={{ fontSize: 11, marginTop: 4 }}>
                <span style={{ color: RANK_COLOR[rank], fontWeight: 700 }}>Rank {rank}</span>
                <span style={{ color: T.muted }}> · </span>
                <span style={{ color: lvl === 0 ? T.danger : T.accentSoft, animation: lvl === 0 ? "emberFlicker 2s ease infinite" : "none" }}>「{title}」</span>
              </div>
            </div>
            <XPRing pct={pct} size={68} stroke={7} color={T.accent} trackColor="#25090d" />
          </div>

          <div style={{ display: "flex", justifyContent: "space-between", marginTop: 10, fontFamily: "ui-monospace, monospace", fontSize: 10, color: T.muted }}>
            <span>Nível {lvl} · {into}/{need} XP p/ nível {lvl + 1}</span>
            <span style={{ color: T.coin }}><span style={{ display: "inline-block", animation: "coinSpin 3s linear infinite" }}>🪙</span> {state.coins}</span>
          </div>
          <div style={{ fontFamily: "ui-monospace, monospace", fontSize: 10, color: T.muted, marginTop: 2 }}>streak {state.streak}🔥</div>
        </div>
      )}

      {/* ===== conteúdo ===== */}
      <div style={{ padding: tab === "dash" ? "0 14px" : "14px 14px 0", position: "relative", zIndex: 1 }} className="fadetab" key={tab}>
        {tab === "dash" && (

/* ==================== ANEL DE XP ==================== */
function XPRing({ pct, size, stroke, color, trackColor }) {
  const r = (size - stroke) / 2;
  const c = 2 * Math.PI * r;
  const offset = c * (1 - pct / 100);
  return (
    <div className="xpring" style={{ position: "relative", width: size, height: size, minWidth: size }}>
      <svg width={size} height={size} style={{ transform: "rotate(-90deg)" }}>
        <circle cx={size / 2} cy={size / 2} r={r} stroke={trackColor} strokeWidth={stroke} fill="none" />
        <circle className="fill" cx={size / 2} cy={size / 2} r={r} stroke={color} strokeWidth={stroke} fill="none"
          strokeDasharray={c} strokeDashoffset={offset} strokeLinecap="round"
          style={{ filter: `drop-shadow(0 0 5px ${color})` }} />
      </svg>
      <div style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center" }}>
        <span style={{ fontFamily: "ui-monospace, monospace", fontSize: size * 0.24, fontWeight: 800, color: T.text }}>{pct}%</span>
      </div>
    </div>
  );
}

/* ==================== GRÁFICO SEMANAL DE XP ==================== */
function WeeklyXPChart({ history, weekStart }) {
  const start = new Date(weekStart);
  const days = Array.from({ length: 7 }, (_, i) => {
    const d = new Date(start);
    d.setDate(start.getDate() + i);
    return d;
  });
  const sums = days.map((d) => {
    const key = dayKey(d);
    return history.filter((h) => h.date === key).reduce((a, h) => a + (h.xp || 0), 0);
  });
  const max = Math.max(20, ...sums.map((v) => Math.abs(v)));
  const todayKey = dayKey(new Date());
  return (
    <div style={{ display: "flex", alignItems: "flex-end", gap: 6, height: 108, padding: "4px 2px 0" }}>
      {sums.map((v, i) => {
        const h = Math.round((Math.abs(v) / max) * 68);
        const isToday = dayKey(days[i]) === todayKey;
        return (
          <div key={i} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "flex-end", height: "100%" }}>
            <div style={{ fontSize: 9, color: v > 0 ? T.good : v < 0 ? T.danger : T.muted, fontFamily: "ui-monospace, monospace", marginBottom: 3, minHeight: 11 }}>
              {v !== 0 ? (v > 0 ? "+" : "") + v : "·"}
            </div>
            <div style={{
              width: "62%", height: Math.max(3, h), borderRadius: 2,
              background: v > 0 ? `linear-gradient(180deg, ${T.accentSoft}, ${T.glow})` : v < 0 ? T.danger : T.border,
              boxShadow: v !== 0 ? `0 0 8px ${v > 0 ? T.glow : T.danger}` : "none",
            }} />
            <div style={{ fontSize: 9, color: isToday ? T.accentSoft : T.muted, marginTop: 5, fontFamily: "ui-monospace, monospace", fontWeight: isToday ? 700 : 400 }}>
              {WEEKDAYS_PT[i]}
            </div>
          </div>
        );
      })}
    </div>
  );
}

/* ==================== SEÇÃO RECOLHÍVEL (Semana/Mês/Rota) ==================== */
function QuickSection({ label, items, isFinal, onToggle, onAdd, accent }) {
  const [open, setOpen] = useState(false);
  const [txt, setTxt] = useState("");
  const [hideDone, setHideDone] = useState(false);
  const pending = items.filter((g) => !g.done).length;
  const doneCount = items.length - pending;
  const visible = hideDone ? items.filter((g) => !g.done) : items;
  const submit = () => {
    if (!txt.trim()) return;
    onAdd(txt.trim());
    setTxt("");
  };
  return (
    <div style={{ border: `1px solid ${accent || T.border}`, marginBottom: 8, background: T.panel2 }}>
      <button onClick={() => setOpen(!open)}
        style={{ width: "100%", display: "flex", justifyContent: "space-between", alignItems: "center", background: "none", border: "none", color: T.text, padding: "10px 12px", cursor: "pointer" }}>
        <span style={{ fontFamily: "ui-monospace, monospace", fontSize: 11, letterSpacing: 1.5, color: accent || T.text }}>{label}</span>
        <span style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <span style={{ fontFamily: "ui-monospace, monospace", fontSize: 11, color: pending ? accent || T.accentSoft : T.muted }}>
            {pending} pendente{pending === 1 ? "" : "s"}
          </span>
          <span style={{ color: T.muted }}>{open ? "▾" : "▸"}</span>
        </span>
      </button>
      {open && (
        <div style={{ padding: "0 12px 12px" }}>
          {doneCount > 0 && (
            <button onClick={() => setHideDone(!hideDone)} style={{ background: "none", border: "none", color: T.muted, fontFamily: "ui-monospace, monospace", fontSize: 10, cursor: "pointer", padding: 0, marginBottom: 8 }}>
              {hideDone ? `▸ mostrar concluídas (${doneCount})` : `▾ ocultar concluídas (${doneCount})`}
            </button>
          )}
          {visible.length === 0 && <Empty text={hideDone ? "Todas concluídas estão ocultas." : "Nada por aqui ainda."} />}
          {visible.map((g) => (
            <div key={g.id} style={{ display: "flex", alignItems: "center", gap: 8, padding: "6px 0", borderBottom: `1px solid ${T.border}44` }}>
              <button onClick={() => onToggle(g.id)}
                style={{ width: 20, height: 20, minWidth: 20, border: `1px solid ${g.done ? (accent || T.accent) : T.muted}`, background: g.done ? (accent || T.accent) : "transparent", color: g.done ? "#0b0507" : "transparent", fontSize: 11, cursor: "pointer" }}>
                ✓
              </button>
              <span style={{ flex: 1, fontSize: 13, textDecoration: g.done ? "line-through" : "none", color: g.done ? T.muted : T.text }}>{g.title}</span>
            </div>
          ))}
          <div style={{ display: "flex", gap: 6, marginTop: 8 }}>
            <input value={txt} onChange={(e) => setTxt(e.target.value)} onKeyDown={(e) => e.key === "Enter" && submit()}
              placeholder="Adicionar rápido…" style={{ ...inputStyle, padding: "7px 10px", fontSize: 13 }} />
            <button onClick={submit} style={{ ...btnPrimary, padding: "7px 12px", background: accent || T.glow }}>+</button>
          </div>
        </div>
      )}
    </div>
  );
}

  const rows = [];

/* ==================== RADAR SVG ==================== */
function RadarChart({ attrs }) {
  const names = Object.keys(attrs);
  const n = names.length;
  if (n < 3) return <Empty text="Adicione pelo menos 3 atributos para ver a roda." />;
  const size = 320, cx = size / 2, cy = size / 2, R = 96;
  const levels = names.map((a) => attrLevel(attrs[a]));
  const maxL = Math.max(5, ...levels);
  const pt = (i, r) => {
    const ang = (Math.PI * 2 * i) / n - Math.PI / 2;
    return [cx + r * Math.cos(ang), cy + r * Math.sin(ang)];
  };
  const ringPoly = (frac) => names.map((_, i) => pt(i, R * frac).join(",")).join(" ");
  const dataPoly = names.map((a, i) => pt(i, Math.max(0.04, levels[i] / maxL) * R).join(",")).join(" ");
  return (
    <svg viewBox={`0 0 ${size} ${size}`} style={{ width: "100%", maxWidth: 350, display: "block", margin: "0 auto" }}>
      {[0.25, 0.5, 0.75, 1].map((f) => (
        <polygon key={f} points={ringPoly(f)} fill="none" stroke={T.border} strokeWidth="1" />
      ))}
      {names.map((_, i) => {
        const [x, y] = pt(i, R);
        return <line key={i} x1={cx} y1={cy} x2={x} y2={y} stroke={T.border} strokeWidth="1" />;
      })}
      <polygon points={dataPoly} fill="rgba(239,68,68,0.28)" stroke={T.accent} strokeWidth="2" style={{ filter: `drop-shadow(0 0 6px ${T.glow})` }} />
      {names.map((a, i) => {
        const [x, y] = pt(i, R + 24);
        const [dx, dy] = pt(i, Math.max(0.04, levels[i] / maxL) * R);
        return (
          <g key={a}>
            <circle cx={dx} cy={dy} r="3" fill={T.accentSoft} />
            <text x={x} y={y - 4} textAnchor="middle" fill={T.text} fontSize="9.5" fontFamily="system-ui">{a}</text>
            <text x={x} y={y + 8} textAnchor="middle" fill={T.accentSoft} fontSize="8.5" fontFamily="ui-monospace, monospace">Lv {levels[i]}</text>
          </g>
        );
      })}
    </svg>
  );
}

          ))}
        </div>
        <input value={txt} onChange={(e) => setTxt(e.target.value)} placeholder="Nome do item (ex: Pergaminho do Descanso)…" style={inputStyle} />
        <input value={effect} onChange={(e) => setEffect(e.target.value)} placeholder="O que ele faz (ex: direito de dormir o dia inteiro)…" style={inputStyle} />
        <div style={{ display: "flex", gap: 8 }}>
          <select value={rarity} onChange={(e) => setRarity(e.target.value)}
            style={{ ...inputStyle, flex: 1, color: RARITIES[rarity].color, fontWeight: 700 }}>
            {Object.keys(RARITIES).map((r) => <option key={r} value={r}>{r}</option>)}
          </select>
          <input value={price} onChange={(e) => setPrice(e.target.value.replace(/\D/g, ""))} placeholder="Preço 🪙" inputMode="numeric" style={{ ...inputStyle, flex: 0.8, minWidth: 74 }} />
          <button onClick={submit} style={btnPrimary}>Forjar</button>
        </div>
      </div>
    </Section>
  );
}

/* ==================== COMPONENTES BASE ==================== */
const inputStyle = { flex: 1, background: "#1c0b0f", border: `1px solid ${T.border}`, color: T.text, padding: "10px 12px", fontSize: 14, outline: "none", minWidth: 0 };
const btnPrimary = { background: T.glow, border: "none", color: "#fff", padding: "10px 16px", fontWeight: 700, cursor: "pointer", boxShadow: `0 0 12px ${T.glow}88` };
const btnDanger = { background: "transparent", border: `1px solid ${T.danger}`, color: T.danger, padding: "8px 12px", fontSize: 12, fontWeight: 700, cursor: "pointer" };

function Corner({ pos }) {
  const s = { position: "absolute", width: 10, height: 10 };
  const map = {
    tl: { top: -1, left: -1, borderTop: "2px solid", borderLeft: "2px solid" },
    tr: { top: -1, right: -1, borderTop: "2px solid", borderRight: "2px solid" },
    bl: { bottom: -1, left: -1, borderBottom: "2px solid", borderLeft: "2px solid" },
    br: { bottom: -1, right: -1, borderBottom: "2px solid", borderRight: "2px solid" },
  };
  return <div style={{ ...s, ...map[pos], borderColor: T.accent }} />;
}

function Stat({ label, value, color }) {
  return (
    <div style={{ border: `1px solid ${T.border}`, background: T.panel, padding: "10px 8px", textAlign: "center" }}>
      <div style={{ fontSize: 17, fontWeight: 700, color: color || T.text }}>{value}</div>
      <div style={{ fontFamily: "ui-monospace, monospace", fontSize: 9, letterSpacing: 1.5, color: T.muted, marginTop: 3 }}>{label.toUpperCase()}</div>
    </div>
  );
}

function Section({ title, children, accent, glow }) {
  const style = accent
    ? { marginTop: 14, border: `1px solid ${accent}`, background: T.panel, padding: "12px 14px", "--glow": glow || accent + "66", animation: "sectionPulse 4s ease infinite" }
    : { marginTop: 14, border: `1px solid ${T.border}`, background: T.panel, padding: "12px 14px" };
  return (
    <div style={style}>
      <div style={{ fontFamily: "ui-monospace, monospace", fontSize: 10, letterSpacing: 3, color: accent || T.accentSoft, marginBottom: 8 }}>{title}</div>
      {children}
    </div>
  );
}

function Empty({ text }) {
  return <div style={{ color: T.muted, fontSize: 13, padding: "10px 0" }}>{text}</div>;
}

function GoalList({ title, hint, items, isFinal, attrNames, onToggle, onAdd, onRemove, accent, glow }) {
  const [txt, setTxt] = useState("");
  const [diff, setDiff] = useState("C");
  const [xpCustom, setXpCustom] = useState("");
  const [sel, setSel] = useState([]);
  const [hideDone, setHideDone] = useState(false);
  const color = accent || T.accent;
  const glowColor = glow || T.glow;
  const doneCount = items.filter((g) => g.done).length;
  const visibleItems = hideDone ? items.filter((g) => !g.done) : items;
  const toggleSel = (a) =>
    setSel((s) => (s.includes(a) ? s.filter((x) => x !== a) : s.length < 2 ? [...s, a] : s));
  const submit = () => {
    if (!txt.trim()) return;
    onAdd(txt.trim(), diff, sel, xpCustom ? +xpCustom : null);
    setTxt(""); setSel([]); setXpCustom("");
  };
  return (
    <Section title={title} accent={accent} glow={glow}>
      <div style={{ fontSize: 12, color: T.muted, marginBottom: 8, lineHeight: 1.5 }}>{hint}</div>

      {doneCount > 0 && (
        <button onClick={() => setHideDone(!hideDone)} style={{ background: "none", border: "none", color: T.muted, fontFamily: "ui-monospace, monospace", fontSize: 10, letterSpacing: 1, cursor: "pointer", padding: 0, marginBottom: 10 }}>
          {hideDone ? `▸ mostrar concluídas (${doneCount})` : `▾ ocultar concluídas (${doneCount})`}
        </button>
      )}

      {visibleItems.length === 0 && <Empty text={hideDone && items.length > 0 ? "Todas concluídas estão ocultas." : "Nenhuma meta aqui ainda."} />}
      {visibleItems.map((g) => {
        const val = goalXP(g, isFinal);
        return (
          <div key={g.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "10px 0", borderBottom: `1px solid ${T.border}66` }}>
            <button onClick={() => onToggle(g.id)}
              style={{ width: 26, height: 26, minWidth: 26, border: `1px solid ${g.done ? color : T.muted}`, background: g.done ? color : "transparent", color: g.done ? "#0b0507" : "transparent", fontSize: 15, cursor: "pointer", boxShadow: g.done ? `0 0 10px ${glowColor}` : "none" }}>
              ✓
            </button>
            <div style={{ flex: 1 }}>
              <div style={{ fontSize: 14, textDecoration: g.done ? "line-through" : "none", color: g.done ? T.muted : T.text }}>{g.title}</div>
              <div style={{ fontFamily: "ui-monospace, monospace", fontSize: 10, color: T.muted, marginTop: 2 }}>
                {!isFinal && <span style={{ color: RANK_COLOR[g.diff], fontWeight: 700 }}>[{g.diff}] </span>}
                +{val} XP · +{Math.round(val * COIN_RATE)} 🪙
                {!isFinal && ` · falha: −${Math.round(val * PENALTY_RATE)}`}
                {g.xp && <span style={{ color: T.gold }}> · custom</span>}
                {(g.attrs || []).length > 0 && <span style={{ color: color }}> · {g.attrs.join(", ")}</span>}
              </div>
            </div>
            <button onClick={() => onRemove(g.id)} style={{ background: "none", border: "none", color: T.muted, fontSize: 16, cursor: "pointer", padding: 6 }}>✕</button>
          </div>
        );
      })}

      <div style={{ display: "flex", gap: 8, marginTop: 14 }}>
        <input value={txt} onChange={(e) => setTxt(e.target.value)} onKeyDown={(e) => e.key === "Enter" && submit()} placeholder="Nova meta…" style={inputStyle} />
        {!isFinal && (
          <select value={diff} onChange={(e) => setDiff(e.target.value)}
            style={{ background: "#1c0b0f", border: `1px solid ${T.border}`, color: RANK_COLOR[diff], fontWeight: 700, padding: "0 8px", fontFamily: "ui-monospace, monospace" }}>
            {DIFFS.map((d) => <option key={d} value={d}>{d}</option>)}
          </select>
        )}
        <input value={xpCustom} onChange={(e) => setXpCustom(e.target.value.replace(/\D/g, ""))} placeholder="XP" inputMode="numeric"
          style={{ ...inputStyle, flex: "0 0 auto", width: 64, textAlign: "center" }} />
        <button onClick={submit} style={{ ...btnPrimary, background: color, boxShadow: `0 0 12px ${glowColor}` }}>+</button>
      </div>
      <div style={{ fontSize: 10, color: T.muted, marginTop: 6, fontFamily: "ui-monospace, monospace" }}>
        Campo XP vazio = usa a dificuldade ({isFinal ? "2000 padrão" : "E 25 · D 50 · C 100 · B 200 · A 400 · S 800"})
      </div>
      <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginTop: 10 }}>
        {attrNames.map((a) => (
          <button key={a} onClick={() => toggleSel(a)}
            style={{ border: `1px solid ${sel.includes(a) ? color : T.border}`, background: sel.includes(a) ? `${color}33` : "transparent", color: sel.includes(a) ? color : T.muted, padding: "5px 9px", fontSize: 11, cursor: "pointer" }}>
            {a}
          </button>
        ))}
        <span style={{ fontSize: 10, color: T.muted, alignSelf: "center" }}>← treina até 2 atributos</span>
      </div>
    </Section>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
